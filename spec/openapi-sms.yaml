  /broadcasts/{id}/recipients:
    parameters:
    - name: id
      in: path
      required: true
      description: The broadcast's `id` (UUID), as returned by `POST /broadcasts` or `GET /broadcasts`. An id that is not
        a UUID, or that belongs to another account, returns `404` with `broadcast not found`.
      schema:
        type: string
        format: uuid
      example: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
    post:
      tags:
      - Broadcasts
      summary: Upload recipients
      description: Sets the recipient list of a `draft` broadcast; each upload replaces the previous list. Send `multipart/form-data`
        with a `.csv` or `.xlsx` `file` (10 MB maximum) to use template variables from extra columns, or JSON with a `numbers`
        array for a plain list. Numbers without a country code are normalised to E.164 with `defaultCountry` (default `US`).
        Duplicates are dropped, invalid rows are reported in `invalid`, and numbers that opted out of SMS from you are kept
        with status `opted_out` and never sent. A broadcast can hold up to 10,000 recipients; a larger list returns `422`.
      operationId: upload-recipients
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRecipientsFile'
            encoding:
              file:
                contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRecipientsJSON'
            example:
              numbers:
              - '+14155550123'
              - '+14155550124'
              - 415 555 0125
              defaultCountry: US
      responses:
        '200':
          description: Upload summary. The broadcast's `columns` and `stats` are updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              example:
                total: 5
                valid: 3
                invalid:
                - row: 4
                  value: abc
                  reason: contains letters or symbols
                invalidCount: 1
                duplicates: 1
                optedOut: 0
                columns:
                - phone
                - name
                - amount
        '400':
          description: The body or file is not usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noFile:
                  value:
                    error: multipart field "file" is required
                noNumbers:
                  value:
                    error: numbers is required
                body:
                  value:
                    error: 'body must be multipart with a "file" field, or JSON {"numbers": [...]}'
                extension:
                  value:
                    error: file must be .csv or .xlsx
                unreadable:
                  value:
                    error: 'could not read the file: check it is a valid CSV or XLSX'
                country:
                  value:
                    error: defaultCountry must be a supported ISO 3166-1 alpha-2 code
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The broadcast does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: broadcast not found
        '409':
          description: The broadcast is no longer a draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: cannot change the recipients of a broadcast that is running
        '413':
          description: The file is larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: file is larger than 10MB
        '422':
          description: The upload has more recipients than a broadcast can hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'too many recipients: the limit is 10000 per broadcast'
      x-codeSamples:
      - lang: typescript
        label: Node SDK
        source: |
          import { VobizClient } from "@vobiz/sdk";

          const client = new VobizClient({ apiKey: "MA_XXXXXXXX", authToken: "YOUR_AUTH_TOKEN" });

