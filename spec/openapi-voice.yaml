                  - call_status
                  - call_uuid
                  - caller_name
                  - direction
                  - from
                  - request_uuid
                  - session_start
                  - stir_attestation
                  - stir_verification
                  - to

    delete:
      operationId: hangup-call
      summary: Hang up a call
      description: Terminate an active call by its UUID.
      tags: [ Live Calls ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Call terminated

