    post:
      operationId: create-trunk
      summary: Create a trunk
      description: Create a new SIP trunk for inbound or outbound calling.
      tags: [ Trunks ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Trunk name.
                trunk_direction:
                  type: string
                  enum: [ inbound, outbound ]
                  description: Direction of the trunk - **`inbound` or `outbound` only** (a trunk is one direction, not both).
                trunk_status:
                  type: string
                  enum: [ enabled, disabled ]
                  description: "Trunk status to set - `enabled` or `disabled`. Responses report `enabled` as `active` and `disabled` as `suspended`."
                secure:
                  type: boolean
                trunk_domain:
                  type: string
                  maxLength: 255
                  description: SIP domain. Auto-generated as `{first8ofUUID}.sip.vobiz.ai` if omitted.
                transport:
                  type: string
                  enum: [ udp, tcp, tls ]
                inbound_destination:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 500
                concurrent_calls_limit:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  description: Stored on the trunk. The **enforced** concurrency limit is account-level (account base + channel subscriptions), not this field.
                cps_limit:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Stored on the trunk. The **enforced** CPS is account-level, not this field.
                credential_uuid:
                  type: string
                  description: Attach an existing SIP credential (username / password / realm) by UUID.
                ipacl_uuid:
                  type: string
                  description: Attach an existing IP access-control list (IP-based auth) by UUID.
                primary_uri_uuid:
                  type: string
                  description: Primary origination URI UUID.
                fallback_uri_uuid:
                  type: string
                  description: Fallback origination URI UUID.
                recording:
                  type: boolean
                  default: false
                  description: Enable call recording.
                enable_transcription:
                  type: boolean
                  default: false
                  description: Auto-transcribe recordings when `recording=true`.
                pii_redaction:
                  type: boolean
                  default: false
                  description: Redact PII from transcriptions.
                pii_entity_types:
                  type: string
                  description: Comma-separated list of entity types to redact.
                webhook_url:
                  type: string
                  maxLength: 500
                  description: |
                    Customer webhook for call-admission events (`CallInitiated` / `Hangup`).
                    Must be a valid **public** http/https URL. SSRF-validated - localhost,
                    private (RFC1918), and cloud-metadata (`169.254.169.254`) URLs are
                    rejected with `invalid webhook_url`. See [Trunk Webhooks](/trunks/webhook).
                  example: "https://example.com/vobiz/webhook"
                webhook_method:
                  type: string
                  enum: [ POST, GET ]
                  default: POST
                  description: HTTP method for the webhook callback.
                recording_webhook_enabled:
                  type: boolean
                  default: false
                  description: Fire a `recording.completed` webhook to `webhook_url` after a recording is saved.
                username:
                  type: string
                  maxLength: 100
                  deprecated: true
                  description: "Deprecated - use `credential_uuid`."
                password:
                  type: string
                  maxLength: 100
                  deprecated: true
                  description: "Deprecated - use `credential_uuid`."
                ip_whitelist:
                  type: array
                  items:
                    type: string
                  deprecated: true
                  description: "Deprecated - use `ipacl_uuid`."
              required:
                - name
            example:
              name: "Retell AI SIP"
              trunk_direction: outbound
              transport: udp
              webhook_url: "https://example.com/vobiz/webhook"
              webhook_method: POST
              recording: true
              enable_transcription: true
              concurrent_calls_limit: 50
              cps_limit: 15
              credential_uuid: "b1e2..."
              ipacl_uuid: "c3d4..."
      responses:
        "201":
          description: Trunk created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trunk"
              example:
                trunk_id: aabbccdd-1234-5678-90ab-cdef12345678
                account_id: MA_XXXXXXXX
                name: My Outbound Trunk
                trunk_domain: aabbccdd-1234-5678-90ab-cdef12345678.sip.vobiz.ai
                trunk_status: active
                secure: false
                trunk_direction: outbound
                concurrent_calls_limit: 10
                cps_limit: 2
                description: ""
                transport: udp
                recording: false
                enable_transcription: false
                pii_redaction: false
                webhook_method: POST
                recording_webhook_enabled: false
                created_at: "2026-03-25T05:11:52.054462Z"
                updated_at: "2026-03-25T05:11:52.054462Z"
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  trunk_id:
                    type: string
                  account_id:
                    type: string
                  name:
                    type: string
                  trunk_domain:
                    type: string
                  trunk_status:
                    type: string
                    enum: [ active, suspended ]
                    description: "Trunk state as reported in responses - `active` or `suspended`. Requests set it with `enabled` (reported as `active`) or `disabled` (reported as `suspended`)."
                  secure:
                    type: boolean
                  trunk_direction:
