  /10dlc/campaigns/toll-free:
    post:
      tags:
      - 10DLC Campaigns
      summary: Create a toll-free campaign
      description: Starts toll-free verification for one or more toll-free numbers. The business details travel inside the
        request, so no brand is needed; only `name` is required, but the registry reviews every field you send. The campaign
        is created with `campaignType` `TOLL_FREE_UNIFIED_NUMBER` and no `brandId`. Pass a `referenceId` so a retried request
        reconciles to the same campaign, then submit it with `POST /10dlc/campaigns/{id}/register`.
      operationId: create-toll-free-campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TollFreeCampaignRequest'
            example:
              referenceId: tollfree-notifications-01
              name: Example Corp toll-free notifications
              useCase: NOTIFICATIONS
              messageVolume: TEN_THOUSAND
              numbers:
              - '+18335550100'
              programSummary: Example Corp sends account and support notifications to customers who opted in on the contact
                form. Reply STOP to opt out, HELP for help.
              exampleMessage: 'Example Corp: Your account balance is low. Add funds at https://example.com/wallet. Reply STOP
                to opt out, HELP for help.'
              optIns:
                web:
                  url: https://example.com/contact
                  callToAction: By checking this box you agree to receive account notifications from Example Corp. Reply STOP
                    to opt out, HELP for help.
              optInImageURLs:
              - https://example.com/opt-in-screenshot.png
              privacyPolicyUrl: https://example.com/privacy
              termsAndConditionsUrl: https://example.com/terms
              legalName: Example Corporation Inc.
              businessName: Example Corp
              businessWebsite: https://example.com
              countryCode: US
              address:
                street: 100 Example Street
                city: San Francisco
                state: CA
                zipCode: '94105'
              businessContactFirstName: Alex
              businessContactLastName: Doe
              supportPhone: '+14155550100'
              supportEmail: support@example.com
              customerCareEmail: support@example.com
              taxId: 12-3456789
              taxIdIssuingCountry: US
              legalEntityType: PRIVATE_COMPANY
      responses:
        '201':
          description: The toll-free campaign was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              example:
                id: 9c1b3e5f-7a2d-4b8c-a0e1-2f3d4c5b6a72
                accountId: MA_XXXXXXXX
                name: Example Corp toll-free notifications
                campaignType: TOLL_FREE_UNIFIED_NUMBER
                stage: DRAFT
                programSummary: Example Corp sends account and support notifications to customers who opted in on the contact
                  form. Reply STOP to opt out, HELP for help.
                customerCarePhone: '+14155550100'
                customerCareEmail: support@example.com
                exampleMessages:
                - 'Example Corp: Your account balance is low. Add funds at https://example.com/wallet. Reply STOP to opt out,
                  HELP for help.'
                termsAndConditionsUrl: https://example.com/terms
                privacyPolicyUrl: https://example.com/privacy
                useCases:
                - NOTIFICATIONS
                optIns:
                  web:
                    url: https://example.com/contact
                    callToAction: By checking this box you agree to receive account notifications from Example Corp. Reply
                      STOP to opt out, HELP for help.
                lowVolume: false
                ageGated: false
                directLending: false
                embeddedLink: false
                embeddedPhone: false
                numbers:
                - '+18335550100'
                createdAt: '2026-10-08T04:36:40Z'
                updatedAt: '2026-10-08T04:36:40Z'
        '400':
          description: Invalid body, a missing `name`, or a `priorityId` that is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name:
                  value:
                    error: 'invalid request: name is required'
                priorityId:
                  value:
                    error: 'invalid request: priorityId must be a UUID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The US 10DLC registry rejected the request. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: number +18335550100 is already in a verification'
                providerError: 'registration error 403 (HTTP 403): number already in a verification'
        '502':
          description: The US 10DLC registry did not answer. Retry with the same `referenceId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '503':
          description: The registry did not accept Vobiz's service credentials. Retry later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider rejected the service credentials
                providerError: 'registration error 401 (HTTP 401): unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
