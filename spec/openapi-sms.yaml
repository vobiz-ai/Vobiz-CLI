      summary: Create a template
      description: Registers a message template on an RCS sender with the RCS platform and returns it with status `pending`.
        `templateName`, `type` and `content` are passed to the platform unchanged, so use the template types and content shapes
        the RCS platform defines. Call `GET /senders/{senderId}/templates/{templateName}/status` to follow approval. An unknown
        sender or a platform rejection returns `400`.
      operationId: create-template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            example:
              templateName: order-shipped
              type: TEXT
              content:
                text: Your order {{orderId}} has shipped and arrives on {{eta}}.
      responses:
        '201':
          description: The new template in status `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
              example:
                id: c2e4a6b8-1d3f-4a5c-9e7b-6f8d0a2c4e61
                senderId: 7a1c3e5f-9b2d-4c6e-8f0a-1b3d5e7f9a21
                accountId: MA_XXXXXXXX
                provider: YOUR_ROUTING_IDENTIFIER
                templateName: order-shipped
                type: TEXT
                status: pending
                content:
                  text: Your order {{orderId}} has shipped and arrives on {{eta}}.
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:30:00Z'
        '400':
          description: The body is invalid, the sender does not exist on your account, or the RCS platform rejected the template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
