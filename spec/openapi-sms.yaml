    get:
      tags:
      - Broadcasts
      summary: List broadcasts
      description: Returns the broadcasts on your account, newest first, each with freshly counted `stats`. The response wraps
        the page in `broadcasts` and gives the account-wide count in `total`, so you can page with `limit` and `offset` until
        `offset` reaches `total`.
      operationId: list-broadcasts
      parameters:
      - name: limit
        in: query
        description: Maximum number of broadcasts to return, from 1 to 500. Defaults to 50 when you omit it or pass `0`. A
          value above 500 returns `400` with `limit must be between 1 and 500`, and a non-integer returns `400` with `limit
          must be an integer`.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        description: Number of broadcasts to skip before the page starts, for paging through results with `limit`. Defaults
          to `0`. A negative value returns `400` with `offset must be >= 0`, and a non-integer returns `400` with `offset
          must be an integer`.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: A page of broadcasts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastList'
              example:
                broadcasts:
                - id: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
                  accountId: MA_XXXXXXXX
                  name: October pricing update
                  from: '+14155550100'
                  channel: sms
                  template: Hi {{name}}, your refund of {{amount}} is on its way.
                  status: completed
                  scheduledAt: null
                  ratePerSecond: 5
                  tag: pricing-oct
                  dltEntityId: ''
                  dltHeaderId: ''
                  dltTemplateId: ''
                  columns:
                  - phone
                  - name
                  - amount
                  stats:
                    total: 3
                    pending: 0
                    sent: 3
                    delivered: 0
                    failed: 0
                    optedOut: 0
                    skipped: 0
                  createdAt: '2026-10-12T10:30:00Z'
                  updatedAt: '2026-10-12T11:05:12Z'
                  startedAt: '2026-10-12T11:05:10Z'
                  completedAt: '2026-10-12T11:05:12Z'
                total: 1
        '400':
          description: '`limit` or `offset` is out of range or not an integer.'
          content:
