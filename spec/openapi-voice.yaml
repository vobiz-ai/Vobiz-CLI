        request disconnects the member. If a member was kicked, continued its XML
        flow, and rejoined with the same numeric member ID, confirm removal through
        conference exit or call hangup callbacks.
      tags: [ Conference ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Active member hung up

  /api/v1/Account/{auth_id}/Conference/{conference_name}/Member/{member_id}/Play/:
    post:
      operationId: play-audio-member
      summary: Play audio to a member
      description: Play an audio file to a specific conference member.
      tags: [ Conference ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ url ]
              properties:
                url:
                  type: string
                  description: URL of the audio file to play
                  example: https://example.com/audio.mp3
      responses:
        "202":
          description: Audio playback queued
          content:
            application/json:
              example:
                message: play queued into conference
                member_id: [ "2" ]
                api_id: API_REQUEST_ID

    delete:
      operationId: stop-audio-member
      summary: Stop audio for a member
      description: Stop audio playback for a specific conference member.
      tags: [ Conference ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Playback stopped

  /api/v1/Account/{auth_id}/Conference/{conference_name}/Member/{member_id}/Deaf/:
    post:
      operationId: deaf-member
      summary: Mute a member's audio
      description: Prevent a conference member from hearing other participants.
      tags: [ Conference ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Deaf request accepted
          content:
            application/json:
              example:
                message: deaf
                member_id: [ "2" ]
                api_id: API_REQUEST_ID

    delete:
      operationId: undeaf-member
      summary: Unmute a member's audio
      description: Restore a conference member's ability to hear other participants.
      tags: [ Conference ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member undeafened

  # ─── In-call: Record ──────────────────────────────────────
  /api/v1/Account/{auth_id}/Call/{call_uuid}/Record/:
    post:
      operationId: start-recording
      summary: Start recording a call
      description: Begin recording an active call. Set format, enable transcription,
        and configure a callback URL.
      tags: [ Record Calls ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
            example: cdr_XXXXXXXXXX
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                time_limit:
                  type: integer
                  default: 60
                file_format:
                  type: string
                  enum: [ mp3, wav ]
                  default: mp3
                transcription_type:
                  type: string
                  description: Set to `auto` to enable transcription
                callback_url:
                  type: string
                record_channel_type:
                  type: string
                  enum: [ mono, stereo ]
                  default: mono
            example:
              time_limit: 120
              file_format: mp3
      responses:
        "200":
          description: Recording started
          content:
            application/json:
              example:
                recording_id: rec_XXXXXXXXXX
                message: Recording started
    delete:
      operationId: stop-recording
      summary: Stop recording a call
      description: Stop an active recording on an in-progress call.
      tags: [ Record Calls ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Recording stopped

  # ─── In-call: Play Audio ──────────────────────────────────
  /api/v1/Account/{auth_id}/Call/{call_uuid}/Play/:
    post:
      operationId: play-audio-call
      summary: Play audio to a call
      description: Play an audio file to a live call leg.
      tags: [ Play Audio ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ urls ]
              properties:
                urls:
                  type: string
                  example: https://example.com/audio.mp3
                legs:
                  type: string
                  enum: [ aleg, bleg, both ]
                  default: aleg
                loop:
                  type: boolean
                  default: false
            example:
              urls: https://example.com/audio.mp3
              legs: aleg
      responses:
        "200":
          description: Audio playback started
    delete:
      operationId: stop-audio-call
      summary: Stop audio playback on a call
      description: Stop audio playing on a live call.
      tags: [ Play Audio ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Playback stopped

  # ─── In-call: Speak Text ─────────────────────────────────
  /api/v1/Account/{auth_id}/Call/{call_uuid}/Speak/:
    post:
      operationId: speak-text-call
      summary: Speak text on a call
      description: Convert text to speech and play it on a live call.
      tags: [ Speak Text ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ text ]
              properties:
                text:
                  type: string
                  example: Hello, your appointment is confirmed.
                voice:
                  type: string
                  default: WOMAN
                language:
                  type: string
                  default: en-US
                legs:
                  type: string
                  enum: [ aleg, bleg, both ]
                  default: aleg
            example:
              text: Hello, your appointment is confirmed for tomorrow at 3 PM.
              voice: WOMAN
              language: en-US
      responses:
        "200":
          description: TTS started
    delete:
      operationId: stop-speak-call
      summary: Stop text-to-speech on a call
      description: Stop ongoing TTS playback on a live call.
      tags: [ Speak Text ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: TTS stopped

  # ─── In-call: DTMF ───────────────────────────────────────
  /api/v1/Account/{auth_id}/Call/{call_uuid}/DTMF/:
    post:
      operationId: send-dtmf
      summary: Send DTMF tones
      description: "Send DTMF (keypad) tones on an active call. Use `w` for 0.5s
        pause, `W` for 1s pause."
      tags: [ DTMF ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ digits ]
              properties:
                digits:
                  type: string
                  example: "1w2W3"
                leg:
                  type: string
                  enum: [ aleg, bleg, both ]
                  default: aleg
            example:
              digits: "1234"
              leg: aleg
      responses:
        "200":
          description: DTMF sent

  # ─── Audio Streams ───────────────────────────────────────
  /api/v1/Account/{auth_id}/Call/{call_uuid}/Stream/:
    post:
      operationId: start-stream
      summary: Start audio stream
      description: Start streaming raw audio from a live call to a WebSocket URL.
      tags: [ Audio Streams ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ service_url ]
              properties:
                service_url:
                  type: string
                  example: wss://your-server.com/ws
                bidirectional:
                  type: boolean
                  default: false
                audio_track:
                  type: string
                  enum: [ inbound, outbound, both ]
                  default: both
                audio_format:
                  type: string
                  enum: [ pcm, mulaw ]
                  default: mulaw
            example:
              service_url: wss://your-server.com/ws
              bidirectional: true
              audio_track: both
      responses:
        "200":
          description: Stream started
          content:
            application/json:
              example:
                stream_id: str_XXXXXXXXXX
                message: Stream started
    get:
      operationId: list-streams
      summary: List audio streams
      description: List all audio streams on a live call.
      tags: [ Audio Streams ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active streams

  /api/v1/Account/{auth_id}/Call/{call_uuid}/Stream/{stream_id}/:
    get:
      operationId: get-stream
      summary: Retrieve a stream
      description: Get details of a specific audio stream.
      tags: [ Audio Streams ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
        - name: stream_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream details
    delete:
      operationId: stop-stream
      summary: Stop a stream
      description: Stop a specific audio stream on a live call.
      tags: [ Audio Streams ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: call_uuid
          in: path
          required: true
          schema:
            type: string
        - name: stream_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Stream stopped

  # ─── Conferences ─────────────────────────────────────────
  /api/v1/Account/{auth_id}/Conference/:
    get:
      operationId: list-conferences
      summary: List conferences
      description: >-
        Retrieve conference room names reported by the API. An empty array is
        inconclusive and can occur while conferences are active. Maintain your own
        room registry for authoritative discovery, billing, cleanup, and destructive
        workflows.
      tags: [ Conferences ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      responses:
        "200":
          description: List of conferences
          content:
            application/json:
              example:
                conferences: []
                api_id: API_REQUEST_ID
              schema:
                type: object
                properties:
                  api_id:
                    type: string
                  conferences:
                    type: array
                    items:
                      type: string
                    description: Conference names reported by the API. An empty array is inconclusive.
                required:
                  - api_id
                  - conferences
    delete:
      operationId: delete-all-conferences
      summary: Delete all conferences
      description: Terminate all active conference rooms.
      tags: [ Conferences ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      responses:
        "204":
          description: All conferences terminated

  /api/v1/Account/{auth_id}/Conference/{conference_name}/:
    get:
      operationId: get-conference
      summary: Retrieve a conference
      description: Retrieve a specific conference room. A live conference can currently return a 200 response with an error payload instead of conference details.
      tags: [ Conferences ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
            example: My Conf Room
      responses:
        "200":
          description: Conference details or the current live-retrieval failure payload
          content:
            application/json:
              schema:
                oneOf:
                  - title: Conference details
                    type: object
                    properties:
                      conference_name:
                        type: string
                      conference_run_time:
                        type: string
                        description: Conference runtime in seconds
                      conference_member_count:
                        type: string
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            muted:
                              type: boolean
                            member_id:
                              type: string
                            deaf:
                              type: boolean
                            from:
                              type: string
                            to:
                              type: string
                            caller_name:
                              type: string
                            direction:
                              type: string
                            call_uuid:
                              type: string
                            join_time:
                              type: string
                      api_id:
                        type: string
                    required:
                      - conference_name
                      - conference_run_time
                      - conference_member_count
                      - members
                      - api_id
                  - title: Current live-retrieval failure
                    type: object
                    properties:
                      error:
                        type: string
                        enum: [ failed ]
                      api_id:
                        type: string
                    required:
                      - error
                      - api_id
              examples:
                success:
                  summary: Successful conference object
                  value:
                    conference_name: My Conf Room
                    conference_run_time: "590"
                    conference_member_count: "1"
                    members:
                      - muted: false
                        member_id: "17"
                        deaf: false
                        from: CALLER_NUMBER
                        to: VOBIZ_NUMBER
                        caller_name: CALLER_NAME
                        direction: inbound
                        call_uuid: CALL_UUID
                        join_time: "590"
                    api_id: API_REQUEST_ID
                currentFailure:
                  summary: Current failure response for a live conference
                  value:
                    error: failed
                    api_id: API_REQUEST_ID
        "404":
          description: Conference not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  api_id:
                    type: string
                required:
                  - error
                  - api_id
              example:
                error: conference not found
                api_id: API_REQUEST_ID
    delete:
      operationId: delete-conference
      summary: Delete a conference
      description: Terminate a specific conference room and disconnect all members.
      tags: [ Conferences ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conference deleted

  /api/v1/Account/{auth_id}/Conference/{conference_name}/Member/{member_id}/Mute/:
    post:
      operationId: mute-member
      summary: Mute a conference member
      description: "Prevent a member from speaking. Use `all` as member_id to mute
        everyone."
      tags: [ Conference Members ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          description: Member ID, comma-separated IDs, or `all`
          schema:
            type: string
      responses:
        "202":
          description: Mute request accepted
          content:
            application/json:
              example:
                message: muted
                member_id: [ "2" ]
                api_id: API_REQUEST_ID
    delete:
      operationId: unmute-member
      summary: Unmute a conference member
      description: Allow a muted member to speak again.
      tags: [ Conference Members ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member unmuted

  /api/v1/Account/{auth_id}/Conference/{conference_name}/Record/:
    post:
      operationId: start-conference-recording
      summary: Start conference recording
      description: Queue recording for all audio in a conference room. The response does not include a recording ID or download URL.
      tags: [ Conference Recording ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file_format:
                  type: string
                  enum: [ mp3, wav ]
                  default: mp3
                callback_url:
                  type: string
      responses:
        "200":
          description: Recording request queued
          content:
            application/json:
              example:
                message: async api spawned
                api_id: API_REQUEST_ID
    delete:
      operationId: stop-conference-recording
      summary: Stop conference recording
      description: Stop recording a conference room.
      tags: [ Conference Recording ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: conference_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Recording stopped

  # ─── Recordings ──────────────────────────────────────────
  /api/v1/Account/{auth_id}/Recording/:
    get:
      operationId: list-recordings
      summary: List recordings
      description: Retrieve all call recordings on the account.
      tags: [ Recordings ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              example:
                api_id: aabbccdd-1234-5678-90ab-cdef12345678
                meta:
                  limit: 20
                  next: /v1/Account/MA_XXXXXXXX/Recording/?limit=20&offset=20
                  offset: 0
                  previous: null
                  total_count: 721
                objects:
                  - add_time: "2026-05-07 09:45:35.79276+05:30"
                    call_uuid: 11223344-5566-7788-99aa-bbccddeeff00
                    conference_name: null
                    from_number: "+919876543210"
                    monthly_recording_storage_amount: 0
                    recording_duration_ms: "7880.00000"
                    recording_end_ms: null
                    recording_format: wav
                    recording_id: aabbccdd-1234-5678-90ab-cdef12345678
                    recording_start_ms: null
                    recording_storage_duration: 6
                    recording_storage_rate: 0.005
                    recording_type: trunk
                    recording_url: https://recordings.vobiz.ai/example/abc123.mp3
                    resource_uri: /v1/Account/MA_XXXXXXXX/Recording/aabbccdd-1234-5678-90ab-cdef12345678/
                    rounded_recording_duration: 60
                    to_number: "+918012345678"
              schema:
                type: object
                properties:
                  api_id:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        add_time:
                          type: string
                        call_uuid:
                          type: string
                        conference_name:
                          type: string
                          nullable: true
                        from_number:
                          type: string
                        monthly_recording_storage_amount:
                          type: integer
                        recording_duration_ms:
                          type: string
                        recording_end_ms:
                          type: string
                          nullable: true
                        recording_format:
                          type: string
                        recording_id:
                          type: string
                        recording_start_ms:
                          type: string
                          nullable: true
                        recording_storage_duration:
                          type: integer
                        recording_storage_rate:
                          type: number
                        recording_type:
                          type: string
                        recording_url:
                          type: string
                          description: "Download URL for the audio, on `media.vobiz.ai`. Send the same `X-Auth-ID` and `X-Auth-Token` headers as for API requests; without them the media host returns `401`. The body is WAV (RIFF/WAVE PCM), although the response may carry `Content-Type: audio/mpeg`."
                        resource_uri:
                          type: string
                        rounded_recording_duration:
                          type: integer
                        to_number:
                          type: string
                      required:
                        - add_time
                        - call_uuid
                        - conference_name
                        - from_number
                        - monthly_recording_storage_amount
                        - recording_duration_ms
                        - recording_end_ms
                        - recording_format
                        - recording_id
                        - recording_start_ms
                        - recording_storage_duration
                        - recording_storage_rate
                        - recording_type
                        - recording_url
                        - resource_uri
                        - rounded_recording_duration
                        - to_number
                required:
                  - api_id
                  - meta
                  - objects

  /api/v1/Account/{auth_id}/Recording/{recording_id}/:
    get:
      operationId: get-recording
      summary: Retrieve a recording
      description: |
        Get details and download URL for a specific recording.

        `recording_url` points at `media.vobiz.ai`. Download it with the same
        `X-Auth-ID` and `X-Auth-Token` headers you use for the API; the media
        host returns `401` without them. The file is WAV, although the media
        host may label it `Content-Type: audio/mpeg`.
      tags: [ Recordings ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
            example: rec_XXXXXXXXXX
      responses:
        "200":
          description: Recording details
          content:
            application/json:
              schema:
                type: object
                properties:
                  add_time:
                    type: string
                  api_id:
                    type: string
                  call_uuid:
                    type: string
                  conference_name:
                    nullable: true
                  from_number:
                    type: string
                  monthly_recording_storage_amount:
                    type: integer
                  recording_duration_ms:
                    type: string
                  recording_end_ms:
                    nullable: true
                  recording_format:
                    type: string
                  recording_id:
                    type: string
                  recording_start_ms:
                    nullable: true
                  recording_storage_duration:
                    type: integer
                  recording_storage_rate:
                    type: number
                  recording_type:
                    type: string
                  recording_url:
                    type: string
                    description: "Download URL for the audio, on `media.vobiz.ai`. Send the same `X-Auth-ID` and `X-Auth-Token` headers as for API requests; without them the media host returns `401`. The body is WAV (RIFF/WAVE PCM), although the response may carry `Content-Type: audio/mpeg`."
                  resource_uri:
                    type: string
                  rounded_recording_duration:
                    type: integer
                  to_number:
                    type: string
                required:
                  - add_time
                  - api_id
                  - call_uuid
                  - conference_name
                  - from_number
                  - monthly_recording_storage_amount
                  - recording_duration_ms
                  - recording_end_ms
                  - recording_format
                  - recording_id
                  - recording_start_ms
                  - recording_storage_duration
                  - recording_storage_rate
                  - recording_type
                  - recording_url
                  - resource_uri
                  - rounded_recording_duration
                  - to_number
              example:
                add_time: "2026-03-25 10:00:00.000000+05:30"
                api_id: 55667788-1234-5678-90ab-cdef12345678
                call_uuid: 55667788-1234-5678-90ab-cdef12345678
                conference_name: null
                from_number: "+919876543210"
                monthly_recording_storage_amount: 0
                recording_duration_ms: "7880.00000"
                recording_end_ms: null
                recording_format: wav
                recording_id: 55667788-1234-5678-90ab-cdef12345678
                recording_start_ms: null
                recording_storage_duration: 6
                recording_storage_rate: 0.005
                recording_type: trunk
                recording_url: https://recordings.vobiz.ai/example/abc123.mp3
                resource_uri: /v1/Account/MA_XXXXXXXX/Recording/55667788-1234-5678-90ab-cdef12345678/
                rounded_recording_duration: 60
                to_number: "+918012345678"
    delete:
      operationId: delete-recording
      summary: Delete a recording
      description: Permanently delete a recording from the account.
      tags: [ Recordings ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Recording deleted

  /api/v1/Account/{auth_id}/export/recording/:
    post:
      operationId: bulk-export-recordings
      summary: Bulk export historical recordings
      description: |
        Queue a bulk export of the recordings matching your filter criteria. The request is
        validated and accepted for background processing, and the resulting archive is emailed
        as a download link to every address in `recipient.customer_account`. The archive is
        typically available within 15-60 minutes depending on volume.

        Results are delivered by email only; the export runs to completion in the background
        after the `202` response.

        One export runs at a time per account. While an export is in progress, further requests
        return `403`.

        Filter rules:
        - Use either `from`/`to` or the `recording_storage_duration*` filters, not both.
        - Use one of `__gt` or `__gte`, and one of `__lt` or `__lte`.
        - When using range filters (`__gte`/`__lte`), provide both.
        - Maximum date range is 1 year (366 days); maximum storage duration range is 30 days.
        - The additional filters (`from_number`, `to_number`, `call_uuid`, `conference_name`,
          `recording_format`, `recording_id`) apply when the range is 30 days or less.
      tags: [ Bulk Operations ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: object
                  description: Email delivery targets for the export archive.
                  properties:
                    customer_account:
                      type: array
                      description: Email addresses that receive the download link. All addresses must be in valid format.
                      items:
                        type: string
                        format: email
                  required:
                    - customer_account
                from:
                  type: string
                  description: "Start date for the export. Format: YYYY-MM-DD HH:MM:SS. Defaults to 7 days ago."
                  example: "2025-01-23 00:00:00"
                to:
                  type: string
                  description: "End date for the export. Format: YYYY-MM-DD HH:MM:SS. Defaults to the current time."
                  example: "2025-01-30 23:59:59"
                recording_storage_duration:
                  type: string
                  description: Export recordings exactly N days old. `"7"` exports recordings from exactly 7 days ago.
                  example: "7"
                recording_storage_duration__gte:
                  type: string
                  description: Export recordings N days old or older. `"7"` exports recordings 7 days old and older.
                  example: "7"
                recording_storage_duration__gt:
                  type: string
                  description: Export recordings older than N days. `"7"` exports recordings 8 days old and older.
                  example: "7"
                recording_storage_duration__lte:
                  type: string
                  description: Export recordings N days old or newer. `"30"` exports recordings 0-30 days old.
                  example: "30"
                recording_storage_duration__lt:
                  type: string
                  description: Export recordings newer than N days. `"30"` exports recordings 0-29 days old.
                  example: "30"
                from_number:
                  type: string
                  description: Filter by caller phone number. Applies when the range is 30 days or less.
                  example: "+14155551234"
                to_number:
                  type: string
                  description: Filter by destination phone number. Applies when the range is 30 days or less.
                call_uuid:
                  type: string
                  description: Filter by call UUID. Also use this field for a conference_uuid or mpc_uuid. Applies when the range is 30 days or less.
                conference_name:
                  type: string
                  description: Filter by conference name. Also use this field for an mpc_name. Applies when the range is 30 days or less.
                  example: TeamMeeting
                recording_format:
                  type: string
                  description: Filter by recording format. Applies when the range is 30 days or less.
                  enum: [ mp3, wav ]
                recording_id:
                  type: string
                  description: Filter by a specific recording ID. Applies when the range is 30 days or less.
              required:
                - recipient
            examples:
              date-range:
                summary: Export the last 7 days by date range
                value:
                  from: "2025-01-23 00:00:00"
                  to: "2025-01-30 23:59:59"
                  recipient:
                    customer_account:
                      - admin@example.com
              storage-duration:
                summary: Export recordings exactly 7 days old
                value:
                  recording_storage_duration: "7"
                  recipient:
                    customer_account:
                      - admin@example.com
              storage-duration-range:
                summary: Export recordings between 7 and 30 days old
                value:
                  recording_storage_duration__gte: "7"
                  recording_storage_duration__lte: "30"
                  recipient:
                    customer_account:
                      - admin@example.com
              filtered:
                summary: Export MP3 conference recordings with multiple recipients
                value:
                  from: "2025-01-01 00:00:00"
                  to: "2025-01-30 23:59:59"
                  conference_name: TeamMeeting
                  recording_format: mp3
                  recipient:
                    customer_account:
                      - admin@example.com
                      - backup@example.com
      responses:
        "202":
          description: Export request queued. The archive download link is emailed to the recipients when processing completes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_id:
                    type: string
                  status:
                    type: string
              example:
                api_id: correlation-id-uuid
                status: success
        "400":
          description: Invalid request parameters, such as combining `from`/`to` with storage duration filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: failure
                message: From/To cannot be used with recording storage duration
        "403":
          description: Another export is already in progress for this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              example:
                status: failure
                message: An Export Historic Recording request is already in process. Please try again in sometime.

