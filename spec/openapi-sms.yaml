      description: Permanently removes a `draft` or `cancelled` broadcast together with its recipient list and returns `204`
        with no body. Any other status returns `409` with `cannot delete a broadcast that is <status>`, so cancel a scheduled,
        running or paused broadcast first. Completed broadcasts are kept as your sending record.
