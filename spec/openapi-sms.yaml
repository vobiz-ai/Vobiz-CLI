openapi: 3.0.3
info:
  title: Vobiz Messaging API
  description: |
    Send and receive SMS, MMS and RCS messages, buy messaging numbers, register for
    US 10DLC and toll-free, run broadcasts, manage conversations, opt-outs and webhooks.

    **Base URL:** `https://api.vobiz.ai/api/v1/sms`

    **Authentication:** every request needs the `X-Auth-ID` and `X-Auth-Token` headers.
    The account is taken from your credentials; you never put an account ID in a path or body.
    Field names in this API are camelCase.
  version: '1.0'
  contact:
    email: support@vobiz.ai
    url: https://www.vobiz.ai
servers:
- url: https://api.vobiz.ai/api/v1/sms
  description: Production
security:
- AuthID: []
  AuthToken: []
tags:
- name: Messages
  description: Send messages and inspect their delivery state.
- name: Numbers
  description: Messaging-capable numbers on your account, inventory search, purchase and release.
- name: Coverage
  description: Where you can send, per country.
- name: Conversations
  description: Two-way threads between one of your numbers and a contact.
- name: Opt-outs
  description: Numbers that must not receive messages on a channel.
- name: Webhooks
  description: Subscriptions that deliver message and broadcast events to your server.
- name: Broadcasts
  description: Bulk sends from an uploaded recipient list.
- name: RCS Senders
  description: RCS sender (agent) identities and their message templates.
- name: 10DLC Brands
  description: US 10DLC brand registration.
- name: 10DLC Campaigns
  description: US 10DLC campaigns, toll-free verification and supporting documents.
components:
  securitySchemes:
    AuthID:
      type: apiKey
      in: header
      name: X-Auth-ID
      description: Your Vobiz account Auth ID (`MA_XXXXXXXX`).
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Your Vobiz account Auth Token.
  responses:
    BadRequest:
      description: The request body or a parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid request body
    Unauthorized:
      description: Missing or invalid `X-Auth-ID` / `X-Auth-Token`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: missing or invalid credentials
    ServerError:
      description: Unexpected error. Retry with the same idempotency key where one applies.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal error
  schemas:
    Error:
      type: object
      description: 'The body of every error response: a flat object with one `error` string that explains what went wrong.
        Use the HTTP status code to decide how to handle the error, and log `error` for diagnosis.'
      required:
      - error
      properties:
        error:
          type: string
          example: 'recipient has opted out: +14155550123'
          description: 'Human-readable explanation of the error, for example `phoneNumber is required` or `recipient has opted
            out: +14155550123`. Branch on the HTTP status code rather than on this text.'
    StatusOk:
      type: object
      properties:
        status:
          type: string
          example: ok
          description: Always `ok` when the action succeeded.
      description: Confirmation returned by actions that have no resource to return, such as marking a conversation read or
        creating or deleting an opt-out.
    RCSSuggestion:
      type: object
      description: 'One suggestion button on an RCS message: a suggested reply or an action the recipient can tap. Which optional
        fields apply depends on `type`.'
      required:
      - type
      - text
      properties:
        type:
          type: string
          enum:
          - REPLY
          - OPEN_URL
          - DIAL_PHONE
          - SHOW_LOCATION
          - REQUEST_LOCATION
          description: 'What the button does: `REPLY` sends `text` back as a reply, `OPEN_URL` opens `url`, `DIAL_PHONE` calls
            `phoneNumber`, `SHOW_LOCATION` shows a map pin at `latitude`/`longitude`, and `REQUEST_LOCATION` asks the recipient
            to share their location.'
        text:
          type: string
          description: Button label shown to the recipient. Keep it short so it fits on the button.
          example: Reschedule
        postbackData:
          type: string
          description: Your own string, returned to you with the inbound event when the recipient taps the button. Use it
            to tell which button was tapped.
          example: reschedule
        url:
          type: string
          format: uri
          description: HTTPS link to open. Used only when `type` is `OPEN_URL`.
        phoneNumber:
          type: string
          description: Phone number to dial, in E.164 format. Used only when `type` is `DIAL_PHONE`.
          example: '+14155550100'
        latitude:
          type: number
          description: Latitude of the map pin, in decimal degrees from `-90` to `90`. Used only when `type` is `SHOW_LOCATION`.
        longitude:
          type: number
          description: Longitude of the map pin, in decimal degrees from `-180` to `180`. Used only when `type` is `SHOW_LOCATION`.
        label:
          type: string
          description: Label shown on the map pin. Used only when `type` is `SHOW_LOCATION`.
    Message:
      type: object
      description: One message sent from or received by your account. Each recipient of a send gets its own message object
        with its own `id`, status and conversation.
      properties:
        id:
          type: string
          format: uuid
          example: 9b2e1c40-8a3d-4f5e-9c1a-7d6b2e8f4a01
          description: Unique identifier of the message (UUID). Use it with `GET /messages/{id}` and to match status events.
        accountId:
          type: string
          description: Your Vobiz account ID (Auth ID), for example `MA_XXXXXXXX`.
          example: MA_XXXXXXXX
        direction:
          type: string
          enum:
          - out
          - in
          description: '`out` for a message you sent, `in` for a message one of your numbers received.'
        channel:
          type: string
          enum:
          - sms
          - mms
          - rcs
          description: 'Channel the message actually used: `sms`, `mms` or `rcs`. It can differ from the one you requested,
            for example `mms` after an SMS with media to US or Canadian numbers, or `sms` after an RCS send fell back with
            `failoverToSms`.'
        from:
          type: string
          example: '+14155550100'
          description: Sender. For outbound messages, your number in E.164 format or the `senderName` of your RCS sender;
            for inbound messages, the contact's number.
        to:
          type: string
          example: '+14155550123'
          description: Recipient. For outbound messages, the contact's number in E.164 format; for inbound messages, your
            number.
        text:
          type: string
          example: Your verification code is 482913
          description: Message body. An empty string when the message has no text, for example an MMS with media only.
        mediaUrls:
          type: array
          nullable: true
          items:
            type: string
            format: uri
          description: HTTPS URLs of the media attached to the message. `null` or an empty array when there is no media.
        status:
          type: string
          enum:
          - scheduled
          - sent
          - delivered
          - failed
          - received
          - unknown
          description: 'Where the message is in its lifecycle: `scheduled` (held for `scheduledAt`), `sent` (handed to the
            network), `delivered` (delivery confirmed), `failed` (see `errorCode` and `errorMessage`), `received` (inbound)
            or `unknown` (the network reported a status that maps to none of the others).'
        errorCode:
          type: string
          description: Error code reported for a failed message. Omitted when there is no error.
        errorMessage:
          type: string
          description: Human-readable reason a message failed. Omitted when there is no error; quote it to support when you
            need help with a failure.
        tag:
          type: string
          description: The label you set when sending, for filtering and reporting. Omitted when none was set.
        conversationId:
          type: string
          format: uuid
          description: UUID of the conversation the message belongs to. Use it with `GET /conversations/{id}/messages` to
            load the thread.
        scheduledAt:
          type: string
          format: date-time
          description: The time you asked the message to be held until (ISO 8601, UTC). Omitted for messages that were not
            scheduled.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the message was created, as an RFC 3339 / ISO 8601 timestamp in UTC.
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the message last changed, for example on a status update (ISO 8601, UTC).
    MessageStatusEntry:
      type: object
      properties:
        status:
          type: string
          enum:
          - scheduled
          - sent
          - delivered
          - failed
          - received
          - unknown
          description: 'The status the message moved to: `scheduled`, `sent`, `delivered`, `failed`, `received` or `unknown`.'
        errorCode:
          type: string
          description: Error code reported with this status. Omitted unless the entry records a failure.
        errorMessage:
          type: string
          description: Human-readable failure reason reported with this status. Omitted unless the entry records a failure.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
        createdAt:
          type: string
          format: date-time
          description: When the message reached this status (ISO 8601, UTC).
      description: 'One entry in a message''s status history: a status the message reached and when.'
    MessageWithHistory:
      allOf:
      - $ref: '#/components/schemas/Message'
      - type: object
        properties:
          statusHistory:
            type: array
            nullable: true
            description: Every status the message has passed through, oldest first, each with its time and any error detail.
              `null` when no status change has been recorded.
            items:
              $ref: '#/components/schemas/MessageStatusEntry'
      description: A message with its full status history, as returned by `GET /messages/{id}`. It has every field of the
        message object plus `statusHistory`.
    SendMessageRequest:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
          description: The sender. For `sms` and `mms`, one of your Vobiz numbers in E.164 format, for example `+14155550100`.
            For `rcs`, the `senderName` of your RCS sender (from `GET /senders`); with `failoverToSms`, the SMS copy is sent
            from a number on your account.
          example: '+14155550100'
        to:
          type: array
          description: One or more recipient numbers in E.164 format. Each one becomes a separate message with its own `id`;
            blank entries and duplicates are ignored. At least one recipient is required.
          minItems: 1
          items:
            type: string
          example:
          - '+14155550123'
        channel:
          type: string
          enum:
          - sms
          - mms
          - rcs
          default: sms
          description: 'Channel to send on: `sms`, `mms` or `rcs`. Defaults to `sms`. An `sms` with `mediaUrls` to US or Canadian
            recipients is sent as MMS automatically.'
        text:
          type: string
          description: Message body. Required for `sms` and `rcs`. A long SMS is split into segments and billed per segment
            (160 GSM-7 or 70 UCS-2 characters fit in one segment). For `mms`, provide `text`, `mediaUrls` or both, with `text`
            up to 5000 characters.
          example: Your verification code is 482913
        mediaUrls:
          type: array
          description: Publicly reachable `https` URLs of media to attach. MMS accepts up to 10. RCS sends the first URL as
            a file. An SMS to recipients outside the US and Canada is sent as text only.
          maxItems: 10
          items:
            type: string
            format: uri
        title:
          type: string
          description: Subject line of an MMS. Used only when the message is sent as MMS.
        tag:
          type: string
          description: Your own label, stored on every message the request creates. Filter `GET /messages` by it to find all
            recipients of one send or to group messages for reporting.
          example: otp
        idempotencyKey:
          type: string
          description: A unique string you choose, for example a UUID or your own order ID, scoped to your account. Retrying
            with the same key returns the original message instead of sending again. With several recipients the key is applied
            per recipient.
          example: otp-482913-user-77
        scheduledAt:
          type: string
          format: date-time
          description: Time to hold the message until, as an RFC 3339 / ISO 8601 timestamp such as `2026-11-01T09:00:00Z`.
            A future time stores the message with status `scheduled`; a past time or now sends immediately.
        failoverToSms:
          type: boolean
          default: false
          description: Used only when `channel` is `rcs`. When `true` and the RCS send cannot go through, Vobiz sends the
            same `text` as SMS and the message's `channel` becomes `sms`. Defaults to `false`.
        rcsSuggestions:
          type: array
          description: Suggestion buttons (suggested replies and actions) to show under an RCS message. Used only when `channel`
            is `rcs`. See the RCS suggestion object for each `type`.
          items:
            $ref: '#/components/schemas/RCSSuggestion'
        dltEntityId:
          type: string
          description: 'India (TRAI DLT): the Principal Entity ID you registered on a TRAI DLT portal. Pass it on every message
            to Indian numbers.'
        dltHeaderId:
          type: string
          description: 'India (TRAI DLT): the ID of the sender header you registered on a TRAI DLT portal. Pass it on every
            message to Indian numbers.'
        dltTemplateId:
          type: string
          description: 'India (TRAI DLT): the ID of the content template you registered on a TRAI DLT portal. `text` must
            match that template with its variables filled in.'
      description: What to send, from which sender, to whom and on which channel, plus optional scheduling, idempotency, RCS
        and India DLT settings.
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: The messages on this page, newest first. An empty array when nothing matches.
        total:
          type: integer
          example: 128
          description: Total number of messages that match your filters across all pages. Stop paging when `offset` plus the
            page length reaches it.
        limit:
          type: integer
          example: 20
          description: The `limit` you sent in the request, or `0` when you omitted it. The page itself holds at most 100
            messages, and 20 when `limit` is omitted.
        offset:
          type: integer
          example: 0
          description: The number of messages skipped before this page, as sent in the request.
      description: One page of messages from `GET /messages`, with the total number of matches so you can page through the
        rest.
    CostPreview:
      type: object
      properties:
        channel:
          type: string
          example: sms
          description: 'Channel the estimate is for: `sms`, `mms` or `rcs`, matching the `channel` you requested.'
        segmentCount:
          type: integer
          example: 2
          description: Number of segments the text splits into. A GSM-7 SMS fits 160 characters in one segment and 153 per
            segment when split; text with other characters uses UCS-2 (70 and 67).
        unitCost:
          type: number
          example: 0.01
          description: Price of one segment, in `currency`.
        totalCost:
          type: number
          example: 0.02
          description: 'Estimated price of the message to one recipient, in `currency`: `unitCost` multiplied by `segmentCount`.'
        currency:
          type: string
          example: USD
          description: ISO 4217 code of the currency the prices are in, for example `USD`.
        country:
          type: string
          description: ISO 3166-1 alpha-2 code of the destination country, for example `US`. Omitted when the destination
            country is not resolved.
          example: US
      description: 'An estimate of what a message costs before you send it: how many segments the text splits into, and the
        price per segment and in total.'
    RCSReachability:
      type: object
      properties:
        to:
          type: string
          example: '+14155550123'
          description: The phone number that was checked, in E.164 format.
        reachable:
          type: boolean
          description: '`true` when the number can receive RCS from your sender. When `false`, send as SMS or set `failoverToSms`
            on an RCS send.'
        carrier:
          type: string
          description: Name of the recipient's mobile carrier. Omitted when it is not known.
        capability:
          type: string
          description: Capability label returned with the result, for example `reachable`. Base your decision on `reachable`.
      description: Whether a phone number can receive RCS messages from your RCS sender.
    SMSNumberTenDlc:
      type: object
      nullable: true
      description: The most relevant US registration campaign attached to a number. `null` when no campaign is attached.
      properties:
        campaignId:
          type: string
          format: uuid
          example: 3f1c7a2e-9d4b-4e8a-b6c5-2a7d9e1f0b43
          description: ID of the campaign the number is registered to. Use it with the 10DLC campaign endpoints.
        campaignName:
          type: string
          example: Order notifications
          description: Name you gave that campaign.
        stage:
          type: string
          description: Registry stage of the campaign in upper case, for example `REGISTERED` or `IN_REVIEW`. Treat as an
            open string.
          example: REGISTERED
    SMSNumberRegistration:
      type: object
      description: 'US A2P registration state of a number: which registration path applies and how far it has progressed.'
      properties:
        kind:
          type: string
          enum:
          - 10dlc
          - toll_free
          - none
          description: 'Registration path: `10dlc` for long numbers that need a 10DLC campaign, `toll_free` for toll-free
            numbers that need toll-free verification, `none` when no US registration applies.'
        status:
          type: string
          enum:
          - not_registered
          - draft
          - pending
          - approved
          - rejected
          - not_required
          description: 'Progress of that registration: `not_registered` (no campaign attached), `draft` (campaign not submitted),
            `pending` (under review), `approved` (cleared to send to US recipients), `rejected` (fix and resubmit) or `not_required`.'
        campaignId:
          type: string
          description: ID of the campaign the number is attached to. Empty string when none.
          example: 3f1c7a2e-9d4b-4e8a-b6c5-2a7d9e1f0b43
        campaignName:
          type: string
          description: Name of that campaign. Empty string when none.
          example: Order notifications
        stage:
          type: string
          description: Registry stage of that campaign in upper case, for example `REGISTERED`. Treat as an open string; empty
            string when none.
          example: REGISTERED
    SMSNumberLastMessage:
      type: object
      nullable: true
      description: The latest outbound message sent from a number, for a quick health check. `null` when the number has not
        sent a message yet.
      properties:
        status:
          type: string
          enum:
          - scheduled
          - sent
          - delivered
          - failed
          - received
          - unknown
          description: 'Delivery status of that message: `scheduled`, `sent`, `delivered`, `failed`, `received` or `unknown`.'
        errorCode:
          type: string
          description: Error code reported for the message. Empty string unless the message failed.
        errorMessage:
          type: string
          description: Human-readable reason for the failure. Empty string unless the message failed.
        to:
          type: string
          example: '+14155550123'
          description: Recipient of that message in E.164 format.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-16T21:23:02Z'
          description: When that message was created (ISO 8601).
    SMSNumberSendable:
      type: object
      description: Where a number can send right now, derived from its country and registration state. Check it before you
        send.
      properties:
        international:
          type: boolean
          description: '`true` when the number can send to recipients outside the US.'
        usDomestic:
          type: boolean
          description: '`true` when the number can send to US recipients. A US number needs an approved 10DLC campaign or
            completed toll-free verification before this becomes `true`.'
    SMSNumber:
      type: object
      description: A messaging-capable number on your account, with its registration state and what it can send.
      properties:
        e164:
          type: string
          example: '+14155550100'
          description: The number in E.164 format. Use it as `from` when you send.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
        countryCode:
          type: string
          description: Upper-case ISO 3166-1 alpha-2 code of the number's country. Empty string when unknown.
          example: US
        channels:
          type: array
          description: 'Lower-case channels routed on the number: `sms`, `mms` and `rcs`. Defaults to `["sms"]`.'
          items:
            type: string
            enum:
            - sms
            - mms
            - rcs
          example:
          - sms
          - mms
        type:
          type: string
          description: Inventory type in upper case, for example `VIRTUAL_LONG_NUMBER`, `SHORT_CODE` or `TOLL_FREE`. Empty
            string when unknown.
          example: VIRTUAL_LONG_NUMBER
        capabilities:
          type: array
          description: Upper-case capability labels, for example `SMS`, `MMS` and `VOICE`. Empty array when unknown.
          items:
            type: string
          example:
          - SMS
          - MMS
          - VOICE
        tenDlc:
          allOf:
          - $ref: '#/components/schemas/SMSNumberTenDlc'
          description: The most relevant US registration campaign attached to the number. `null` when no campaign is attached.
        tollFree:
          type: boolean
          description: '`true` for US toll-free numbers, which use toll-free verification instead of a 10DLC campaign.'
        registration:
          allOf:
          - $ref: '#/components/schemas/SMSNumberRegistration'
          description: US A2P registration state of the number and the campaign behind it.
        lastMessage:
          allOf:
          - $ref: '#/components/schemas/SMSNumberLastMessage'
          description: The latest outbound message sent from this number. `null` when the number has not sent a message yet.
        sendable:
          allOf:
          - $ref: '#/components/schemas/SMSNumberSendable'
          description: Where the number can send right now, derived from its country and registration state.
    SMSNumberList:
      type: object
      properties:
        numbers:
          type: array
          description: Numbers routed for SMS or MMS, sorted by `countryCode` and then `e164`. Empty array when you have no
            messaging numbers.
          items:
            $ref: '#/components/schemas/SMSNumber'
      description: The messaging numbers on your account.
    NumberCountry:
      type: object
      description: A country with messaging numbers in stock.
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 code of the country. Pass it as `country` to `GET /numbers/available`.
          example: US
        name:
          type: string
          example: United States
          description: English name of the country, for example `United States`.
        types:
          type: array
          description: 'Number types in stock: `local`, `mobile`, `tollfree` or `shortcode`, or another lower-case inventory
            type.'
          items:
            type: string
          example:
          - local
          - tollfree
        capabilities:
          type: array
          items:
            type: string
          example:
          - SMS
          - MMS
          - VOICE
          description: Upper-case capabilities offered by numbers in stock in the country, for example `SMS`, `MMS` and `VOICE`.
            Not every number has every capability; filter with `capabilities` on `GET /numbers/available`.
    NumberCountries:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/NumberCountry'
          description: Countries with numbers in stock. Empty while `ready` is `false`.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the stock snapshot was last refreshed (ISO 8601). `null` until the first snapshot is built.
          example: '2026-10-18T03:19:11Z'
        ready:
          type: boolean
          description: '`true` once the stock snapshot has been built. While `false`, `countries` is empty and `updatedAt`
            is `null`; retry after a few seconds.'
      description: Countries where you can buy messaging numbers, from a snapshot of the inventory.
    AvailableNumber:
      type: object
      description: A number in the inventory that you can buy, with its type, capabilities and price.
      properties:
        e164:
          type: string
          example: '+14155550100'
          description: The number in E.164 format. Pass it as `e164` on `POST /numbers/purchase`.
        numberKey:
          type: string
          description: Opaque inventory key for the number. Pass it as `numberKey` on `POST /numbers/purchase` when it is
            not empty; it is empty for US numbers, which are bought by `e164` alone.
          example: ''
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the country the number belongs to.
        type:
          type: string
          example: VIRTUAL_LONG_NUMBER
          description: Inventory type of the number in upper case, for example `VIRTUAL_LONG_NUMBER` or `TOLL_FREE`.
        capabilities:
          type: array
          items:
            type: string
          example:
          - MMS
          - SMS
          - VOICE
          description: Upper-case capability labels for the number, for example `SMS`, `MMS` and `VOICE`. Order is not significant.
        network:
          type: string
          description: Name of the mobile network the number belongs to, when published. Empty string otherwise.
          example: ''
        setupPrice:
          type: number
          description: One-time setup fee charged at purchase, in `currency`.
          example: 1
        monthlyPrice:
          type: number
          description: Monthly rental charged at purchase for the first month and then on each renewal, in `currency`.
          example: 1
        currency:
          type: string
          description: ISO 4217 code of the prices, which is your wallet currency, for example `USD`.
          example: USD
        providerRequiresDocuments:
          type: boolean
          description: '`true` when the number needs regulatory documents before it can be activated. Contact support to buy
            such a number; `POST /numbers/purchase` returns `422` for it.'
    AvailableNumbersResponse:
      type: object
      properties:
        numbers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableNumber'
          description: Numbers that match your filters, at most 10 per search. Empty array when nothing matches, and for `country=IN`.
        page:
          type: integer
          example: 0
          description: The zero-based page index you requested, echoed back.
        limit:
          type: integer
          example: 10
          description: Page size applied to this search, at most `10`.
        hasMore:
          type: boolean
          example: false
          description: Reserved for pagination; `false` on every response. Run a new search with different filters to see
            other numbers.
        hint:
          type: string
          description: Guidance returned only for `country=IN`, explaining that Indian traffic is sent from DLT-registered
            sender IDs rather than purchased numbers. Absent for every other country.
          example: India uses DLT sender IDs, not long codes
      description: One page of inventory search results.
    PurchaseNumberRequest:
      type: object
      required:
      - e164
      - country
      properties:
        e164:
          type: string
          description: The number to buy, in E.164 format, exactly as returned in `e164` by `GET /numbers/available`. Required.
          example: '+14155550100'
        country:
          type: string
          description: ISO 3166-1 alpha-2 code of the number's country, for example `US`. Required, and must match the number;
            a mismatch returns `400`.
          example: US
        numberKey:
          type: string
          description: The `numberKey` from `GET /numbers/available`. Required when the search result has a non-empty `numberKey`,
            as for `CA` and `GB` numbers; omit it for US numbers, which are bought by `e164` alone.
      description: The number to buy, taken from a `GET /numbers/available` result.
    NumberBillingCharge:
      type: object
      description: 'One wallet charge raised for a purchased number: the initial purchase charge or a monthly renewal.'
      properties:
        purchaseId:
          type: string
          format: uuid
          example: 5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
          description: '`id` of the purchase this charge belongs to.'
        kind:
          type: string
          enum:
          - purchase
          - rental
          description: '`purchase` for the setup fee plus the first month, charged when you buy; `rental` for each later monthly
            renewal.'
        periodStart:
          type: string
          format: date-time
          example: '2026-10-12T09:06:42Z'
          description: Start of the billing period this charge covers (ISO 8601).
        amount:
          type: number
          example: 2
          description: 'Amount charged, in `currency`. For `kind: purchase` this is the setup fee plus the first month.'
        currency:
          type: string
          example: USD
          description: ISO 4217 code of `amount`, for example `USD`.
        status:
          type: string
          enum:
          - pending
          - paid
          - failed
          - refunded
          description: '`pending` while the charge is waiting to be collected, `paid` once collected, `failed` when collection
            failed, `refunded` when the amount was returned to your wallet.'
        reference:
          type: string
          description: Ledger reference for the charge, as it appears in your wallet transactions. Quote it to support when
            reconciling.
          example: sms_number_purchase:5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
        attempts:
          type: integer
          example: 1
          description: How many times collection of this charge has been attempted. Values above `1` mean earlier attempts
            failed, typically for lack of balance.
        attemptedAt:
          type: string
          format: date-time
          example: '2026-10-12T09:06:42Z'
          description: When collection was last attempted (ISO 8601).
    NumberPurchase:
      type: object
      description: A number you bought through Vobiz, with its price, lifecycle status and billing history.
      properties:
        id:
          type: string
          format: uuid
          example: 5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
          description: Unique identifier of the purchase (UUID).
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Auth ID of the account that owns the purchase, for example `MA_XXXXXXXX`.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
        e164:
          type: string
          example: '+14155550100'
          description: The purchased number in E.164 format. Use it as the path value of `POST /numbers/{e164}/release`.
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the number's country.
        type:
          type: string
          example: VIRTUAL_LONG_NUMBER
          description: Inventory type of the number in upper case, for example `VIRTUAL_LONG_NUMBER`.
        capabilities:
          type: array
          items:
            type: string
          example:
          - VOICE
          - SMS
          - MMS
          description: Upper-case capability labels for the number, for example `SMS`, `MMS` and `VOICE`.
        setupAmount:
          type: number
          example: 1
          description: One-time setup fee charged at purchase, in `currency`.
        monthlyAmount:
          type: number
          example: 1
          description: Monthly rental for the number, in `currency`.
        currency:
          type: string
          example: USD
          description: ISO 4217 code of the amounts, for example `USD`.
        status:
          type: string
          enum:
          - pending
          - debited
          - purchased
          - past_due
          - failed
          - refunded
          - released
          description: 'Lifecycle state: `pending` (created), `debited` (charged, purchase in progress), `purchased` (active
            and billing monthly), `past_due` (a renewal has been failing for more than 7 days), `failed` (did not complete),
            `refunded` (charge returned after a failed purchase) or `released` (you released it).'
        purchasedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-12T09:06:44Z'
          description: When the number went live on your account (ISO 8601). `null` until the purchase completes.
        nextBillingAt:
          type: string
          format: date-time
          nullable: true
          description: When the next monthly rental is charged (ISO 8601). `null` before the purchase completes and after
            release.
          example: '2026-11-12T09:06:44Z'
        releasedAt:
          type: string
          format: date-time
          nullable: true
          example: null
          description: When you released the number (ISO 8601). `null` while the number is active.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T09:06:42Z'
          description: When the purchase was started (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T09:06:44Z'
          description: When the purchase last changed, for example on renewal or release (ISO 8601).
        charges:
          type: array
          nullable: true
          description: 'Wallet charges raised for this number, oldest first: the initial `purchase` charge and each monthly
            `rental`. `null` when none have been raised.'
          items:
            $ref: '#/components/schemas/NumberBillingCharge'
    NumberRouting:
      type: object
      description: The routing record that connects a purchased number to your account for messaging.
      properties:
        id:
          type: integer
          example: 1042
          description: Numeric identifier of the routing record.
        e164:
          type: string
          example: '+14155550100'
          description: The routed number in E.164 format.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
        channelCapabilities:
          type: array
          description: Lower-case messaging channels routed on the number, for example `sms` and `mms`.
          items:
            type: string
          example:
          - sms
          - mms
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Auth ID of the account the number is routed to, for example `MA_XXXXXXXX`.
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the number's country.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T09:06:44Z'
          description: When the number was routed to your account (ISO 8601).
    PurchaseNumberResponse:
      type: object
      properties:
        purchase:
          allOf:
          - $ref: '#/components/schemas/NumberPurchase'
          description: 'The purchase record, with `status: purchased`, the amounts charged and `nextBillingAt`.'
        number:
          allOf:
          - $ref: '#/components/schemas/NumberRouting'
          description: The routing record that connects the number to your account. The number appears in `GET /numbers` from
            this point.
      description: 'The result of a successful purchase: the billing record and the routing record.'
    NumberPurchaseList:
      type: object
      properties:
        purchases:
          type: array
          description: Your purchases, newest first, including released numbers. Empty array when you have never bought a
            number.
          items:
            $ref: '#/components/schemas/NumberPurchase'
      description: The numbers you have bought, with their billing history.
    ReleaseNumberResponse:
      type: object
      properties:
        purchase:
          allOf:
          - $ref: '#/components/schemas/NumberPurchase'
          description: 'The purchase record after release, with `status: released`, `releasedAt` set and `nextBillingAt` set
            to `null`.'
      description: The result of releasing a number.
    LocalIntl:
      type: object
      description: A coverage rule that can differ for local (in-country) and international senders. Each value is `true`,
        `false`, or `null` when unknown.
      properties:
        local:
          type: boolean
          nullable: true
          description: Value of the rule for local (in-country) traffic. `null` when unknown.
        international:
          type: boolean
          nullable: true
          description: Value of the rule for international traffic, sent from outside the country. `null` when unknown.
    CoverageSenders:
      type: object
      description: Which sender types a destination accepts, each split into local and international traffic.
      properties:
        alphanumeric:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether alphanumeric sender IDs (a brand name such as `ACME` in place of a number) are accepted.
        shortCode:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether short codes (5 or 6 digit numbers) are accepted as senders.
        longNumber:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether long numbers (standard-length phone numbers, such as US 10DLC numbers) are accepted as senders.
    CoverageSummary:
      type: object
      description: One row of the coverage list, with the key rules for a destination country. Call `GET /coverage/{country}`
        for the full record.
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 code of the country. Pass it to `GET /coverage/{country}`.
          example: US
        name:
          type: string
          example: United States
          description: English name of the country or territory, for example `United States`.
        region:
          type: string
          nullable: true
          example: Northern America
          description: Geographic region the country belongs to, for example `Northern America`. `null` when not assigned.
        dialCode:
          type: string
          description: Country calling code without the `+`, for example `1` or `44`.
          example: '1'
        senders:
          allOf:
          - $ref: '#/components/schemas/CoverageSenders'
          description: Which sender types the country accepts, for local and international traffic.
        registrationRequired:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether senders must be registered before sending, for local and international traffic.
        twoWay:
          type: boolean
          nullable: true
          description: '`true` when recipients can reply to your messages, `false` when they cannot, `null` when unknown.'
        optOutMandatory:
          type: boolean
          nullable: true
          description: '`true` when messages must offer an opt-out, such as replying STOP. `null` when unknown.'
        hasSendWindow:
          type: boolean
          description: '`true` when the country restricts sending to certain hours. Read `sendWindow` on `GET /coverage/{country}`
            for the hours.'
    CoverageList:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/CoverageSummary'
          description: One summary row per matching country, sorted by country name. Empty array when nothing matches.
        total:
          type: integer
          description: Number of rows in `countries` after filtering.
          example: 253
        updatedAt:
          type: string
          format: date-time
          description: When the coverage dataset was last refreshed (ISO 8601).
          example: '2026-10-09T09:49:01Z'
      description: Coverage summary rows for every country that matches your filters.
    CoverageRegistration:
      type: object
      description: Sender registration requirements for a destination country. The text fields are free-form and may prefix
        values with `LOCAL:` or `INTERNATIONAL:` when they differ by traffic type.
      properties:
        required:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether senders must be registered before sending, for local and international traffic.
        durationDays:
          type: string
          nullable: true
          description: 'Typical registration lead time as published for the country, for example `LOCAL: +20`. Free text;
            `null` when not published.'
        informationRequired:
          type: string
          nullable: true
          description: Information you must supply to register a sender, for example sample messages. `null` when not published.
        documentsRequired:
          type: string
          nullable: true
          description: Documents you must supply to register a sender, for example a letter of authorization. `null` when
            not published.
        alphanumericExtraSteps:
          type: string
          nullable: true
          description: Additional steps that apply to alphanumeric sender IDs, such as DLT registration in India. `null` when
            none.
    CoverageUrls:
      type: object
      description: Rules for links in message bodies sent to a destination country.
      properties:
        allowed:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether message bodies may contain URLs, for local and international traffic.
        whitelistingRequired:
          allOf:
          - $ref: '#/components/schemas/LocalIntl'
          description: Whether the domains you link to must be registered (whitelisted) in advance, for local and international
            traffic.
    CoverageSendWindow:
      type: object
      nullable: true
      description: 'The hours during which messages may be sent to the country. Each value is a text range with its timezone
        rule, for example `MON - FRI: 10:00:00 - 21:00:00; Timezone from MSISDN`, which means the recipient''s local time.'
      properties:
        weekday:
          type: string
          example: 'MON - FRI: 10:00:00 - 21:00:00; Timezone from MSISDN'
          description: Permitted sending hours Monday to Friday, with the timezone rule.
        saturday:
          type: string
          example: 'SAT: 10:00:00 - 21:00:00; Timezone from MSISDN'
          description: Permitted sending hours on Saturday, with the timezone rule.
        sunday:
          type: string
          example: 'SUN: 10:00:00 - 21:00:00; Timezone from MSISDN'
          description: Permitted sending hours on Sunday, with the timezone rule.
    CoverageDetail:
      type: object
      description: The full coverage record for one destination country, returned by `GET /coverage/{country}`.
      properties:
        country:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the country.
        name:
          type: string
          example: United States
          description: English name of the country or territory, for example `United States`.
        region:
          type: string
          nullable: true
          example: Northern America
          description: Geographic region the country belongs to, for example `Northern America`. Use this value with the `region`
            filter on `GET /coverage`. `null` when not assigned.
        dialCode:
          type: string
          example: '1'
          description: Country calling code without the `+`, for example `1` or `44`.
        mcc:
          type: string
          nullable: true
          description: Mobile country code (MCC) of the country's networks, for example `311`. `null` when not published.
          example: '311'
        numberPortability:
          type: boolean
          nullable: true
          description: '`true` when subscribers can keep their number when they change network, `null` when unknown.'
        localVsInternationalTraffic:
          type: boolean
          nullable: true
          description: '`true` when the country applies different rules to local (in-country) and international senders. When
            `true`, read the `local` and `international` values of each rule separately.'
        senders:
          allOf:
          - $ref: '#/components/schemas/CoverageSenders'
          description: Which sender types the country accepts, for local and international traffic.
        registration:
          allOf:
          - $ref: '#/components/schemas/CoverageRegistration'
          description: Whether senders must be registered, and what registration involves.
        urls:
          allOf:
          - $ref: '#/components/schemas/CoverageUrls'
          description: Rules for links in message bodies.
        optOutMandatory:
          type: boolean
          nullable: true
          description: '`true` when messages must offer an opt-out, such as replying STOP. `null` when unknown.'
        twoWay:
          type: boolean
          nullable: true
          description: '`true` when recipients can reply to your messages, `false` when they cannot, `null` when unknown.'
        prohibitedTopics:
          type: array
          items:
            type: string
          example:
          - Phishing
          - Other Scams
          - Explicit Content
          - Gambling
          description: Content categories that may not be sent to the country, for example `Gambling` or `Phishing`. Empty
            array when none are listed.
        prohibitedNotes:
          type: string
          nullable: true
          description: Free-text detail on prohibited or restricted content. `null` when none.
        sendWindow:
          allOf:
          - $ref: '#/components/schemas/CoverageSendWindow'
          description: Hours during which you may send, by day type. `null` when the country has no sending window.
        marketNotes:
          type: string
          nullable: true
          description: Free-text guidance on sending to this market, such as sender behaviour and local rules. `null` when
            none.
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-09T09:49:01Z'
          description: When the coverage dataset was last refreshed (ISO 8601).
    Conversation:
      type: object
      description: A two-way thread between one of your numbers (or RCS senders) and one contact on one channel. Vobiz creates
        it with the first message in either direction and adds every later message between the same pair on that channel.
      properties:
        id:
          type: string
          format: uuid
          example: c7d1e9a3-2b4f-4a6c-8d5e-1f3a9b7c2e04
          description: Unique identifier of the conversation (UUID). Pass it to the conversation endpoints; messages carry
            it as `conversationId`.
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (Auth ID), for example `MA_XXXXXXXX`.
        participantA:
          type: string
          description: 'Your side of the thread: your number in E.164 format, or the `senderName` of your RCS sender.'
          example: '+14155550100'
        participantB:
          type: string
          description: The contact's phone number in E.164 format.
          example: '+14155550123'
        channel:
          type: string
          enum:
          - sms
          - mms
          - rcs
          description: 'Channel the thread runs on: `sms`, `mms` or `rcs`. The same two parties have a separate conversation
            on each channel.'
        lastMessageAt:
          type: string
          format: date-time
          example: '2026-10-16T21:23:51Z'
          description: Time of the latest message in the thread, sent or received (ISO 8601, UTC). Conversation lists are
            ordered by it, newest first.
        messageCount:
          type: integer
          example: 3
          description: Total number of messages in the thread, in both directions.
        unreadCount:
          type: integer
          description: Number of messages added to the thread since it was last marked read. `POST /conversations/{id}/read`
            resets it to `0`.
          example: 1
        lastReadAt:
          type: string
          format: date-time
          description: When the thread was last marked read (ISO 8601, UTC). Omitted until you first call `POST /conversations/{id}/read`.
          example: '2026-10-17T08:46:55Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-16T21:23:02Z'
          description: When the conversation was created, as an RFC 3339 / ISO 8601 timestamp in UTC.
    UnreadCount:
      type: object
      properties:
        totalUnread:
          type: integer
          description: Sum of `unreadCount` over all your conversations. `0` when every thread has been marked read.
          example: 4
      description: The unread total across all your conversations.
    CreateOptOutRequest:
      type: object
      required:
      - phoneNumber
      properties:
        phoneNumber:
          type: string
          description: Required. The phone number to block, in E.164 format, for example `+14155550123`.
          example: '+14155550123'
        channel:
          type: string
          default: sms
          description: 'Channel to block: `sms`, `mms` or `rcs`. Defaults to `sms`. An `sms` opt-out also blocks `mms`.'
          example: sms
        reason:
          type: string
          default: manual
          description: Free-text note stored on the record, for example `customer request`. Defaults to `manual`. Repeating
            the request for the same number and channel replaces it.
          example: manual
      description: The number and channel to add to your opt-out list, with an optional reason.
    OptOut:
      type: object
      description: A phone number on your opt-out list for one channel. Vobiz blocks sends and broadcast deliveries to it
        on that channel until you delete the entry.
      properties:
        id:
          type: string
          format: uuid
          example: 4e8b2d61-7c3a-4f9e-a1d5-9b6c0e2f8a37
          description: Unique identifier of the opt-out record (UUID).
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (Auth ID), for example `MA_XXXXXXXX`.
        phoneNumber:
          type: string
          example: '+14155550123'
          description: The blocked phone number in E.164 format.
        channel:
          type: string
          example: sms
          description: 'Channel the number is blocked on: `sms`, `mms` or `rcs`. An `sms` entry also blocks `mms`.'
        reason:
          type: string
          description: Why the entry exists. `stop`, `start` or `help` when the contact replied with a keyword; `manual` or
            your own text when you created it through the API or console.
          example: manual
        source:
          type: string
          enum:
          - inbound
          - manual
          description: '`inbound` when the entry came from a keyword reply, `manual` when you created it through the API or
            console.'
        syncedToProvider:
          type: boolean
          description: '`true` when the block has also been applied on the upstream network.'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-18T07:23:03Z'
          description: When the number was added to the list (ISO 8601, UTC).
    OptOutCheck:
      type: object
      properties:
        optedOut:
          type: boolean
          description: '`true` when the number is blocked on the requested channel, so sends to it return `422`. `false` when
            you can message it.'
          example: true
      description: Whether a phone number is on your opt-out list for the channel you asked about.
    WebhookEvent:
      type: string
      description: 'A messaging event name you can subscribe to: `message.status` (delivery state changed), `message.delivered`
        (reached the handset), `message.failed` (could not be delivered), `message.received` (inbound message) or `broadcast.updated`
        (broadcast status or counters changed).'
      enum:
      - message.status
      - message.delivered
      - message.failed
      - message.received
      - broadcast.updated
    CreateWebhookRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: The HTTPS URL that receives `POST` deliveries, for example `https://example.com/vobiz/webhooks`. Required;
            an empty or missing value returns `400` with `url is required`.
          example: https://example.com/vobiz/webhooks
        secret:
          type: string
          description: Shared secret used to compute `X-Webhook-Signature` on every delivery. Choose a long random value and
            store it on your server; if you omit it the subscription is created with an empty secret.
          example: YOUR_WEBHOOK_SECRET
        events:
          type: array
          description: Event names to deliver to this URL, matched exactly. Defaults to `message.received`, `message.delivered`
            and `message.failed` when you omit it or send an empty array.
          default:
          - message.received
          - message.delivered
          - message.failed
          items:
            $ref: '#/components/schemas/WebhookEvent'
      description: The subscription to create. Only `url` is required.
    UpdateWebhookRequest:
      type: object
      description: The fields to change. Send any subset; fields you omit keep their current value.
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/vobiz/webhooks-v2
          description: New HTTPS URL for deliveries. Replaces the current URL as sent, so always send a full valid URL.
        secret:
          type: string
          example: YOUR_NEW_WEBHOOK_SECRET
          description: New signing secret for `X-Webhook-Signature`. Deliveries are signed with the new value from this point,
            so update your verifier at the same time.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
          example:
          - message.delivered
          - message.failed
          description: New list of event names to deliver, matched exactly. Replaces the whole list; it is not merged with
            the current events.
        active:
          type: boolean
          description: '`false` pauses deliveries and keeps the subscription; `true` resumes them.'
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8d4f2a6b-3e1c-4b9a-a7d2-5c8e1f0b6a93
          description: Unique identifier of the subscription (UUID). Use it with `GET`, `PUT` and `DELETE /webhooks/{id}`.
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Auth ID of the account that owns the subscription, for example `MA_XXXXXXXX`.
        url:
          type: string
          format: uri
          example: https://example.com/vobiz/webhooks
          description: The URL that receives `POST` deliveries.
        secret:
          type: string
          description: The signing secret for `X-Webhook-Signature`, returned in clear. Keep it out of logs and client-side
            code.
          example: YOUR_WEBHOOK_SECRET
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
          example:
          - message.received
          - message.delivered
          - message.failed
          description: Event names delivered to this URL. An event is delivered only when its name appears here exactly.
        active:
          type: boolean
          example: true
          description: '`true` when deliveries are on. New subscriptions start `true`; set it with `PUT /webhooks/{id}`.'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-18T07:22:11Z'
          description: When the subscription was created (ISO 8601). Read it from `GET /webhooks/{id}` or `GET /webhooks`.
      description: 'A webhook subscription: the URL Vobiz delivers your chosen events to, and the secret used to sign them.'
    BroadcastStats:
      type: object
      description: Counts of the broadcast's stored recipients by state, recounted every time you read the broadcast.
      properties:
        total:
          type: integer
          description: Recipients stored on the broadcast, including opted-out ones. Invalid rows and duplicates from the
            upload are not stored and not counted.
          example: 3
        pending:
          type: integer
          description: Recipients still waiting to be sent.
          example: 0
        sent:
          type: integer
          example: 3
          description: Recipients whose message was accepted for sending and has no delivery report yet.
        delivered:
          type: integer
          example: 0
          description: Recipients whose message was reported delivered.
        failed:
          type: integer
          example: 0
          description: Recipients whose message failed. Their `errorCode` says why.
        optedOut:
          type: integer
          description: Recipients excluded because the number opted out of SMS from you. They are never sent.
          example: 0
        skipped:
          type: integer
          description: Recipients that were still pending when the broadcast was cancelled.
          example: 0
    Broadcast:
      type: object
      description: A bulk SMS send that renders one template for every recipient of an uploaded list and sends at a controlled
        rate. Its `status` moves from `draft` through `scheduled` or `running` to `completed`, `cancelled` or `failed`, and
        `stats` counts recipients by state.
      properties:
        id:
          type: string
          format: uuid
          example: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
          description: Unique identifier of the broadcast (UUID). Use it in every `/broadcasts/{id}` path.
        accountId:
          type: string
          description: Your Vobiz account ID (`MA_...`) that owns the broadcast.
          example: MA_XXXXXXXX
        name:
          type: string
          example: October pricing update
          description: The label you gave the broadcast, shown in the console and in listings.
        from:
          type: string
          description: 'The sender every message goes out from, as stored: an E.164 number, a short code or an alphanumeric
            sender ID.'
          example: '+14155550100'
        channel:
          type: string
          enum:
          - sms
          example: sms
          description: The channel the broadcast sends on. Always `sms`.
        template:
          type: string
          description: The message body with `{{variable}}` placeholders, filled per recipient from the columns of the upload.
            Empty until you set it.
          example: Hi {{name}}, your refund of {{amount}} is on its way.
        status:
          type: string
          enum:
          - draft
          - scheduled
          - running
          - paused
          - completed
          - cancelled
          - failed
          description: Lifecycle state. `draft` until you launch, then `scheduled` (waiting for `scheduledAt`) or `running`.
            `paused` after a pause call or when `pauseReason` is set; `completed` once every recipient is processed; `cancelled`
            after a cancel call; `failed` when the run stopped on an error.
          example: draft
        pauseReason:
          type: string
          enum:
          - insufficient_balance
          description: Present only while the broadcast is paused for a reason other than your own pause call. `insufficient_balance`
            means the balance ran out; top up and call `POST /broadcasts/{id}/resume`.
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: When sending starts after launch, in UTC (ISO 8601). `null` means sending starts as soon as you launch.
          example: null
        ratePerSecond:
          type: integer
          description: Maximum messages sent per second while running, from 1 to 50.
          example: 5
        tag:
          type: string
          description: Your label, copied onto every message the broadcast sends. Empty string when not set.
          example: ''
        dltEntityId:
          type: string
          description: India (TRAI DLT). The Principal Entity ID copied onto every message. Empty string when not set.
          example: ''
        dltHeaderId:
          type: string
          description: India (TRAI DLT). The registered sender header ID copied onto every message. Empty string when not
            set.
          example: ''
        dltTemplateId:
          type: string
          description: India (TRAI DLT). The registered content template ID copied onto every message. Empty string when not
            set.
          example: ''
        columns:
          type: array
          nullable: true
          description: Column names from the latest recipient upload, as written in your file header. The first is the phone
            column and the rest are available as template variables. Empty until you upload recipients.
          items:
            type: string
          example: null
        stats:
          allOf:
          - $ref: '#/components/schemas/BroadcastStats'
          description: Recipient counts by state, recounted on every read.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the broadcast was created (ISO 8601, UTC).
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the broadcast last changed, including status changes (ISO 8601, UTC).
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: When sending began (ISO 8601, UTC). `null` until the broadcast runs.
          example: null
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the broadcast finished, either because the last recipient was processed or because it was cancelled
            (ISO 8601, UTC). `null` until then.
          example: null
    BroadcastUpdateInput:
      type: object
      description: Broadcast fields you can change on a draft. Every field is optional; fields you leave out keep their value,
        and the same validation as create applies.
      properties:
        name:
          type: string
          maxLength: 255
          description: A label for the broadcast in the console and in listings, 1 to 255 characters. Required on create;
            on update it cannot be set to an empty string.
          example: October pricing update
        from:
          type: string
          description: 'The sender every message goes out from: an SMS number on your account in E.164 format, a short code
            of up to 8 digits, or an alphanumeric sender ID of 1 to 11 letters, digits and spaces that starts with a letter
            or digit. Spaces, hyphens and brackets in phone numbers are removed before storing. Launch checks that a phone-number
            sender is an SMS number on your account. Required on create.'
          example: '+14155550100'
        channel:
          type: string
          enum:
          - sms
          default: sms
          description: The channel the broadcast sends on. Broadcasts send SMS, so the only value is `sms` (matched case-insensitively),
            which is also the default.
        template:
          type: string
          maxLength: 5000
          description: Message body, up to 5,000 characters, with `{{variable}}` placeholders filled per recipient from the
            columns of your upload. Placeholder names are matched case-insensitively and trimmed, so `{{ Name }}` matches
            a `name` column. Launch requires a non-empty template.
          example: Hi {{name}}, your refund of {{amount}} is on its way.
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 timestamp at which sending starts after you launch, for example `2026-11-01T09:00:00Z`; offsets
            are converted to UTC. Omit it, or pass `null` or `""`, to send as soon as you launch. On update, `null` clears
            a previous value.
          example: '2026-10-15T09:00:00Z'
        ratePerSecond:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: Maximum messages sent per second while the broadcast runs, an integer from 1 to 50. Defaults to 5,
            and `0` also selects the default. Lower it to spread load on your own systems or replies.
          example: 5
        tag:
          type: string
          maxLength: 255
          description: Your own label of up to 255 characters, copied onto every message the broadcast sends so you can find
            them with the `tag` filter on `GET /messages`.
          example: pricing-oct
        dltEntityId:
          type: string
          maxLength: 64
          description: India (TRAI DLT). The Principal Entity ID you registered on a TRAI DLT portal, up to 64 characters.
            Pass it when the list contains Indian numbers; it is copied onto every message.
        dltHeaderId:
          type: string
          maxLength: 64
          description: India (TRAI DLT). The sender header ID you registered on a TRAI DLT portal, up to 64 characters. Copied
            onto every message.
        dltTemplateId:
          type: string
          maxLength: 64
          description: India (TRAI DLT). The content template ID you registered on a TRAI DLT portal, up to 64 characters.
            Your template text must match the registered template with the variables filled.
    BroadcastInput:
      allOf:
      - $ref: '#/components/schemas/BroadcastUpdateInput'
      - type: object
        required:
        - name
        - from
      description: Fields for a new broadcast. `name` and `from` are required; every other field is optional and takes its
        documented default.
    BroadcastList:
      type: object
      properties:
        broadcasts:
          type: array
          items:
            $ref: '#/components/schemas/Broadcast'
          description: The broadcasts on this page, newest first. Empty when `offset` is past the end.
        total:
          type: integer
          description: Number of broadcasts on your account across all pages. Page until `offset` reaches this value.
          example: 1
      description: One page of broadcasts, newest first, with the total count for paging.
    BroadcastRecipient:
      type: object
      description: 'One recipient of a broadcast: the normalised number, the variables from its upload row and the state of
        its message.'
      properties:
        id:
          type: integer
          format: int64
          example: 1042
          description: Numeric identifier of the recipient within Vobiz. Used in the broadcast's per-recipient idempotency
            key.
        row:
          type: integer
          description: Where the recipient came from in the upload. For a file it is the line number in the file, so with
            a header line the first data row is `2`; for a JSON `numbers` array it is the 1-based position.
          example: 2
        to:
          type: string
          description: The recipient's number, normalised to E.164.
          example: '+14155550123'
        variables:
          type: object
          description: Every column value from the recipient's upload row, keyed by the column name as written in your header,
            including the phone column. Used to fill the template. Only the phone column is present for JSON uploads.
          additionalProperties:
            type: string
          example:
            name: Priya
            amount: $42.00
        status:
          type: string
          enum:
          - pending
          - sending
          - sent
          - delivered
          - failed
          - opted_out
          - skipped
          example: sent
          description: 'The recipient''s send state: `pending`, `sending`, `sent`, `delivered`, `failed`, `opted_out` (excluded
            because the number opted out of SMS from you) or `skipped` (still pending when the broadcast was cancelled).'
        messageId:
          type: string
          description: The `id` of the message sent to this recipient; look it up with `GET /messages/{id}`. Empty string
            until the message is sent.
          example: 9b2e1c40-8a3d-4f5e-9c1a-7d6b2e8f4a01
        errorCode:
          type: string
          description: 'Why the send failed: the message''s `errorCode`, or `send_failed` / `routing_failed`. Empty string
            unless `status` is `failed`.'
          example: ''
        errorMessage:
          type: string
          example: ''
          description: Human-readable detail for a failed send. Empty string unless `status` is `failed`.
        sentAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-12T10:30:02Z'
          description: When the message to this recipient was sent (ISO 8601, UTC). `null` until then.
    BroadcastRecipientList:
      type: object
      properties:
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/BroadcastRecipient'
          description: The recipients on this page, in upload order.
        total:
          type: integer
          description: Number of recipients that match the `status` filter across all pages, or all recipients when you pass
            no filter.
          example: 3
      description: One page of a broadcast's recipients, in upload order, with the count that matches your filter.
    UploadRecipientsFile:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: A `.csv` or `.xlsx` file of at most 10 MB and 10,000 recipients. The phone column is detected from
            its header (`phone`, `mobile`, `msisdn`, `number`, `to`, `phonenumber` and similar), otherwise the first column
            is used. Files without a header get the columns `phone`, `column2`, `column3` and so on; CSV delimiters `,`, `;`
            and tab are detected, and for XLSX the first sheet is read.
        defaultCountry:
          type: string
          default: US
          description: ISO 3166-1 alpha-2 country code, matched case-insensitively, used to normalise numbers that have no
            country code. Defaults to `US`.
          enum:
          - US
          - CA
          - GB
          - IN
          - AU
          - NZ
          - IE
          - DE
          - FR
          - ES
          - IT
          - NL
          - BE
          - CH
          - AT
          - SE
          - 'NO'
          - DK
          - FI
          - PL
          - PT
          - BR
          - MX
          - AR
          - CO
          - CL
          - SG
          - MY
          - ID
          - PH
          - TH
          - VN
          - JP
          - KR
          - CN
          - HK
          - AE
          - SA
          - QA
          - IL
          - TR
          - ZA
          - NG
          - KE
          - EG
          - PK
          - BD
          - LK
          - NP
          example: US
      description: A recipient file upload. Every column other than the phone column becomes a template variable named after
        its header.
    UploadRecipientsJSON:
      type: object
      required:
      - numbers
      properties:
        numbers:
          type: array
          description: Phone numbers, one per recipient, up to 10,000. Numbers without a country code are normalised with
            `defaultCountry`. An empty array clears the list.
          items:
            type: string
          example:
          - '+14155550123'
          - '+14155550124'
        defaultCountry:
          type: string
          default: US
          description: ISO 3166-1 alpha-2 country code, matched case-insensitively, used to normalise numbers that have no
            country code. Defaults to `US`.
          enum:
          - US
          - CA
          - GB
          - IN
          - AU
          - NZ
          - IE
          - DE
          - FR
          - ES
          - IT
          - NL
          - BE
          - CH
          - AT
          - SE
          - 'NO'
          - DK
          - FI
          - PL
          - PT
          - BR
          - MX
          - AR
          - CO
          - CL
          - SG
          - MY
          - ID
          - PH
          - TH
          - VN
          - JP
          - KR
          - CN
          - HK
          - AE
          - SA
          - QA
          - IL
          - TR
          - ZA
          - NG
          - KE
          - EG
          - PK
          - BD
          - LK
          - NP
          example: US
      description: A plain recipient list sent as JSON. Use the file form instead when the template needs per-recipient variables.
    InvalidRecipient:
      type: object
      description: A row that was rejected during a recipient upload and not stored.
      properties:
        row:
          type: integer
          description: 'Where the row came from: the line number in the file (the header is line 1), or the 1-based position
            in a JSON `numbers` array.'
          example: 7
        value:
          type: string
          description: The phone value exactly as it appeared in the row. Empty when the phone cell was blank.
          example: abc
        reason:
          type: string
          enum:
          - missing phone number
          - contains letters or symbols
          - too short
          - too long
          - not a valid US/Canada number
          - not a valid Indian mobile number
          - unsupported defaultCountry
          example: contains letters or symbols
          description: 'Why the number was rejected: `missing phone number` (blank cell), `contains letters or symbols`, `too
            short`, `too long`, `not a valid US/Canada number`, `not a valid Indian mobile number` or `unsupported defaultCountry`.'
    UploadResult:
      type: object
      description: Summary of a recipient upload. The upload replaces the broadcast's previous recipient list.
      properties:
        total:
          type: integer
          description: Rows read from the file or array, excluding the header line.
          example: 5
        valid:
          type: integer
          description: Rows with a valid, unique number that were stored as recipients, including opted-out numbers.
          example: 3
        invalid:
          type: array
          description: Rejected rows with the reason for each, at most the first 100. Fix them in your file and upload again.
          items:
            $ref: '#/components/schemas/InvalidRecipient'
        invalidCount:
          type: integer
          description: Total rejected rows, including any beyond the 100 listed in `invalid`.
          example: 1
        duplicates:
          type: integer
          description: Rows dropped because the same number appeared earlier in the upload.
          example: 1
        optedOut:
          type: integer
          description: Stored rows marked `opted_out` because the number opted out of SMS from you. They count towards `valid`
            and are never sent.
          example: 0
        columns:
          type: array
          description: Column names detected in the upload, as written in your header. The first is the phone column; the
            rest are template variables.
          items:
            type: string
          example:
          - phone
          - name
          - amount
    BroadcastPreviewSample:
      type: object
      properties:
        to:
          type: string
          example: '+14155550123'
          description: The recipient's number in E.164 format.
        text:
          type: string
          description: The exact message text this recipient will receive, with their variables filled.
          example: Hi Priya, your refund of $42.00 is on its way.
        segments:
          type: integer
          description: Number of SMS segments this text is sent and billed as.
          example: 1
        encoding:
          type: string
          enum:
          - GSM-7
          - UCS-2
          description: '`GSM-7` when every character is in the GSM alphabet (160 characters in a single segment). `UCS-2`
            when the text contains other characters, such as emoji or most non-Latin scripts (70 characters in a single segment).'
          example: GSM-7
      description: The template rendered for one recipient, with the encoding and segment count it will be sent with.
    BroadcastPreview:
      type: object
      properties:
        samples:
          type: array
          description: The template rendered for up to `limit` pending recipients, in upload order. Empty when no recipient
            is pending.
          items:
            $ref: '#/components/schemas/BroadcastPreviewSample'
        missingVariables:
          type: array
          description: Placeholders in the template that have no matching upload column. They render as empty text; an empty
            array means every placeholder is filled.
          items:
            type: string
          example: []
        estimatedSegments:
          type: integer
          description: Total SMS segments across all pending recipients. Multiply by your per-segment rate to estimate the
            cost of the launch.
          example: 3
      description: The template rendered for the first pending recipients, with the information you need to check a broadcast
        before launching it.
    SenderBrand:
      type: object
      properties:
        brandName:
          type: string
          example: Example Brand
          description: Your brand or business name as the RCS platform should record it for review.
      description: The brand an RCS sender represents.
    SenderPhone:
      type: object
      properties:
        phoneNumber:
          type: string
          description: The phone number recipients can call, in E.164 format.
          example: '+14155550100'
        label:
          type: string
          example: Support
          description: Text shown next to the number, for example `Customer care`.
      description: A contact phone number shown on an RCS sender's info page.
    SenderEmail:
      type: object
      properties:
        address:
          type: string
          format: email
          example: support@example.com
          description: The email address recipients can write to, for example `support@example.com`.
        label:
          type: string
          example: Support
          description: Text shown next to the address, for example `Support`.
      description: A contact email address shown on an RCS sender's info page.
    SenderWebsite:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://example.com
          description: Public HTTPS URL of the website, for example `https://example.com`.
        label:
          type: string
          example: Website
          description: Text shown for the link, for example `Website`.
      description: A website shown on an RCS sender's info page.
    SenderLink:
      type: object
      description: A labelled link shown on an RCS sender's info page, used for the privacy policy and terms of service.
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/privacy
          description: Public HTTPS URL of the page, for example `https://example.com/privacy`.
        label:
          type: string
          example: Privacy policy
          description: Text shown for the link, for example `Privacy policy`.
    SenderPlatform:
      type: object
      description: Identifiers the RCS platform has assigned to your agent. Set them only when you already have them.
      properties:
        applicationId:
          type: string
          example: YOUR_APPLICATION_ID
          description: The application ID of your agent on the RCS platform.
        entityId:
          type: string
          example: YOUR_ENTITY_ID
          description: The entity ID of your agent on the RCS platform.
    Sender:
      type: object
      description: 'An RCS sender (agent): the verified brand identity that recipients see instead of a phone number. Send
        RCS from it by passing its `senderName` as `from` with `channel: rcs`.'
      properties:
        id:
          type: string
          format: uuid
          example: 7a1c3e5f-9b2d-4c6e-8f0a-1b3d5e7f9a21
          description: Unique identifier of the sender on Vobiz (UUID). Use it in every `/senders/{id}` path.
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (`MA_...`) that owns the sender.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
          example: YOUR_ROUTING_IDENTIFIER
        senderName:
          type: string
          description: Unique technical name of the sender on the RCS platform. Pass it as `from` when you send RCS. Fixed
            after creation.
          example: example-brand
        displayName:
          type: string
          description: The brand name recipients see at the top of the conversation.
          example: Example Brand
        description:
          type: string
          example: Order updates and support for Example Brand customers.
          description: Short description shown on the sender's info page.
        billingCategory:
          type: string
          description: How the RCS platform bills conversations from this sender, for example `CONVERSATIONAL` or `NON_CONVERSATIONAL`.
          example: CONVERSATIONAL
        useCase:
          type: string
          description: The kind of traffic the sender carries, for example `OTP`, `TRANSACTIONAL`, `PROMOTIONAL` or `MULTI_USE`.
          example: TRANSACTIONAL
        hostingRegion:
          type: string
          description: The region where the RCS platform hosts the sender, for example `NORTH_AMERICA`, `EUROPE` or `ASIA_PACIFIC`.
            Fixed after creation.
          example: NORTH_AMERICA
        status:
          type: string
          default: pending
          description: Launch status reported by the RCS platform, stored on your account. `pending` until the platform reports
            otherwise. Call `GET /senders/{id}/status` to refresh it.
          example: pending
        brand:
          allOf:
          - $ref: '#/components/schemas/SenderBrand'
          description: The brand the sender represents. Omitted when not set.
        color:
          type: string
          description: Accent colour as a hex code. Omitted when not set.
          example: '#1A73E8'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/SenderPhone'
          description: Contact phone numbers shown on the sender's info page. Omitted when none are set.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/SenderEmail'
          description: Contact email addresses shown on the sender's info page. Omitted when none are set.
        websites:
          type: array
          items:
            $ref: '#/components/schemas/SenderWebsite'
          description: Websites shown on the sender's info page. Omitted when none are set.
        bannerUrl:
          type: string
          format: uri
          example: https://example.com/rcs/banner.jpg
          description: HTTPS URL of the banner image. Omitted when not set.
        logoUrl:
          type: string
          format: uri
          example: https://example.com/rcs/logo.png
          description: HTTPS URL of the logo image. Omitted when not set.
        privacy:
          allOf:
          - $ref: '#/components/schemas/SenderLink'
          description: Link to your privacy policy.
        termsOfService:
          allOf:
          - $ref: '#/components/schemas/SenderLink'
          description: Link to your terms of service.
        platform:
          allOf:
          - $ref: '#/components/schemas/SenderPlatform'
          description: Identifiers the RCS platform assigned to your agent. Omitted when not set.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the sender was created on your account (ISO 8601, UTC).
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the sender last changed, including status refreshes (ISO 8601, UTC).
    CreateSenderRequest:
      type: object
      required:
      - provider
      - senderName
      properties:
        provider:
          type: string
          description: The routing identifier your account was provisioned with for RCS. Contact support if you are unsure
            which value to use; an unknown value returns `400`.
          example: YOUR_ROUTING_IDENTIFIER
        senderName:
          type: string
          description: Unique technical name of the sender on the RCS platform. You pass it as `from` when you send RCS, and
            it cannot be changed later.
          example: example-brand
        displayName:
          type: string
          description: The brand name recipients see at the top of the conversation.
          example: Example Brand
        description:
          type: string
          description: Short description of your business or the sender's purpose, shown on the sender's info page.
          example: Order updates and support for Example Brand customers.
        billingCategory:
          type: string
          description: How the RCS platform bills conversations from this sender. Values accepted by the platform include
            `CONVERSATIONAL` and `NON_CONVERSATIONAL`.
          example: CONVERSATIONAL
        useCase:
          type: string
          description: The kind of traffic the sender carries, reviewed by the RCS platform. Values accepted by the platform
            include `OTP`, `TRANSACTIONAL`, `PROMOTIONAL` and `MULTI_USE`.
          example: TRANSACTIONAL
        hostingRegion:
          type: string
          description: The region where the RCS platform hosts the sender. Values accepted by the platform include `NORTH_AMERICA`,
            `EUROPE` and `ASIA_PACIFIC`. Cannot be changed later.
          example: NORTH_AMERICA
        brand:
          allOf:
          - $ref: '#/components/schemas/SenderBrand'
          description: The brand the sender represents.
        color:
          type: string
          description: Accent colour for the sender's buttons and header, as a hex code such as `#1A73E8`.
          example: '#1A73E8'
        phones:
          type: array
          description: Contact phone numbers shown on the sender's info page, each with a label.
          items:
            $ref: '#/components/schemas/SenderPhone'
        emails:
          type: array
          description: Contact email addresses shown on the sender's info page, each with a label.
          items:
            $ref: '#/components/schemas/SenderEmail'
        websites:
          type: array
          description: Websites shown on the sender's info page, each with a label.
          items:
            $ref: '#/components/schemas/SenderWebsite'
        bannerUrl:
          type: string
          format: uri
          description: Publicly reachable HTTPS URL of the banner image shown at the top of the sender's info page.
          example: https://example.com/rcs/banner.jpg
        logoUrl:
          type: string
          format: uri
          description: Publicly reachable HTTPS URL of the logo shown next to every message.
          example: https://example.com/rcs/logo.png
        privacy:
          allOf:
          - $ref: '#/components/schemas/SenderLink'
          description: Link to your privacy policy, shown on the sender's info page.
        termsOfService:
          allOf:
          - $ref: '#/components/schemas/SenderLink'
          description: Link to your terms of service, shown on the sender's info page.
        platform:
          allOf:
          - $ref: '#/components/schemas/SenderPlatform'
          description: Identifiers the RCS platform has already assigned to your agent, if you have any.
      description: The identity and profile of a new RCS sender. `provider` and `senderName` are required; the profile fields
        are what recipients see and what the RCS platform reviews.
    UpdateSenderRequest:
      type: object
      description: Any subset of the editable RCS sender fields. Fields you leave out keep their value; `provider`, `senderName`
        and `hostingRegion` are fixed after creation.
      properties:
        displayName:
          type: string
          example: Example Brand
          description: The brand name recipients see at the top of the conversation.
        description:
          type: string
          example: Order updates and support for Example Brand customers.
          description: Short description of your business or the sender's purpose, shown on the sender's info page.
        billingCategory:
          type: string
          description: How the RCS platform bills conversations from this sender, for example `CONVERSATIONAL` or `NON_CONVERSATIONAL`.
          example: CONVERSATIONAL
        useCase:
          type: string
          description: The kind of traffic the sender carries, for example `OTP`, `TRANSACTIONAL`, `PROMOTIONAL` or `MULTI_USE`.
          example: TRANSACTIONAL
        brand:
          allOf:
          - $ref: '#/components/schemas/SenderBrand'
          description: The brand the sender represents.
        color:
          type: string
          example: '#1A73E8'
          description: Accent colour for the sender's buttons and header, as a hex code such as `#1A73E8`.
        phones:
          type: array
          items:
            $ref: '#/components/schemas/SenderPhone'
          description: Contact phone numbers shown on the sender's info page.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/SenderEmail'
          description: Contact email addresses shown on the sender's info page.
        websites:
          type: array
          items:
            $ref: '#/components/schemas/SenderWebsite'
          description: Websites shown on the sender's info page.
        bannerUrl:
          type: string
          format: uri
          example: https://example.com/rcs/banner.jpg
          description: Publicly reachable HTTPS URL of the banner image.
        logoUrl:
          type: string
          format: uri
          example: https://example.com/rcs/logo.png
          description: Publicly reachable HTTPS URL of the logo image.
        privacy:
          allOf:
          - $ref: '#/components/schemas/SenderLink'
          description: Link to your privacy policy.
        termsOfService:
          allOf:
          - $ref: '#/components/schemas/SenderLink'
          description: Link to your terms of service.
        platform:
          allOf:
          - $ref: '#/components/schemas/SenderPlatform'
          description: Identifiers the RCS platform has assigned to your agent.
    Template:
      type: object
      description: A message template registered on an RCS sender, with the approval status reported by the RCS platform.
      properties:
        id:
          type: string
          format: uuid
          example: c2e4a6b8-1d3f-4a5c-9e7b-6f8d0a2c4e61
          description: Unique identifier of the template on Vobiz (UUID). Template endpoints address templates by `templateName`
            instead.
        senderId:
          type: string
          format: uuid
          description: The `id` of the RCS sender the template belongs to.
          example: 7a1c3e5f-9b2d-4c6e-8f0a-1b3d5e7f9a21
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (`MA_...`) that owns the template.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
          example: YOUR_ROUTING_IDENTIFIER
        templateName:
          type: string
          description: Unique name of the template on its sender. Used in the path of every template endpoint.
          example: order-shipped
        type:
          type: string
          description: Template type as defined by the RCS platform.
        status:
          type: string
          default: pending
          description: Approval status reported by the RCS platform, stored on your account. `pending` until the platform
            reports otherwise. Call `GET /senders/{senderId}/templates/{templateName}/status` to refresh it.
          example: pending
        content:
          type: object
          description: The template content exactly as you submitted it.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the template was created on your account (ISO 8601, UTC).
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the template last changed, including status refreshes (ISO 8601, UTC).
    CreateTemplateRequest:
      type: object
      required:
      - templateName
      - type
      - content
      properties:
        templateName:
          type: string
          description: Unique name for the template on this sender. You use it in the path of every template endpoint.
          example: order-shipped
        type:
          type: string
          description: Template type as defined by the RCS platform. It decides which `content` shape the platform expects.
        content:
          type: object
          description: Template content as a JSON object in the shape the RCS platform defines for the chosen `type`. Stored
            and returned exactly as you submit it.
          additionalProperties: true
      description: A message template to register on an RCS sender. All three fields are required and are passed to the RCS
        platform unchanged.
    TenDLCError:
      description: Error returned when the US 10DLC registry declines or cannot process a request. `error` is a human-readable
        message you can show or log. When the registry answers with `400`, `404`, `409`, `422` or `429`, the same status is
        passed through with this body; `502` means the registry did not answer and `503` means it did not accept Vobiz's service
        credentials.
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          providerError:
            type: string
            description: Opaque diagnostic string you can quote to support. Do not parse it.
            example: 'registration error 400 (HTTP 400): brand legalName is required'
    BrandAddress:
      type: object
      description: Postal address of the business. Keys are passed to the US 10DLC registry as given, so you can add any address
        key the registry accepts.
      additionalProperties: true
      properties:
        street:
          type: string
          example: 100 Example Street
          description: Street address, including number and suite.
        city:
          type: string
          example: San Francisco
          description: City or locality.
        state:
          type: string
          example: CA
          description: State, province or region; for US addresses, the two-letter state code (for example `CA`).
        zipCode:
          type: string
          example: '94105'
          description: ZIP or postal code, as a string (for example `94105`).
    BrandRejectionReason:
      type: object
      description: One rejection recorded by a registrar for the brand.
      properties:
        registrar:
          type: string
          description: Registrar that recorded the rejection.
          example: TCR
        state:
          type: string
          description: The brand's state at that registrar when the rejection was recorded. Omitted when not reported.
          example: REJECTED
        rejectionReason:
          type: string
          example: Tax ID does not match the legal name on file.
          description: The registrar's explanation of what to fix before you register again.
    CreateBrandRequest:
      type: object
      description: The business that will send messages. `name` and `brandType` are required; every other value is passed
        to the US 10DLC registry as given, so use the values the registry accepts (listed per field) and match your official
        records.
      required:
      - name
      - brandType
      properties:
        referenceId:
          type: string
          description: Your own idempotency reference, any string unique per brand on your account. Repeating a create with
            the same value reconciles to the same brand instead of creating a second one. Ignored on update.
          example: brand-example-corp-01
        name:
          type: string
          description: Display name of the brand, usually the name customers know you by. Required.
          example: Example Corp
        legalName:
          type: string
          description: Registered legal name of the business, exactly as it appears on tax records.
          example: Example Corporation Inc.
        brandType:
          type: string
          enum:
          - TENDLC_PRIVATE_COMPANY
          - TENDLC_PUBLIC_COMPANY
          - TENDLC_NON_PROFIT
          - TENDLC_GOVERNMENT
          - TOLL_FREE_NUMBER
          description: Kind of business. Required. One of `TENDLC_PRIVATE_COMPANY` (privately held business), `TENDLC_PUBLIC_COMPANY`
            (publicly traded company; also goes through brand authentication), `TENDLC_NON_PROFIT` (registered non-profit),
            `TENDLC_GOVERNMENT` (government body) or `TOLL_FREE_NUMBER` (a business registered for toll-free messaging).
        website:
          type: string
          format: uri
          example: https://example.com
          description: Business website. It must be live, match the business and show your privacy policy.
        supportEmail:
          type: string
          format: email
          example: support@example.com
          description: Support email address for the business, ideally on the website's domain.
        supportPhone:
          type: string
          description: Support phone number for the business, in E.164 format (for example `+14155550100`).
          example: '+14155550100'
        vertical:
          type: string
          description: Industry of the business. Values accepted by the US 10DLC registry include `AGRICULTURE`, `COMMUNICATION`,
            `CONSTRUCTION`, `EDUCATION`, `ENERGY`, `ENTERTAINMENT`, `FINANCIAL`, `GAMBLING`, `GOVERNMENT`, `HEALTHCARE`, `HOSPITALITY`,
            `HUMAN_RESOURCES`, `INFORMATION_TECHNOLOGY_SERVICES`, `INSURANCE`, `LEGAL`, `MANUFACTURING`, `NGO`, `POLITICAL`,
            `POSTAL`, `PROFESSIONAL`, `REAL_ESTATE`, `RETAIL`, `TECHNOLOGY`, `TRANSPORTATION`.
          example: TECHNOLOGY
        taxId:
          type: string
          description: Tax identifier of the business, for example the 9-digit US EIN. It must match `legalName` in the issuing
            country's records.
          example: 12-3456789
        taxIdIssuingCountry:
          type: string
          description: ISO 3166-1 alpha-2 code of the country that issued `taxId`, for example `US`.
          example: US
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 code of the country where the business is registered, for example `US`.
          example: US
        address:
          allOf:
          - $ref: '#/components/schemas/BrandAddress'
          description: Postal address of the business as it appears on its registration records.
        alternateBusinessId:
          type: object
          description: Alternate business identifier (for example a DUNS or LEI record), passed to the registry as given.
            Send it only when the registry asks for one.
          additionalProperties: true
          example:
            type: DUNS
            id: '123456789'
        businessContactFirstName:
          type: string
          example: Alex
          description: First name of the person the registry can contact about the brand.
        businessContactLastName:
          type: string
          example: Doe
          description: Last name of the person the registry can contact about the brand.
        businessContactEmail:
          type: string
          format: email
          description: Email address of the business contact. The registry sends brand-authentication and 2FA requests for
            `TENDLC_PUBLIC_COMPANY` brands here.
          example: alex.doe@example.com
        businessDba:
          type: string
          description: Trading name ("doing business as") when it differs from `legalName`. Note the casing `businessDba`
            on brand requests.
          example: Example
        legalEntityType:
          type: string
          description: 'Legal form of the business. Values accepted by the US 10DLC registry: `PRIVATE_COMPANY`, `PUBLIC_COMPANY`,
            `NON_PROFIT`, `GOVERNMENT`, `SOLE_PROPRIETOR`.'
          example: PRIVATE_COMPANY
        businessRegistrationType:
          type: string
          description: 'Type of registration number for a business outside the US. Values accepted by the US 10DLC registry:
            `VAT`, `CBN`, `PROVINCIAL_NUMBER`, `ABN`, `SIREN`, `NZBN`, `CIF`, `CNPJ`, `OTHER`.'
        taxExemptStatus:
          type: string
          description: Tax-exempt status of a `TENDLC_NON_PROFIT` brand.
          example: 501c3
        stockExchange:
          type: string
          description: Exchange where the company is listed, for example `NASDAQ` or `NYSE`. `TENDLC_PUBLIC_COMPANY` brands
            only.
          example: NASDAQ
        stockSymbol:
          type: string
          description: Ticker symbol on `stockExchange`. `TENDLC_PUBLIC_COMPANY` brands only.
          example: EXMP
    Brand:
      type: object
      description: 'A brand on your account: the business behind your 10DLC traffic and its state at the US 10DLC registry.
        Optional fields are omitted when empty, and registry state is refreshed when you retrieve the brand.'
      properties:
        id:
          type: string
          format: uuid
          description: Brand ID (UUID) on your account. Use it in every `/10dlc/brands/{id}` path and as `brandId` when you
            create a campaign.
          example: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (`MA_...`). Always the account whose credentials made the request.
        name:
          type: string
          example: Example Corp
          description: Display name you gave the brand when you created it.
        legalName:
          type: string
          example: Example Corporation Inc.
          description: Registered legal name of the business. Omitted when not set.
        brandType:
          type: string
          enum:
          - TENDLC_PRIVATE_COMPANY
          - TENDLC_PUBLIC_COMPANY
          - TENDLC_NON_PROFIT
          - TENDLC_GOVERNMENT
          - TOLL_FREE_NUMBER
          description: 'Kind of business behind the brand: `TENDLC_PRIVATE_COMPANY` (privately held business), `TENDLC_PUBLIC_COMPANY`
            (publicly traded company; also goes through brand authentication), `TENDLC_NON_PROFIT` (registered non-profit),
            `TENDLC_GOVERNMENT` (government body) or `TOLL_FREE_NUMBER` (a business registered for toll-free messaging).'
        stage:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          description: 'Where the brand is in your workflow: `DRAFT` until you call `POST /10dlc/brands/{id}/register`, then
            `SUBMITTED`.'
        registrationStatus:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - PENDING_2FA
          - PENDING_APPEAL
          - REJECTED
          description: The registrar's decision, present once the brand is submitted. `PENDING` while under review, `PENDING_2FA`
            while a public company's business contact completes brand authentication, `PENDING_APPEAL` while an appeal is
            reviewed, `ACTIVE` when approved and `REJECTED` when declined (see `rejectionReasons`).
        brandIdentityStatus:
          type: string
          description: Identity verification result from the registry, for example `VERIFIED`, `UNVERIFIED` or `VETTED_VERIFIED`.
            Omitted until the registry reports one.
          example: VERIFIED
        rejectionReasons:
          type: array
          description: Rejections recorded by registrars, one entry per registrar. Omitted when there are none; fix the brand
            with `PUT /10dlc/brands/{id}` and register it again.
          items:
            $ref: '#/components/schemas/BrandRejectionReason'
        website:
          type: string
          format: uri
          example: https://example.com
          description: Business website as submitted to the registry. Omitted when not set.
        supportEmail:
          type: string
          example: support@example.com
          description: Support email address for the business. Omitted when not set.
        supportPhone:
          type: string
          example: '+14155550100'
          description: Support phone number for the business, in E.164 format. Omitted when not set.
        vertical:
          type: string
          example: TECHNOLOGY
          description: Industry vertical code as submitted to the registry, for example `TECHNOLOGY`. Omitted when not set.
        taxId:
          type: string
          example: 12-3456789
          description: Tax identifier of the business, for example a US EIN. Omitted when not set.
        taxIdIssuingCountry:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the country that issued `taxId`, for example `US`. Omitted when not set.
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the country where the business is registered. Omitted when not set.
        address:
          allOf:
          - $ref: '#/components/schemas/BrandAddress'
          description: Postal address of the business as submitted to the registry. Omitted when not set.
        alternateBusinessId:
          type: object
          additionalProperties: true
          description: Alternate business identifier (for example a DUNS or LEI record), returned as you sent it. Omitted
            when not set.
        businessContactFirstName:
          type: string
          example: Alex
          description: First name of the business contact the registry can reach. Omitted when not set.
        businessContactLastName:
          type: string
          example: Doe
          description: Last name of the business contact the registry can reach. Omitted when not set.
        businessContactEmail:
          type: string
          example: alex.doe@example.com
          description: Email address of the business contact; brand-authentication and 2FA requests go here. Omitted when
            not set.
        businessDba:
          type: string
          description: Trading name ("doing business as") when it differs from `legalName`. Omitted when not set.
        legalEntityType:
          type: string
          example: PRIVATE_COMPANY
          description: Legal entity type as submitted to the registry, for example `PRIVATE_COMPANY`. Omitted when not set.
        businessRegistrationType:
          type: string
          description: Type of business registration number for a business outside the US, for example `VAT`. Omitted when
            not set.
        stockExchange:
          type: string
          description: Exchange where a `TENDLC_PUBLIC_COMPANY` brand is listed. Omitted when not set.
        stockSymbol:
          type: string
          description: Ticker symbol of a `TENDLC_PUBLIC_COMPANY` brand. Omitted when not set.
        taxExemptStatus:
          type: string
          description: Tax-exempt status of a `TENDLC_NON_PROFIT` brand. Omitted when not set.
        lastSyncedAt:
          type: string
          format: date-time
          description: When Vobiz last refreshed this record from the US 10DLC registry, in ISO 8601 (RFC 3339) UTC. Omitted
            until the first refresh.
          example: '2026-10-12T10:35:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the record was created on your account, in ISO 8601 (RFC 3339) UTC.
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-12T10:35:00Z'
          description: When the record last changed on your account, in ISO 8601 (RFC 3339) UTC.
    BrandRegistrarStatus:
      type: object
      description: The brand's state at one registrar, read live from the US 10DLC registry.
      properties:
        registrar:
          type: string
          example: TCR
          description: Registrar that reviewed the brand.
        state:
          type: string
          example: ACTIVE
          description: The brand's registration state at this registrar, for example `ACTIVE`, `PENDING` or `REJECTED`.
        brandIdentityStatus:
          type: string
          description: Identity verification result from this registrar, for example `VERIFIED`. Present only when the registrar
            reports one.
          example: VERIFIED
        brandAuthenticationStatus:
          type: string
          description: Brand-authentication (2FA) status for `TENDLC_PUBLIC_COMPANY` brands. Present only when the registrar
            reports one.
          example: AUTHENTICATED
        rejectionReason:
          type: string
          description: Why the registrar rejected the brand. Present only when `state` is a rejection.
    BrandAuthRequested:
      type: object
      properties:
        status:
          type: string
          example: requested
          description: Always `requested`. Follow the result in the brand's `registrationStatus` or in `GET /10dlc/brands/{id}/registrar-statuses`.
      description: Acknowledgement that the registry accepted a brand-authentication or 2FA resend request. The outcome arrives
        later on the brand.
    BrandVetRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - STANDARD
          - ENHANCED
          - POLITICAL
          default: STANDARD
          description: 'Kind of vet to request: `STANDARD` (the default), `ENHANCED` (a deeper review) or `POLITICAL` (for
            political organisations). Case-insensitive; any other value returns `400` with `invalid request: type must be
            one of STANDARD, ENHANCED, POLITICAL`.'
      description: Body of a brand vetting request. Send `{}` or omit `type` for a standard vet.
    RegistryRecord:
      type: object
      description: A record returned by the US 10DLC registry, such as a vetting record, passed through as received. Its keys
        follow the registry's schema, so read the fields you need and ignore the rest.
      additionalProperties: true
    CampaignFields:
      type: object
      description: Fields shared by campaign create and update requests. Values are passed to the US 10DLC registry as given,
        and reviewers check them against your brand and website.
      properties:
        name:
          type: string
          description: Name for the campaign, for your reference. Required on create and on update.
          example: Example Corp account alerts
        programSummary:
          type: string
          description: 'Plain-language description of the program: what you send, to whom, how often and how recipients opt
            in. Reviewers read this first.'
          example: Example Corp sends account and support alerts to customers who opted in on the sign-up form. Reply STOP
            to opt out, HELP for help.
        confirmationMessage:
          type: string
          description: Message you send when a recipient opts in. Include your brand name and how to get help or opt out.
          example: 'Example Corp: You are subscribed to account alerts. Msg frequency varies. Msg & data rates may apply.
            Reply HELP for help, STOP to opt out.'
        helpMessage:
          type: string
          description: Reply you send when a recipient texts HELP. Include your brand name and a way to reach support.
          example: 'Example Corp: For help email support@example.com. Reply STOP to opt out.'
        stopMessage:
          type: string
          description: Reply you send when a recipient texts STOP, confirming they will receive no further messages.
          example: 'Example Corp: You have been unsubscribed. Reply HELP for help.'
        customerCarePhone:
          type: string
          example: '+14155550100'
          description: Customer care phone number for the program, in E.164 format.
        customerCareEmail:
          type: string
          format: email
          example: support@example.com
          description: Customer care email address for the program.
        termsAndConditionsUrl:
          type: string
          format: uri
          example: https://example.com/terms
          description: Public URL of the terms and conditions that cover the program.
        privacyPolicyUrl:
          type: string
          format: uri
          example: https://example.com/privacy
          description: Public URL of your privacy policy.
        exampleMessages:
          type: array
          description: Sample messages exactly as the campaign will send them, including your brand name and opt-out language.
            Cover each use case you list.
          items:
            type: string
          example:
          - 'Example Corp: Your support ticket #48213 was updated. View it at https://example.com/support. Reply STOP to opt
            out.'
        useCases:
          type: array
          description: 'Use-case codes the campaign covers. Values accepted by the US 10DLC registry: `TWO_FACTOR_AUTH`, `ALERTS`,
            `FRAUD_ALERTS`, `CHAT`, `PROMOTIONAL_MARKETING`, `EDUCATION`, `DONATION`, `PUBLIC_SERVICE_ANNOUNCEMENT`, `VOTING_POLLING`,
            `POLITICAL`, `M2M`, `SWEEPSTAKE`.'
          items:
            type: string
          example:
          - ALERTS
        messageTypes:
          type: array
          description: Message types the campaign sends, for example `SMS` and `MMS`.
          items:
            type: string
          example:
          - SMS
        optIns:
          type: object
          description: How recipients give consent, as an object keyed by opt-in channel (for example `web`, `keyword`, `paper`).
            Each entry describes that flow, for example `url` and `callToAction` for `web`; the object is passed to the registry
            as given.
          additionalProperties: true
          example:
            web:
              url: https://example.com/signup
              callToAction: By checking this box you agree to receive account alerts from Example Corp. Msg frequency varies.
                Msg & data rates may apply. Reply STOP to opt out, HELP for help.
        lowVolume:
          type: boolean
          default: false
          description: Declares the campaign as low volume to the registry. Defaults to `false`.
        ageGated:
          type: boolean
          default: false
          description: Set `true` when the content is restricted to adults. Defaults to `false`.
        directLending:
          type: boolean
          default: false
          description: Set `true` when the content relates to direct lending or loan arrangements. Defaults to `false`.
        embeddedLink:
          type: boolean
          default: false
          description: Set `true` when messages contain URLs. Defaults to `false`.
        embeddedPhone:
          type: boolean
          default: false
          description: Set `true` when messages contain phone numbers. Defaults to `false`.
        numbers:
          type: array
          description: Numbers on your account to attach to the campaign, as digits with country code and no `+` (for example
            `14155550100`).
          items:
            type: string
          example:
          - '14155550100'
        supportingDocuments:
          type: array
          description: '`documentId` values of supporting documents uploaded with `POST /10dlc/documents`. Every ID must be
            on your account, otherwise the request returns `400`.'
          items:
            type: string
            format: uuid
        mmsSampleFiles:
          type: array
          description: '`documentId` values of MMS sample files uploaded with `POST /10dlc/documents`. Every ID must be on
            your account, otherwise the request returns `400`.'
          items:
            type: string
            format: uuid
    CreateCampaignRequest:
      allOf:
      - $ref: '#/components/schemas/CampaignFields'
      - type: object
        required:
        - brandId
        - name
        properties:
          referenceId:
            type: string
            description: Your own idempotency reference. Repeating a create with the same value reconciles to the same campaign
              instead of creating a second one. Ignored on update.
            example: campaign-account-alerts-01
          brandId:
            type: string
            format: uuid
            description: Required. ID of the brand from `POST /10dlc/brands` that runs this campaign. A missing, unknown or
              non-UUID value returns `404` with `{"error":"brand not found"}`.
            example: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
          campaignType:
            type: string
            enum:
            - TEN_DIGIT_LONG_CODE
            - EXTERNAL_TEN_DIGIT_LONG_CODE
            - DCA2_TEN_DIGIT_LONG_CODE
            - SHORT_CODE
            - RCS_SENDER_LAUNCH
            default: TEN_DIGIT_LONG_CODE
            description: Kind of campaign. Defaults to `TEN_DIGIT_LONG_CODE`, the standard 10DLC campaign. Toll-free types
              return `400`; use `POST /10dlc/campaigns/toll-free` for those.
      description: 'Body of a 10DLC campaign create: the shared campaign fields plus the brand, type and idempotency reference.
        `name` and `brandId` are required.'
    UpdateCampaignRequest:
      allOf:
      - $ref: '#/components/schemas/CampaignFields'
      - type: object
        required:
        - name
        description: Full replacement of the campaign's editable fields. `campaignType` and the brand stay as created.
      description: 'Full replacement body for a 10DLC campaign update: the shared campaign fields. `name` is required and
        any field you leave out is cleared; `campaignType` and the brand stay as created.'
    TollFreeCampaignRequest:
      type: object
      description: Toll-free verification request. The business details travel inside the request, so no `brandId` is needed;
        only `name` is required, but the reviewer checks every field you send.
      required:
      - name
      properties:
        referenceId:
          type: string
          description: Your own idempotency reference. Repeating a create with the same value reconciles to the same campaign
            instead of creating a second one.
          example: tollfree-notifications-01
        name:
          type: string
          example: Example Corp toll-free notifications
          description: 'Name for the toll-free campaign, for your reference. Required (`400` with `invalid request: name is
            required` otherwise).'
        privacyPolicyUrl:
          type: string
          format: uri
          example: https://example.com/privacy
          description: Public URL of your privacy policy.
        termsAndConditionsUrl:
          type: string
          format: uri
          example: https://example.com/terms
          description: Public URL of the terms and conditions that cover the program.
        messageVolume:
          type: string
          description: 'Expected monthly message volume. Values accepted by the US 10DLC registry: `HUNDRED`, `TEN_THOUSAND`,
            `TWO_HUNDRED_FIFTY_THOUSAND`, `SEVEN_HUNDRED_FIFTY_THOUSAND`, `FIVE_MILLION`.'
          example: TEN_THOUSAND
        numbers:
          type: array
          description: Toll-free numbers on your account to verify, in E.164 format (for example `+18885550100`).
          items:
            type: string
          example:
          - '+18335550100'
        numberKeys:
          type: array
          description: Registry number keys of the numbers to verify, as an alternative to `numbers`.
          items:
            type: string
        useCase:
          type: string
          description: 'Main use case of the program. Values accepted by the US 10DLC registry: `TWO_FACTOR_AUTH`, `NOTIFICATIONS`,
            `SYSTEM_ALERTS`, `APP_NOTIFICATIONS`, `BANKING`, `BOOKING_CONFIRMATIONS`, `CHATBOT`, `COURIER_SERVICES_DELIVERIES`,
            `EMERGENCY_ALERTS`, `EVENTS_PLANNING`, `FRAUD_ALERTS`, `GENERAL_MARKETING`, `HEALTHCARE`, `INSURANCE_SERVICES`,
            `LEGAL_SERVICES`, `MOTIVATIONAL_REMINDERS`, `POLITICAL`, `REAL_ESTATE_SERVICES`, `RELIGIOUS_SERVICES`, `REWARDS_PROGRAM`,
            `WEBINAR_REMINDERS`, `AUCTIONS`, `COVID_19_ALERTS`.'
          example: NOTIFICATIONS
        programSummary:
          type: string
          example: Example Corp sends account and support notifications to customers who opted in on the contact form. Reply
            STOP to opt out, HELP for help.
          description: 'Plain-language description of the program: what you send, to whom, how often and how recipients opt
            in.'
        exampleMessage:
          type: string
          example: 'Example Corp: Your account balance is low. Add funds at https://example.com/wallet. Reply STOP to opt
            out, HELP for help.'
          description: A sample message exactly as you will send it, including your brand name and opt-out language.
        optIns:
          type: object
          description: How recipients give consent, as an object keyed by opt-in channel (for example `web` with `url` and
            `callToAction`). Passed to the registry as given.
          additionalProperties: true
          example:
            web:
              url: https://example.com/contact
              callToAction: By checking this box you agree to receive account notifications from Example Corp. Reply STOP
                to opt out, HELP for help.
        optInImageURLs:
          type: array
          description: Public URLs of screenshots or images that show the opt-in flow to the reviewer.
          items:
            type: string
            format: uri
          example:
          - https://example.com/opt-in-screenshot.png
        additionalInformation:
          type: string
          description: Anything else the reviewer should know about the program, in plain text.
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the country where the business is registered.
        address:
          allOf:
          - $ref: '#/components/schemas/BrandAddress'
          description: Postal address of the business as it appears on its registration records.
        supportPhone:
          type: string
          example: '+14155550100'
          description: Support phone number for the business, in E.164 format.
        supportEmail:
          type: string
          format: email
          example: support@example.com
          description: Support email address for the business.
        businessContactFirstName:
          type: string
          example: Alex
          description: First name of the person the reviewer can contact about the business.
        businessContactLastName:
          type: string
          example: Doe
          description: Last name of the person the reviewer can contact about the business.
        legalName:
          type: string
          example: Example Corporation Inc.
          description: Registered legal name of the business, exactly as it appears on tax records.
        businessDBA:
          type: string
          description: Trading name ("doing business as") when it differs from `legalName`. Note the casing `businessDBA`
            on this endpoint, unlike `businessDba` on brands.
        businessName:
          type: string
          example: Example Corp
          description: Business name customers know you by.
        businessWebsite:
          type: string
          format: uri
          example: https://example.com
          description: Business website. It must be live and match the business.
        customerCareEmail:
          type: string
          format: email
          example: support@example.com
          description: Customer care email address for the program.
        taxId:
          type: string
          example: 12-3456789
          description: Tax identifier of the business, for example the US EIN.
        taxIdIssuingCountry:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 code of the country that issued `taxId`.
        legalEntityType:
          type: string
          description: 'Legal form of the business. Values accepted by the US 10DLC registry: `PRIVATE_COMPANY`, `PUBLIC_COMPANY`,
            `NON_PROFIT`, `GOVERNMENT`, `SOLE_PROPRIETOR`.'
          example: PRIVATE_COMPANY
        businessRegistrationType:
          type: string
          description: 'Type of registration number for a business outside the US. Values accepted by the US 10DLC registry:
            `VAT`, `CBN`, `PROVINCIAL_NUMBER`, `ABN`, `SIREN`, `NZBN`, `CIF`, `CNPJ`, `OTHER`.'
        campaignVerifyToken:
          type: string
          description: Campaign Verify token for a US political program. Omit it for every other program.
        priorityId:
          type: string
          format: uuid
          description: ID (UUID) of a priority option from `GET /10dlc/campaigns/priorities`. A value that is not a UUID returns
            `400`; omit it when the list is empty.
    Campaign:
      type: object
      description: A 10DLC or toll-free campaign on your account and its state at the US 10DLC registry. Optional fields are
        omitted when empty, and registry state is refreshed when you retrieve the campaign.
      properties:
        id:
          type: string
          format: uuid
          description: Campaign ID (UUID) on your account. Use it in every `/10dlc/campaigns/{id}` path.
          example: 8a7d2f10-3c4b-4e9a-b1d2-6e5f4a3b2c11
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (`MA_...`). Always the account whose credentials made the request.
        brandId:
          type: string
          format: uuid
          description: ID of the brand the campaign runs under. Omitted for toll-free campaigns, which carry their business
            details themselves.
          example: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
        name:
          type: string
          example: Example Corp account alerts
          description: Name you gave the campaign, for your reference.
        campaignType:
          type: string
          enum:
          - TEN_DIGIT_LONG_CODE
          - TOLL_FREE_UNIFIED_NUMBER
          - TOLL_FREE_NUMBER
          - SHORT_CODE
          - EXTERNAL_TEN_DIGIT_LONG_CODE
          - DCA2_TEN_DIGIT_LONG_CODE
          - TOLL_FREE_EXTERNALLY_VERIFIED
          - RCS_SENDER_LAUNCH
          description: Kind of campaign. `TEN_DIGIT_LONG_CODE` is a standard 10DLC campaign (the default on create) and `TOLL_FREE_UNIFIED_NUMBER`
            is a toll-free verification created with `POST /10dlc/campaigns/toll-free`. The other values are registry campaign
            types you can request on create.
        stage:
          type: string
          description: Registry lifecycle stage. A new campaign is `DRAFT`; after you register it, it moves through review
            stages such as `SUBMITTED`, `IN_REVIEW` or `APPEALED` and settles at `REGISTERED` or `REJECTED`. Other values
            include `REGISTERED_PENDING_UPDATE`, `REGISTERED_PENDING_DEREGISTRATION`, `REJECTED_EXTERNALLY`, `DEREGISTERED`,
            `ARCHIVED`, `BLOCKED`, `SUSPENDED` and `DELETED`; treat it as an open string.
          example: REGISTERED
        programSummary:
          type: string
          description: Description of the program as submitted to the registry. Omitted when not set.
        confirmationMessage:
          type: string
          description: Opt-in confirmation message as submitted. Omitted when not set.
        helpMessage:
          type: string
          description: HELP reply as submitted. Omitted when not set.
        stopMessage:
          type: string
          description: STOP reply as submitted. Omitted when not set.
        customerCarePhone:
          type: string
          example: '+14155550100'
          description: Customer care phone number, in E.164 format. Omitted when not set.
        customerCareEmail:
          type: string
          example: support@example.com
          description: Customer care email address. Omitted when not set.
        exampleMessages:
          type: array
          items:
            type: string
          description: Sample messages as submitted. Omitted when not set.
        termsAndConditionsUrl:
          type: string
          format: uri
          description: Public URL of your terms and conditions. Omitted when not set.
        privacyPolicyUrl:
          type: string
          format: uri
          description: Public URL of your privacy policy. Omitted when not set.
        useCases:
          type: array
          items:
            type: string
          example:
          - ALERTS
          description: Use-case codes as submitted, for example `ALERTS` or, on a toll-free campaign, `NOTIFICATIONS`. Omitted
            when not set.
        messageTypes:
          type: array
          items:
            type: string
          example:
          - SMS
          description: Message types as submitted, for example `SMS`. Omitted when not set.
        optIns:
          type: object
          description: Opt-in details as submitted, keyed by channel (for example `web`). Omitted when not set.
          additionalProperties: true
        lowVolume:
          type: boolean
          description: Whether the campaign is declared low volume. Always present; `false` unless you set it.
        ageGated:
          type: boolean
          description: Whether the content is restricted to adults. Always present; `false` unless you set it.
        directLending:
          type: boolean
          description: Whether the content relates to direct lending. Always present; `false` unless you set it.
        embeddedLink:
          type: boolean
          description: Whether messages contain URLs. Always present; `false` unless you set it.
        embeddedPhone:
          type: boolean
          description: Whether messages contain phone numbers. Always present; `false` unless you set it.
        numbers:
          type: array
          description: Numbers recorded on the campaign on your account. 10DLC campaigns store digits with country code (for
            example `14155550100`); toll-free campaigns store E.164 with a leading `+`. For the registry's own list use `GET
            /10dlc/campaigns/{id}/numbers`.
          items:
            type: string
          example:
          - '14155550100'
        rejectionReasons:
          type: object
          description: The registry's review feedback after a rejection, with keys such as `rejectionDate`, `rejectionReasons`
            and `rejectionDetails` (each detail has `errorCode`, `description`, `recommendedAction` and `rejectionCategory`).
            Omitted when the campaign has no feedback; address every point before you appeal.
          additionalProperties: true
        lastSyncedAt:
          type: string
          format: date-time
          description: When Vobiz last refreshed this record from the US 10DLC registry, in ISO 8601 (RFC 3339) UTC. Omitted
            until the first refresh.
          example: '2026-10-14T17:19:03Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-06T14:28:25Z'
          description: When the record was created on your account, in ISO 8601 (RFC 3339) UTC.
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-14T17:19:03Z'
          description: When the record last changed on your account, in ISO 8601 (RFC 3339) UTC.
    CampaignRegisterRequest:
      type: object
      properties:
        priorityId:
          type: string
          format: uuid
          description: 'ID (UUID) of a priority option from `GET /10dlc/campaigns/priorities`, for toll-free campaigns. A
            value that is not a UUID returns `400` with `invalid request: priorityId must be a UUID`.'
          example: 2c9e4b7a-1d3f-4a5b-8c6d-0e9f8a7b6c5d
      description: Optional body of a campaign registration. Send no body, or `{}`, for a 10DLC campaign.
    CampaignAppealRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          description: Required. Explains why the campaign should be reconsidered and what you changed; address every point
            in the campaign's `rejectionReasons`.
          example: Updated the program summary and opt-in call to action to match the brand's registered details.
      description: Body of an appeal against a campaign rejection.
    CampaignNumbersRequest:
      type: object
      description: 'Numbers to add to, remove from or re-register on a campaign. Provide `numbers`, `numberKeys`, or both;
        if both are empty the request returns `400` with `invalid request: numbers or numberKeys is required`.'
      properties:
        numbers:
          type: array
          description: Phone numbers on your account, as digits with country code and no `+` (for example `14155550100`).
            These values also update the campaign's `numbers` list on add and remove.
          items:
            type: string
          example:
          - '14155550100'
          - '14155550101'
        numberKeys:
          type: array
          description: Registry number keys from `GET /10dlc/campaigns/{id}/numbers`, as an alternative to `numbers`.
          items:
            type: string
    PriorityOption:
      type: object
      description: A priority option available to your account at the US 10DLC registry. Pass its `id` as `priorityId` when
        you create or register a toll-free campaign; other keys follow the registry's schema.
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
          example: 2c9e4b7a-1d3f-4a5b-8c6d-0e9f8a7b6c5d
          description: ID (UUID) of the priority option. Pass it as `priorityId`.
    Document:
      type: object
      description: A supporting document or MMS sample file uploaded for campaign registration.
      properties:
        id:
          type: string
          format: uuid
          description: Record ID (UUID) of the upload on your account. Downloads and campaign references use `documentId`,
            not this value.
          example: 3d2c1b0a-9e8f-4d7c-b6a5-4f3e2d1c0b9a
        accountId:
          type: string
          example: MA_XXXXXXXX
          description: Your Vobiz account ID (`MA_...`). Always the account whose credentials made the request.
        provider:
          type: string
          description: Internal routing identifier; do not rely on its value.
        documentId:
          type: string
          format: uuid
          description: The registry's document ID (UUID). Use it in `GET /10dlc/documents/{id}` and in a campaign's `supportingDocuments`
            or `mmsSampleFiles`.
          example: 7e6d5c4b-3a2f-4e1d-9c8b-7a6f5e4d3c2b
        documentName:
          type: string
          example: opt-in-screenshot.png
          description: Original filename of the upload. Omitted when not recorded.
        contentType:
          type: string
          example: image/png
          description: Media type of the file, for example `application/pdf` or `image/png`. Omitted when not recorded.
        contentLength:
          type: integer
          format: int64
          description: Size of the file in bytes.
          example: 48213
        createdAt:
          type: string
          format: date-time
          example: '2026-10-12T10:30:00Z'
          description: When the record was created on your account, in ISO 8601 (RFC 3339) UTC.
    CampaignNetworkStatus:
      type: object
      description: The campaign's status on one US carrier network, read live from the US 10DLC registry.
      properties:
        network:
          type: string
          description: Carrier network the entry describes, for example `T_MOBILE`, `ATT` or `VERIZON`.
          example: T_MOBILE
        state:
          type: string
          description: The campaign's registration state on that network, for example `ACTIVE` once provisioned.
          example: ACTIVE
        messageClass:
          type: string
          description: Message class the network assigned to the campaign. `null` when the network does not report one.
          example: T
          nullable: true
        throughput:
          type: integer
          description: Throughput the network grants the campaign. The unit depends on the network (messages per minute on
            some, a daily cap on others). `null` when the network does not report one.
          example: 75
          nullable: true
        brandTier:
          type: string
          description: Brand tier the network applies, for example `LOW`. `null` when the network does not use tiers.
          example: LOW
          nullable: true
    CampaignNumberPreview:
      type: object
      properties:
        numberKey:
          type: string
          description: Registry key for the number. Pass it in `numberKeys` on campaign number requests.
          example: 6f5e4d3c2b1a4c9d8e7f0a1b2c3d4e5f
        number:
          type: string
          description: The number, as digits with country code and no `+` (for example `14155550100`).
          example: '14155550100'
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 country code of the number, for example `US`.
      description: One number attached to a campaign at the US 10DLC registry.
    CampaignNumberList:
      type: object
      properties:
        numberPreviews:
          type: array
          items:
            $ref: '#/components/schemas/CampaignNumberPreview'
          description: One entry per attached number. Empty when no numbers are attached.
      description: Numbers the US 10DLC registry associates with a campaign.
    BrandVetPaging:
      type: object
      properties:
        page:
          type: integer
          description: Zero-based index of this page, echoing the `page` you requested.
        size:
          type: integer
          description: Page size applied to the request; `20` when you omit `size` or send `0`.
        totalPages:
          type: integer
          description: Total number of pages at this `size`.
        totalResults:
          type: integer
          description: Total number of vetting records for the brand.
      description: Paging details for a list of brand vets.
    BrandVetList:
      type: object
      properties:
        results:
          type: array
          description: Vetting records on this page, passed through from the registry as received. Empty when the brand has
            never been vetted.
          items:
            $ref: '#/components/schemas/RegistryRecord'
        paging:
          allOf:
          - $ref: '#/components/schemas/BrandVetPaging'
          description: Where this page sits in the full result set.
      description: One page of the brand's vetting records from the US 10DLC registry.
paths:
  /messages:
    post:
      tags:
      - Messages
      summary: Send a message
      description: |-
        Sends an SMS, MMS or RCS message from one of your numbers or RCS senders to one or more recipients. Each number in `to` becomes its own message, with its own `id`, status and conversation, and the response body is the first recipient's message. Every recipient is checked against your opt-out list first, and a send with a future `scheduledAt` is stored with status `scheduled`.

        - `201` when every recipient was accepted, including an idempotent replay and a successful SMS fallback.
        - `202` when at least one recipient was recorded and at least one errored. Find the other recipients with `GET /messages` filtered by `tag` or `to`.
        - `422` when the recipient has opted out and nothing was recorded.
        - `502` when the send was rejected before a message was recorded. Retry with the same `idempotencyKey`.

        Track delivery with `GET /messages/{id}`, your webhooks (callbacks) or the WebSocket.
      operationId: send-message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              sms:
                summary: SMS with idempotency key
                value:
                  from: '+14155550100'
                  to:
                  - '+14155550123'
                  channel: sms
                  text: Your verification code is 482913
                  idempotencyKey: otp-482913-user-77
              mms:
                summary: MMS with media
                value:
                  from: '+14155550100'
                  to:
                  - '+14155550123'
                  channel: mms
                  title: Your invoice
                  text: Here is your invoice.
                  mediaUrls:
                  - https://example.com/invoice.pdf
              rcs:
                summary: RCS with buttons and SMS fallback
                value:
                  from: YOUR_RCS_SENDER_NAME
                  to:
                  - '+14155550123'
                  channel: rcs
                  text: Your appointment is confirmed for 3pm tomorrow.
                  rcsSuggestions:
                  - type: REPLY
                    text: Reschedule
                    postbackData: reschedule
                  - type: DIAL_PHONE
                    text: Call us
                    postbackData: call
                    phoneNumber: '+14155550100'
                  failoverToSms: true
                  idempotencyKey: appt-8812-confirm
              india:
                summary: SMS to India with DLT IDs
                value:
                  from: '+919876543210'
                  to:
                  - '+919876500001'
                  channel: sms
                  text: Your OTP is 4821.
                  dltEntityId: '1001234567890123456'
                  dltHeaderId: '1001234567'
                  dltTemplateId: '10012345678901234567'
      responses:
        '201':
          description: Sent or scheduled for every recipient. Body is the first recipient's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 9b2e1c40-8a3d-4f5e-9c1a-7d6b2e8f4a01
                accountId: MA_XXXXXXXX
                direction: out
                channel: sms
                from: '+14155550100'
                to: '+14155550123'
                text: Your verification code is 482913
                mediaUrls: null
                status: sent
                tag: otp
                conversationId: c7d1e9a3-2b4f-4a6c-8d5e-1f3a9b7c2e04
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:30:00Z'
        '202':
          description: Several recipients and at least one failed. Body is the first recipient's message; check each recipient
            individually.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid body, bad `scheduledAt`, or an MMS validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                body:
                  value:
                    error: invalid request body
                mms:
                  value:
                    error: 'invalid mms: mediaUrls[0] must use https'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The recipient has opted out. Nothing was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'recipient has opted out: +14155550123'
        '502':
          description: The network rejected the send and nothing was recorded. Retry with the same `idempotencyKey`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'routing failed: no provider available for channel=sms from=+14155550100 to=+14155550123'
