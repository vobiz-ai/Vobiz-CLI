          type: string
          format: uuid
        example: 8e6c4a2f-0d9b-4b7a-a5c3-1e9f7d5b3a10
      responses:
        '202':
          description: The request was accepted. Track progress with `GET /10dlc/brands/{id}/registrar-statuses`.
