  /numbers/purchase:
    post:
      tags:
      - Numbers
      summary: Purchase a number
      description: 'Buys a number returned by `GET /numbers/available` and routes it to your account for messaging. This call
        spends money: it debits the setup fee and the first month''s rental from your wallet before the number is bought,
        and the rental renews monthly until you release the number. If the purchase cannot complete after the debit, your
        wallet is refunded and the error message says so. Run it only with your own credentials once you have confirmed the
        number and price. A `numbers.updated` WebSocket event is published when the number goes live; a US number then needs
        a 10DLC campaign or toll-free verification before it can send to US recipients.'
      operationId: purchase-number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseNumberRequest'
            examples:
              us:
                summary: US number
                value:
                  e164: '+14155550100'
                  country: US
              keyed:
                summary: Number with an inventory key
                value:
                  e164: '+442079460100'
                  country: GB
                  numberKey: YOUR_NUMBER_KEY
      responses:
        '201':
          description: The number is bought, charged and routed to your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseNumberResponse'
              example:
                purchase:
                  id: 5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
                  accountId: MA_XXXXXXXX
                  provider: internal
                  e164: '+14155550100'
                  countryCode: US
                  type: VIRTUAL_LONG_NUMBER
                  capabilities:
                  - VOICE
                  - SMS
                  - MMS
                  setupAmount: 1
                  monthlyAmount: 1
                  currency: USD
                  status: purchased
                  purchasedAt: '2026-10-12T09:06:44Z'
                  nextBillingAt: '2026-11-12T09:06:44Z'
                  releasedAt: null
                  createdAt: '2026-10-12T09:06:42Z'
                  updatedAt: '2026-10-12T09:06:44Z'
                  charges:
                  - purchaseId: 5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
                    kind: purchase
                    periodStart: '2026-10-12T09:06:42Z'
                    amount: 2
                    currency: USD
                    status: paid
                    reference: sms_number_purchase:5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
                    attempts: 1
                    attemptedAt: '2026-10-12T09:06:42Z'
                number:
                  id: 1042
                  e164: '+14155550100'
                  provider: internal
                  channelCapabilities:
                  - sms
                  - mms
                  accountId: MA_XXXXXXXX
                  countryCode: US
                  createdAt: '2026-10-12T09:06:44Z'
        '400':
          description: The body is invalid or the number does not match the country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                e164:
                  value:
                    error: e164 must be a number in E.164 format
                country-missing:
                  value:
                    error: country is required
                country-format:
                  value:
                    error: country must be an ISO 3166-1 alpha-2 code
                mismatch:
                  value:
                    error: number does not belong to the given country
                body:
                  value:
                    error: invalid request body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Your wallet balance does not cover the setup fee plus the first month. Top up and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient balance
        '409':
          description: The number is already yours, is taken, or a purchase of it is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                own:
                  value:
                    error: you already have this number
                taken:
                  value:
                    error: number is not available
                gone:
                  value:
                    error: number is no longer available
                in-progress:
                  value:
                    error: a purchase of this number is already in progress
        '422':
          description: The number cannot be sold to your account as requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                india:
                  value:
                    error: India uses DLT sender IDs, not long codes
                country:
                  value:
                    error: SMS numbers are not sold for country FR
                documents:
                  value:
                    error: this country needs regulatory documents; contact support
                capability:
                  value:
                    error: number is not SMS-capable
        '502':
          description: The upstream inventory could not complete the purchase. The error says whether your wallet was refunded
            automatically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                refunded:
                  value:
                    error: number provider could not complete the purchase; your wallet has been refunded
                refund-pending:
                  value:
                    error: 'number provider: number already assigned; your refund is being processed by support'
                unavailable:
                  value:
                    error: number provider unavailable; try again later
        '503':
          description: Purchasing or billing is paused. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                purchasing:
                  value:
                    error: number purchasing is not available
                billing:
                  value:
                    error: billing is unavailable; try again later
