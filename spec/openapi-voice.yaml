  # Note: there is no separate /numbers/search endpoint. To search available
  # numbers to rent, use GET /inventory/numbers with country / search / type
  # query params (documented above on list-inventory-numbers).

  /api/v1/Account/{auth_id}/numbers/{e164}:
    delete:
      operationId: unrent-number
      summary: Release a number
      description: |
        Release a phone number from your account. Releasing a number incurs the
        number-release fee configured for the account; the response returns the
        charged amount in `release_fee`. By default, the number enters
        `pending_release` for a 24-hour cooldown. Cancelling during that window
        refunds the release fee. Set `immediate=true` to skip the cooldown; an
        immediate release cannot be cancelled.
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: e164
          in: path
          required: true
          description: The URL-encoded phone number in E.164 format. Encode `+` as `%2B`.
          schema:
            type: string
            example: "%2B919876543210"
        - name: immediate
          in: query
          required: false
          description: Skip the 24-hour cooldown and release the number immediately.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Release initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancel_url:
                    type: string
                  cooldown_ends_at:
                    type: string
                    format: date-time
                  message:
                    type: string
                  note:
                    type: string
                  release_fee:
                    type: number
                    description: The account-specific fee charged for releasing the number.
                  status:
                    type: string
                required: [ cancel_url, cooldown_ends_at, message, release_fee, status ]
              example:
                cancel_url: /api/v1/account/MA_XXXXXX/numbers/+919876543210/cancel-release
                cooldown_ends_at: "2026-07-21T09:18:26.785758533Z"
                message: number release initiated
                note: Number will be in pending_release for 24 hours (cancellable), then quarantined for 45 days before becoming available.
                release_fee: 700
                status: pending_release

  /api/v1/account/{account_id}/numbers/{e164}/cancel-release:
    post:
      operationId: cancel-number-release
      summary: Cancel a number release
      description: |
        Cancel a pending number release during the 24-hour cooldown. The number is
        restored to `active`, the cooldown timer is cleared, and the release fee is
        refunded in full to the account balance. Any trunk or voice application
        detached by the release is not re-attached automatically.
      tags: [ Phone Numbers ]
      security:
        - AuthID: []
          AuthToken: []
      parameters:
        - name: account_id
          in: path
          required: true
          description: Your account Auth ID.
          schema:
            type: string
            example: MA_XXXXXX
        - name: e164
          in: path
          required: true
          description: The URL-encoded phone number in E.164 format. Encode `+` as `%2B`.
          schema:
            type: string
            example: "%2B919876543210"
      responses:
        "200":
          description: Release cancelled and number restored to active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
                    enum: [ active ]
                  currency:
                    type: string
                  refund_amount:
                    type: number
                  refund_status:
                    type: string
                    enum: [ success, failed ]
                  refund_error:
                    type: string
                    description: Present when the refund could not be processed.
                required: [ message, status ]
              examples:
                refunded:
                  summary: Number restored and fee refunded
                  value:
                    message: release cancelled, number restored to active status
                    status: active
                    currency: INR
                    refund_amount: 700
                refundFailed:
                  summary: Number restored but refund failed
                  value:
                    message: release cancelled, number restored to active status
                    status: active
                    refund_status: failed
                    refund_error: could not process refund, please contact support
        "400":
          description: The number is not pending release
          content:
            application/json:
              example:
                error: number is not pending release
        "401":
          description: Authentication failed
          content:
            application/json:
              example:
                error:
                  code: 401
                  message: Invalid token
        "403":
          description: The number does not belong to this account
          content:
            application/json:
              example:
                error: access denied
        "404":
          description: Number not found
          content:
            application/json:
              example:
                error: number not found

