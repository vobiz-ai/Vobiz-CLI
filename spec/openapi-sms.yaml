  /10dlc/brands/{id}/vet:
    post:
      tags:
      - 10DLC Brands
      summary: Vet a brand
      description: Requests an external vet of a registered brand from the US 10DLC registry. A successful vet can raise the
        brand's trust tier and, with it, the throughput carriers grant its campaigns. `type` defaults to `STANDARD`; any value
        other than `STANDARD`, `ENHANCED` or `POLITICAL` returns `400`. Every call files a new vetting request, so send it
        only when you intend to. The response is the registry's vetting record, returned as received; list past vets with
        `GET /10dlc/brands/{id}/vets`.
      operationId: vet-brand
      parameters:
      - name: id
        in: path
        required: true
        description: Brand ID (UUID) returned by `POST /10dlc/brands`. An unknown ID, an ID from another account, or a value
          that is not a UUID returns `404` with `{"error":"brand not found"}`.
        schema:
          type: string
          format: uuid
        example: 8e6c4a2f-0d9b-4b7a-a5c3-1e9f7d5b3a10
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandVetRequest'
            example:
              type: STANDARD
      responses:
        '200':
          description: The registry's vetting record. Keys follow the registry's schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryRecord'
              example:
                vettingId: 4b3a2c1d-0e9f-4a8b-9c7d-6e5f4a3b2c1d
                vettingClass: STANDARD
                vettingStatus: PENDING
                createDate: '2026-10-12T11:10:00Z'
        '400':
          description: '`type` is not one of the accepted values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'invalid request: type must be one of STANDARD, ENHANCED, POLITICAL'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The brand does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: brand not found
        '422':
          description: The US 10DLC registry declined the vet. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: brand must be registered before vetting'
                providerError: 'registration error 403 (HTTP 403): brand must be registered'
        '502':
          description: The US 10DLC registry did not answer. Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '500':
          $ref: '#/components/responses/ServerError'
