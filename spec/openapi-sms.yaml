  /opt-outs:
    post:
      tags:
      - Opt-outs
      summary: Create an opt-out
      description: Adds a phone number to your opt-out list for one channel, so Vobiz stops messages to it. After this, `POST
        /messages` to that number on that channel returns `422` and broadcasts skip it. An `sms` opt-out also blocks `mms`.
        Use it to record consent withdrawn outside a keyword reply, for example on a call or a web form. Creating the same
        number and channel again updates the stored `reason` instead of adding a second record.
      operationId: create-opt-out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptOutRequest'
            example:
              phoneNumber: '+14155550123'
              channel: sms
              reason: customer request
      responses:
        '201':
          description: The opt-out is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
              example:
                status: ok
        '400':
          description: '`phoneNumber` is missing or the body is not valid JSON.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    error: phoneNumber is required
                body:
