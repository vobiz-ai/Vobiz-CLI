  /senders:
    post:
      tags:
      - RCS Senders
      summary: Create an RCS sender
      description: 'Registers a new RCS sender (agent) with the RCS platform and stores it on your account with status `pending`.
        `provider` and `senderName` are required; the profile fields are reviewed by the RCS platform and the carriers before
        the sender can reach real users. Poll `GET /senders/{id}/status` until the platform reports it as launched, then send
        with its `senderName` as `from` and `channel: rcs` on `POST /messages`. A rejected request returns `400` with the
        platform''s reason in `error`.'
      operationId: create-sender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSenderRequest'
            example:
              provider: YOUR_ROUTING_IDENTIFIER
              senderName: example-brand
              displayName: Example Brand
              description: Order updates and support for Example Brand customers.
              billingCategory: CONVERSATIONAL
              useCase: TRANSACTIONAL
              hostingRegion: NORTH_AMERICA
              brand:
                brandName: Example Brand
              color: '#1A73E8'
              phones:
              - phoneNumber: '+14155550100'
                label: Support
              emails:
              - address: support@example.com
                label: Support
              websites:
              - url: https://example.com
                label: Website
              bannerUrl: https://example.com/rcs/banner.jpg
              logoUrl: https://example.com/rcs/logo.png
              privacy:
                url: https://example.com/privacy
                label: Privacy policy
              termsOfService:
                url: https://example.com/terms
                label: Terms of service
      responses:
        '201':
          description: The new sender in status `pending`.
