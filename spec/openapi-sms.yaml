    put:
      tags:
      - Broadcasts
      summary: Update a broadcast
      description: Changes a `draft` broadcast. Send only the fields you want to change; fields you leave out, or send as
        `null`, keep their value, except `scheduledAt`, where `null` or `""` clears a scheduled start. The same validation
        as create applies, so `name` and `from` cannot be set to an empty string. A broadcast in any other status returns
        `409` with `cannot edit a broadcast that is <status>`.
      operationId: update-broadcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastUpdateInput'
            examples:
              template:
                summary: Change the template
                value:
                  template: Hi {{name}}, your refund of {{amount}} has been issued.
              clearSchedule:
                summary: Clear a scheduled start
                value:
                  scheduledAt: null
      responses:
        '200':
          description: The updated broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
              example:
                id: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
                accountId: MA_XXXXXXXX
                name: October pricing update
                from: '+14155550100'
                channel: sms
                template: Hi {{name}}, your refund of {{amount}} has been issued.
                status: draft
                scheduledAt: null
                ratePerSecond: 5
                tag: pricing-oct
                dltEntityId: ''
                dltHeaderId: ''
                dltTemplateId: ''
                columns:
                - phone
                - name
                - amount
                stats:
                  total: 3
                  pending: 3
                  sent: 0
                  delivered: 0
                  failed: 0
                  optedOut: 0
                  skipped: 0
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:42:00Z'
                startedAt: null
                completedAt: null
