  /senders/{senderId}/templates/{templateName}/status:
    get:
      tags:
      - RCS Senders
      summary: Refresh template status
      description: Asks the RCS platform for the template's current approval status, stores it on the template and returns
        the full template. Poll it after `POST /senders/{senderId}/templates` until the template is approved. Every failure,
        including an unknown sender or template, returns `400`.
      operationId: get-template-status
      parameters:
      - name: senderId
        in: path
        required: true
        description: The `id` (UUID) of the RCS sender that owns the templates. An unknown sender returns `sender not found`.
        schema:
          type: string
          format: uuid
        example: 5d7f9b1c-3e5a-4c7e-9f1b-3d5f7a9c1e3b
      - name: templateName
        in: path
        required: true
        description: The template's `templateName`, exactly as you set it when you created the template on this sender.
        schema:
          type: string
        example: appointment_reminder
      responses:
        '200':
          description: The template with its refreshed `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
              example:
                id: c2e4a6b8-1d3f-4a5c-9e7b-6f8d0a2c4e61
                senderId: 7a1c3e5f-9b2d-4c6e-8f0a-1b3d5e7f9a21
                accountId: MA_XXXXXXXX
                provider: YOUR_ROUTING_IDENTIFIER
                templateName: order-shipped
                type: TEXT
                status: pending
                content:
                  text: Your order {{orderId}} has shipped and arrives on {{eta}}.
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T12:30:00Z'
        '400':
          description: The sender or template does not exist on your account, or the RCS platform did not return a status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sender:
                  value:
                    error: sender not found
                template:
                  value:
                    error: template not found
                platform:
                  value:
                    error: 'provider get template status failed: <description>'
        '401':
          $ref: '#/components/responses/Unauthorized'
