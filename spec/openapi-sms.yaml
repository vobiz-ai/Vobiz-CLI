  /10dlc/documents:
    post:
      tags:
      - 10DLC Campaigns
      summary: Upload a document
      description: Uploads a supporting document or MMS sample file for campaign registration and stores it at the US 10DLC
        registry. Send `multipart/form-data` with the file in a part named `document` that carries a filename; the file can
        be up to 10 MB (`413` above that). The response is the document record; reference its `documentId` in a campaign's
        `supportingDocuments` or `mmsSampleFiles`, and use the same value to download it again.
      operationId: upload-document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - document
              properties:
                document:
                  type: string
                  format: binary
                  description: The file to upload, as the `document` part of a `multipart/form-data` body. The part must include
                    a filename; a missing part returns `400` with `multipart field "document" is required`. Maximum 10 MB.
            encoding:
              document:
                contentType: application/octet-stream, image/*, application/pdf
      responses:
        '201':
          description: The document was stored at the registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: 3d2c1b0a-9e8f-4d7c-b6a5-4f3e2d1c0b9a
                accountId: MA_XXXXXXXX
                provider: primary
                documentId: 7e6d5c4b-3a2f-4e1d-9c8b-7a6f5e4d3c2b
                documentName: opt-in-screenshot.png
                contentType: image/png
                contentLength: 48213
                createdAt: '2026-10-12T10:30:00Z'
        '400':
          description: The `document` part is missing, unreadable, or has no filename.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    error: multipart field "document" is required
                filename:
                  value:
                    error: 'invalid request: document filename is required'
                unreadable:
                  value:
                    error: cannot read document
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The file is larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: document exceeds 10MB
        '422':
          description: The US 10DLC registry declined the file. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
