  /api/v1/Account/{auth_id}/concurrency:
    get:
      operationId: get-concurrency
      summary: Get concurrency limits
      description: Retrieve the current concurrent call usage and configured limits.
      tags: [ Account ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      responses:
        "200":
          description: Concurrency info
          content:
            application/json:
              example:
                account_id: MA_XXXXXXXX
                concurrent_calls: 0
                max_concurrent: 46
                utilization_pct: 0
                request_id: aabbccdd1234567890abcdef12345678
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  concurrent_calls:
                    type: integer
                  max_concurrent:
                    type: integer
                  utilization_pct:
                    type: integer
                  request_id:
                    type: string
                required:
                  - account_id
                  - concurrent_calls
                  - max_concurrent
                  - utilization_pct
                  - request_id

  /api/v1/accounts/{auth_id}/channel-pricing-preview:
    get:
      operationId: preview-channel-pricing
      summary: Preview CPS or concurrency pricing
      description: Calculate the monthly price for CPS or concurrent-call capacity without purchasing capacity or debiting the account.
      tags: [ Account ]
      security:
        - BearerAuth: []
        - AuthID: []
          AuthToken: []
      parameters:
        - name: auth_id
          in: path
          required: true
          description: Target account Auth ID. An account can preview only its own pricing; administrators may act for another account.
          schema:
            type: string
            example: MA_XXXX
        - name: resource_type
          in: query
          required: true
          description: Capacity type to price.
          schema:
            $ref: "#/components/schemas/CapacityResourceType"
        - name: quantity
          in: query
          required: true
          description: Capacity quantity to price. Pricing-tier block and quantity rules also apply.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            example: 30
      responses:
        "200":
          description: Calculated monthly capacity price. No balance is debited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPricingPreview"
              example:
                resource_type: concurrent_calls
                quantity: 30
                monthly_cost: "10470.00"
                currency: INR
                breakdown: []
        "400":
          description: Invalid resource type or quantity, pricing-tier rules were not met, or no pricing tier is assigned.
        "401":
          description: Missing or invalid authentication.
        "403":
          description: The authenticated account cannot act on the target account.

  /api/v1/accounts/{auth_id}/channel-subscriptions:
    post:
      operationId: create-channel-subscription
      summary: Purchase CPS or concurrency capacity
      description: Purchase recurring CPS or concurrent-call capacity. A successful request immediately debits the first monthly charge and activates a subscription that renews every 30 days.
      tags: [ Account ]
      security:
        - BearerAuth: []
        - AuthID: []
          AuthToken: []
      parameters:
        - name: auth_id
          in: path
          required: true
          description: Target account Auth ID. An account can purchase only for itself; administrators may act for another account.
          schema:
            type: string
            example: MA_XXXX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelSubscriptionRequest"
            example:
              resource_type: concurrent_calls
              quantity: 30
      responses:
        "201":
          description: Capacity subscription purchased and activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSubscription"
              example:
                id: 5ed57f90-b1f1-4c32-9475-b85aa6739aec
                account_id: 123456
                resource_type: concurrent_calls
                quantity: 30
                monthly_cost: "10470.00"
                currency: INR
                status: active
                last_billing_date: "2026-07-16T10:00:00Z"
                next_billing_date: "2026-08-15T10:00:00Z"
                purchased_at: "2026-07-16T10:00:00Z"
                cancelled_at: null
                cancellation_reason: null
                is_active: true
                created_at: "2026-07-16T10:00:00Z"
                updated_at: "2026-07-16T10:00:00Z"
        "400":
          description: The purchase could not be completed because validation, pricing-tier, or account-balance requirements were not met.
        "401":
          description: Missing or invalid authentication.
        "403":
          description: The authenticated account cannot act on the target account.

  # ─── Balance ───────────────────────────────────────────────
  /api/v1/Account/{auth_id}/balance/{currency}:
    get:
      operationId: get-balance
      summary: Get balance
      description: Retrieve the current account balance for a specific currency.
      tags: [ Balance ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: currency
          in: path
          required: true
          description: Currency code (e.g. INR, USD)
          schema:
            type: string
            example: INR
      responses:
        "200":
          description: Account balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  account_id:
                    type: string
                  currency:
                    type: string
                  balance:
                    type: number
                  reserved_funds:
                    type: integer
                  promotional_balance:
                    type: integer
                  promotional_reserved_balance:
                    type: integer
                  available_balance:
                    type: number
                  credit_limit:
                    type: integer
                  is_postpaid:
                    type: boolean
                  credit_limit_type:
                    type: string
                  low_balance_threshold:
                    type: integer
                  status:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                  - id
                  - account_id
                  - currency
                  - balance
                  - reserved_funds
                  - promotional_balance
                  - promotional_reserved_balance
                  - available_balance
                  - credit_limit
                  - is_postpaid
                  - credit_limit_type
                  - low_balance_threshold
                  - status
                  - created_at
                  - updated_at
              example:
                id: aabbccdd-1234-5678-90ab-cdef12345678
                account_id: MA_XXXXXXXX
                currency: INR
                balance: 23906.83
                reserved_funds: 0
                promotional_balance: 0
                promotional_reserved_balance: 0
                available_balance: 23906.83
                credit_limit: 1000
                is_postpaid: true
                credit_limit_type: soft
                low_balance_threshold: 50
                status: active
                created_at: "2026-01-19T18:39:15.050543Z"
                updated_at: "2026-05-11T06:59:32.802705Z"

  /api/v1/Account/{auth_id}/transactions:
    get:
      operationId: list-transactions
      summary: List transactions
      description: |
        Retrieve paginated transaction history for the account, ordered by
        `created_at` descending. Filter to a single day by setting `from_date`
        and `to_date` to the same date - a bare `YYYY-MM-DD` in `to_date` is
        expanded to `23:59:59`, so both bounds are inclusive. Bare dates resolve
        in the server timezone (UTC); send an explicit offset such as
        `2026-08-28T00:00:00+05:30` to pin a local calendar day.

        `limit` and `offset` are not supported - unknown parameters are silently
        dropped. `total` and `summary` are computed over the whole filtered set
        and ignore pagination, so `per_page=1` returns full-window totals.
      tags: [ Balance ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: page
          in: query
          description: Page number, 1-indexed.
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: >-
            Records per page. A value above the maximum falls back to the
            default of 50 rather than clamping.
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: from_date
          in: query
          description: >-
            Start of the window, inclusive. Date-only or full ISO 8601
            timestamp. Day boundaries are UTC.
          schema:
            type: string
            example: "2026-08-25"
        - name: to_date
          in: query
          description: >-
            End of the window, inclusive. A date-only value covers the whole
            day.
          schema:
            type: string
            example: "2026-08-25"
        - name: type
          in: query
          description: >-
            `credit` or `debit` act as broad classifications and sweep in legacy
            entry types such as `did_rental`; any other value is an exact match
            on `transactions[].type`.
          schema:
            type: string
            example: debit
        - name: status
          in: query
          description: Exact match on transaction status.
          schema:
            type: string
            enum: [ completed, pending, failed, cancelled ]
        - name: currency
          in: query
          description: Currency code. Uppercased server-side, exact match.
          schema:
            type: string
            example: INR
        - name: reference_type
          in: query
          description: Spend source, matching `transactions[].reference_type`.
          schema:
            type: string
            example: cdr
        - name: description
          in: query
          description: Case-insensitive substring match on the description.
          schema:
            type: string
        - name: reference
          in: query
          description: Case-insensitive substring match on the reference.
          schema:
            type: string
        - name: transaction_id
          in: query
          description: Fetch a single ledger entry by its UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              example:
                transactions:
                  - id: aabbccdd-1234-5678-90ab-cdef12345678
                    account_id: MA_XXXXXXXX
                    balance_id: 11223344-5566-7788-99aa-bbccddeeff00
                    type: debit
                    amount: 0.08
                    currency: INR
                    description: "Call to 919876543210 (1s)"
                    reference: "cdr:99887766-aabb-ccdd-eeff-001122334455"
                    reference_type: cdr
                    status: completed
                    processed_at: "2026-05-11T06:59:32.806790Z"
                    created_at: "2026-05-11T06:59:32.806790Z"
                    updated_at: "2026-05-11T06:59:32.806790Z"
                summary:
                  total_transactions: 5657
                  total_debit: 138901.97
                  total_credit: 350806
                  net_amount: 211904.03
                  by_reference_type:
                    - reference_type: cdr
                      total_debit: 932.93
                      total_credit: 0
                      count: 1866
                    - reference_type: did_rental
                      total_debit: 18100
                      total_credit: 0
                      count: 44
                    - reference_type: manual_adjustment
                      total_debit: 0
                      total_credit: 2455
                      count: 6
                total: 5657
                page: 1
                per_page: 50
                total_pages: 114
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        account_id:
                          type: string
                        balance_id:
                          type: string
                        type:
                          type: string
                        amount:
                          type: number
                        currency:
                          type: string
                        description:
                          type: string
                        reference:
                          type: string
                        reference_type:
                          type: string
                        status:
                          type: string
                        processed_at:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                        - id
                        - account_id
                        - balance_id
                        - type
                        - amount
                        - currency
                        - description
                        - reference
                        - status
                        - processed_at
                        - created_at
                        - updated_at
                  summary:
                    type: object
                    properties:
                      total_transactions:
                        type: integer
                      total_debit:
                        type: number
                      total_credit:
                        type: integer
                      net_amount:
                        type: number
                      by_reference_type:
                        type: array
                        items:
                          type: object
                          properties:
                            reference_type:
                              type: string
                            total_debit:
                              type: number
                            total_credit:
                              type: integer
                            count:
                              type: integer
                          required:
                            - reference_type
                            - total_debit
                            - total_credit
                            - count
                    required:
                      - total_transactions
                      - total_debit
                      - total_credit
                      - net_amount
                      - by_reference_type
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                required:
                  - transactions
                  - summary
                  - total
                  - page
                  - per_page
                  - total_pages

  /api/v1/Account/{auth_id}/transactions/reference-types:
    get:
      operationId: list-transaction-reference-types
      summary: List transaction reference types
      description: >-
        Returns the distinct `reference_type` values present on the account's
        ledger. Use it to discover valid values for the `reference_type` filter
        on the transactions endpoint.
      tags: [ Balance ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      responses:
        "200":
          description: Reference type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_types:
                    type: array
                    items:
                      type: string
              example:
                reference_types:
                  - cdr
                  - did_purchase
                  - did_rental
                  - manual_adjustment
                  - ncc
                  - recording
                  - stream_cdr
                  - transcription

  # ─── Calls ─────────────────────────────────────────────────
  /api/v1/Account/{auth_id}/Call/:
    get:
      operationId: list-queued-calls
      summary: List queued calls
      description: Retrieve all queued (pending, not yet connected) calls on the account.
      tags: [ Live Calls ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [ live, queued ]
            default: queued
          example: queued
      responses:
        "200":
          description: List of queued call UUIDs
          content:
            application/json:
              example:
                api_id: c9527676-5839-11e1-86da-6ff39efcb949
                calls:
                  - eac94337-b1cd-499b-82d1-b39bca50dc31
                  - 0a70a7fb-168e-4944-a846-4f3f4d2f96f1
              schema:
                type: object
                properties:
                  api_id:
                    type: string
                    description: Unique identifier for this API request
                  calls:
                    type: array
                    description: Array of call UUIDs for all queued calls (max 20)
                    items:
                      type: string
                required:
                  - api_id
                  - calls
    post:
      operationId: make-call
      summary: Make an outbound call
      description: |
        Initiate an outbound call to a PSTN number or SIP endpoint.
        Use `<` to separate multiple destinations (max 1000).
      tags: [ Calls ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                  description: |
                    Destination PSTN number or SIP endpoint. Separate multiple destinations with
                    the `<` character to fan out a single request to up to 1000 destinations,
                    for example `+919876543210<+919876543211`.
                  example: "+919876543210"
                answer_url:
                  type: string
                answer_method:
                  type: string
              required:
                - from
                - to
                - answer_url
                - answer_method
            examples:
              single:
                summary: Call one destination
                value:
                  from: "14155551234"
                  to: "+919876543210"
                  answer_url: https://example.com/answer
                  answer_method: POST
                  time_limit: 3600
              bulk:
