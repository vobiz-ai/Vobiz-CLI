  /10dlc/documents/{id}:
    get:
      tags:
      - 10DLC Campaigns
      summary: Download a document
      description: 'Downloads a document you uploaded with `POST /10dlc/documents`. The response body is the file itself,
        with the file''s own `Content-Type` and a `Content-Disposition: attachment` header that carries the original filename.
        Look the file up by its `documentId`, not by the record `id`.'
      operationId: get-document
      parameters:
      - name: id
        in: path
        required: true
        description: The `documentId` (UUID) returned by `POST /10dlc/documents`, not the record `id`. A value that is not
          a UUID, or a document that is not on your account, returns `404` with `{"error":"document not found"}`.
        schema:
          type: string
          format: uuid
        example: 7b5d3f1a-9e7c-4a5b-8d3f-1b9e7c5a3d26
      responses:
        '200':
          description: The file bytes.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<documentName>"`.'
              schema:
                type: string
              example: attachment; filename="opt-in-screenshot.png"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No document with this `documentId` on your account, or the value is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: document not found
        '502':
          description: The US 10DLC registry did not answer. Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '500':
          $ref: '#/components/responses/ServerError'
