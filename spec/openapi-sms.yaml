      description: Updates the sender's profile on the RCS platform and then on your account, and returns the updated sender.
        Send only the fields you want to change; fields you leave out keep their value. `provider`, `senderName` and `hostingRegion`
        are fixed after creation. Every failure, including an unknown id, returns `400`.
