    put:
      tags:
      - 10DLC Campaigns
      summary: Update a campaign
      description: 'Replaces the editable fields of a 10DLC campaign and pushes the change to the US 10DLC registry. This
        is a full replacement: `name` is required and any field you leave out is cleared. `campaignType` and the brand stay
        as created, and `referenceId` is ignored. The registry accepts updates while the campaign is `DRAFT` or `REJECTED`.
        Toll-free campaigns return `400` on this endpoint.'
      operationId: update-campaign
      parameters:
      - name: id
        in: path
        required: true
        description: Campaign ID (UUID) returned by `POST /10dlc/campaigns` or `POST /10dlc/campaigns/toll-free`. An unknown
          ID, an ID from another account, or a value that is not a UUID returns `404` with `{"error":"campaign not found"}`.
        schema:
          type: string
          format: uuid
        example: 4c2a0e8d-6b4f-4d2c-b0a8-9e7c5a3f1d24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
            example:
              name: Example Corp account alerts
              useCases:
              - ALERTS
              messageTypes:
              - SMS
              programSummary: Example Corp sends account, billing and support alerts to customers who opted in on the sign-up
                form. Reply STOP to opt out, HELP for help.
              confirmationMessage: 'Example Corp: You are subscribed to account alerts. Msg frequency varies. Msg & data rates
                may apply. Reply HELP for help, STOP to opt out.'
              helpMessage: 'Example Corp: For help email support@example.com. Reply STOP to opt out.'
              stopMessage: 'Example Corp: You have been unsubscribed. Reply HELP for help.'
              exampleMessages:
              - 'Example Corp: Your support ticket #48213 was updated. View it at https://example.com/support. Reply STOP
                to opt out.'
              customerCarePhone: '+14155550100'
              customerCareEmail: support@example.com
              termsAndConditionsUrl: https://example.com/terms
              privacyPolicyUrl: https://example.com/privacy
              optIns:
                web:
                  url: https://example.com/signup
                  callToAction: By checking this box you agree to receive account alerts from Example Corp. Msg frequency
                    varies. Msg & data rates may apply. Reply STOP to opt out, HELP for help.
              lowVolume: true
              embeddedLink: true
      responses:
        '200':
          description: The updated campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              example:
                id: 8a7d2f10-3c4b-4e9a-b1d2-6e5f4a3b2c11
                accountId: MA_XXXXXXXX
                brandId: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
                name: Example Corp account alerts
                campaignType: TEN_DIGIT_LONG_CODE
                stage: DRAFT
                programSummary: Example Corp sends account, billing and support alerts to customers who opted in on the sign-up
                  form. Reply STOP to opt out, HELP for help.
                useCases:
                - ALERTS
                messageTypes:
                - SMS
                lowVolume: true
                ageGated: false
                directLending: false
                embeddedLink: true
                embeddedPhone: false
                createdAt: '2026-10-06T14:28:25Z'
                updatedAt: '2026-10-06T15:02:10Z'
        '400':
          description: Invalid body, a missing `name`, or a toll-free campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name:
                  value:
                    error: 'invalid request: name is required'
                tollFree:
                  value:
                    error: 'invalid request: toll-free campaigns cannot be updated through this endpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The campaign does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: campaign not found
        '422':
          description: The US 10DLC registry declined the update, for example because the campaign is under review. `error`
            carries the registry's description.
          content:
            application/json:
              schema:
