    post:
      operationId: create-customer-account
      summary: Create customer account
      description: |
        Creates a new customer sub-account under your partner account. Vobiz
        emails the customer their login credentials and (separately) a KYC link
        via the kyc-sessions endpoint.
      tags: [ Partner API ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, email, phone, password, country ]
              properties:
                name:
                  type: string
                  description: Customer's full name.
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  description: Customer's email. KYC link is sent here.
                  example: "john@example.com"
                phone:
                  type: string
                  description: E.164 format.
                  example: "+919876543210"
                password:
                  type: string
                  description: Min 8 chars, must include a number and a special character.
                  example: "SecurePass123!"
                company:
                  type: string
                  description: Legal company or business name.
                  example: "Acme Corp"
                country:
                  type: string
                  description: ISO 2-letter country code.
                  example: "IN"
      responses:
        "201":
          description: Customer account created
          content:
            application/json:
              example:
                auth_id: "MA_XXXXXXXX"
                auth_token: "your_auth_token_here"
                name: "John Doe"
                email: "john@example.com"
                status: "active"
                balance: 0.00
                currency: "INR"
                country: "IN"
                created_at: "2026-03-25T10:00:00Z"

  /api/v1/partner/accounts/{customer_auth_id}/transfer-balance:
    post:
      operationId: partner-transfer-balance
      summary: Transfer balance to customer
      description: |
        Atomically debits your partner master balance and credits the customer's
        wallet. Both legs are recorded in each account's ledger. Transfers are
        **permanent and cannot be reversed.**
      tags: [ Partner API ]
      parameters:
        - name: customer_auth_id
          in: path
          required: true
          schema:
            type: string
            example: "MA_XXXXXXXX"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ amount, currency ]
              properties:
                amount:
                  type: number
                  description: Positive decimal. Your master balance must be ≥ this amount.
                  example: 500.00
                currency:
                  type: string
                  description: Must match your partner account currency.
                  example: "INR"
                description:
                  type: string
                  description: Note for your records. Appears in both ledgers.
                  example: "April recharge - Credresolve"
      responses:
        "200":
          description: Transfer completed
          content:
            application/json:
              example:
                transaction_id: "txn_aabbccdd1234"
                from_account: "PA_XXXXXXXX"
                to_account: "MA_XXXXXXXX"
                amount: 500.00
                currency: "INR"
                description: "April recharge"
                status: "completed"
                partner_balance_after: 47750.00
                customer_balance_after: 2950.00
                timestamp: "2026-03-25T11:00:00Z"
        "400":
          description: Insufficient partner balance
          content:
            application/json:
              example:
                error: "insufficient_balance"
                message: "Your partner balance (₹200.00) is insufficient for this transfer
                  (₹500.00)."
                current_balance: 200.00
                requested_amount: 500.00
                currency: "INR"

