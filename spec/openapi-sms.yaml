  /messages/cost-preview:
    get:
      tags:
      - Messages
      summary: Preview message cost
      description: Prices a message before you send it, without sending anything. It splits `text` into segments for the chosen
        channel and returns the segment count, the price per segment and the total in your account currency. Use it to show
        a cost estimate in your app or to keep long messages within a budget. The figures are for one recipient; multiply
        `totalCost` by the number of recipients for a multi-recipient send.
      operationId: preview-message-cost
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
        example: '+14155550100'
        description: 'Required. The sender you plan to use: one of your numbers in E.164 format, or the `senderName` of your
          RCS sender when `channel` is `rcs`. It determines the route the message is priced on.'
      - name: to
        in: query
        required: true
        schema:
          type: string
        example: '+14155550123'
        description: Required. One recipient number in E.164 format, for example `+14155550123`. Its destination country determines
          the price.
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - sms
          - mms
          - rcs
          default: sms
        description: 'Channel to price: `sms`, `mms` or `rcs`. Defaults to `sms`.'
      - name: text
        in: query
        description: 'The message body to segment and price, URL-encoded. Pass the exact text you plan to send: the segment
          count depends on its length and on whether it fits the GSM-7 character set. Defaults to an empty string.'
        schema:
          type: string
      responses:
        '200':
          description: Segment count and cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostPreview'
              example:
                channel: sms
                segmentCount: 2
                unitCost: 0.01
                totalCost: 0.02
                currency: USD
        '400':
          description: '`from` and `to` are required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
