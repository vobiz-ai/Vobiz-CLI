  /10dlc/campaigns/{id}/register:
    post:
      tags:
      - 10DLC Campaigns
      summary: Register a campaign
      description: Submits the campaign to the US 10DLC registry for review and returns the refreshed campaign. The `stage`
        moves out of `DRAFT`; poll `GET /10dlc/campaigns/{id}` until it settles at `REGISTERED` or `REJECTED`. The body is
        optional and carries a `priorityId` from `GET /10dlc/campaigns/priorities` for toll-free campaigns; a value that is
        not a UUID returns `400`. Submit only when the campaign details are final and you intend to run this program.
      operationId: register-campaign
      parameters:
      - name: id
        in: path
        required: true
        description: Campaign ID (UUID) returned by `POST /10dlc/campaigns` or `POST /10dlc/campaigns/toll-free`. An unknown
          ID, an ID from another account, or a value that is not a UUID returns `404` with `{"error":"campaign not found"}`.
        schema:
          type: string
          format: uuid
        example: 4c2a0e8d-6b4f-4d2c-b0a8-9e7c5a3f1d24
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRegisterRequest'
            example:
              priorityId: 2c9e4b7a-1d3f-4a5b-8c6d-0e9f8a7b6c5d
      responses:
        '200':
          description: The campaign after submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
              example:
                id: 8a7d2f10-3c4b-4e9a-b1d2-6e5f4a3b2c11
                accountId: MA_XXXXXXXX
                brandId: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
                name: Example Corp account alerts
                campaignType: TEN_DIGIT_LONG_CODE
                stage: IN_REVIEW
                useCases:
                - ALERTS
                messageTypes:
                - SMS
                lowVolume: true
                ageGated: false
                directLending: false
                embeddedLink: true
                embeddedPhone: false
                numbers:
                - '14155550100'
                lastSyncedAt: '2026-10-06T15:10:00Z'
                createdAt: '2026-10-06T14:28:25Z'
                updatedAt: '2026-10-06T15:10:00Z'
        '400':
          description: '`priorityId` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'invalid request: priorityId must be a UUID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The campaign does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: campaign not found
        '422':
          description: The US 10DLC registry rejected the submission. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: brand must be ACTIVE before campaigns can be registered'
                providerError: 'registration error 403 (HTTP 403): brand not active'
        '502':
          description: The US 10DLC registry did not answer. Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '503':
          description: The registry did not accept Vobiz's service credentials. Retry later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider rejected the service credentials
                providerError: 'registration error 401 (HTTP 401): unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
