    get:
      tags:
      - 10DLC Brands
      summary: List brand vets
      description: 'Returns the brand''s vetting records from the US 10DLC registry, one page at a time. The body is `{"results":
        [...], "paging": {...}}`, where each result is a registry vetting record passed through as received. `page` must be
        0 or more and `size` between 0 and 100; other values return `400` with `page must be >= 0 and size between 0 and 100`.'
      operationId: list-brand-vets
      parameters:
      - name: id
        in: path
        required: true
        description: Brand ID (UUID) returned by `POST /10dlc/brands`. An unknown ID, an ID from another account, or a value
          that is not a UUID returns `404` with `{"error":"brand not found"}`.
        schema:
          type: string
          format: uuid
        example: 8e6c4a2f-0d9b-4b7a-a5c3-1e9f7d5b3a10
      - name: page
        in: query
        description: Zero-based page index. Defaults to `0`. Must be 0 or more; a negative value returns `400`. A value that
          is not an integer is treated as `0`.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: Records per page, from 0 to 100. Defaults to `20`; `0` or a value that is not an integer also gives the
          default page size. A value above 100 returns `400`.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 20
