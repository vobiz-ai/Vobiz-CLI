        example: YOUR_RCS_SENDER_NAME
      - name: to
        in: query
        required: true
        schema:
          type: string
        example: '+14155550123'
        description: Required. The recipient number to check, in E.164 format, for example `+14155550123`.
      responses:
        '200':
          description: Reachability result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCSReachability'
