  /10dlc/brands/{id}/brand-auth-verification:
    post:
      tags:
      - 10DLC Brands
      summary: Request brand authentication
      description: 'Starts the registry''s brand authentication for a brand whose `brandType` is `TENDLC_PUBLIC_COMPANY`.
        The registry sends a two-factor verification request to the brand''s `businessContactEmail`, and the brand shows `registrationStatus`
        `PENDING_2FA` until the contact completes it. The request has no body and returns `202` with `{"status":"requested"}`.
        Any other brand type returns `400` with `invalid request: brand authentication is only available for TENDLC_PUBLIC_COMPANY
        brands`.'
