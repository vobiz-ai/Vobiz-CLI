  /api/v1/Account/{auth_id}/numbers/purchase-from-inventory:
    post:
      operationId: purchase-from-inventory
      summary: Purchase from Inventory
      description: |
        Purchase a phone number from inventory and assign it to your account.
        Debits your account balance for the setup fee and monthly fee. For
        sub-accounts (SA_), the parent master account (MA_) is charged.
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ e164 ]
              properties:
                e164:
                  type: string
                  description: Phone number to purchase in E.164 format.
                  example: "+919876543210"
                currency:
                  type: string
                  description: Currency for transaction. Defaults to the number's currency or
                    "USD".
                  example: USD
            example:
              e164: "+919876543210"
              currency: USD
      responses:
        "200":
          description: Number purchased
          content:
            application/json:
              example:
                message: Number purchased successfully
                number:
                  id: aabbccdd-1234-5678-90ab-cdef12345678
                  account_id: MA_XXXXXXXX
                  e164: "+919876543210"
                  country: IN
                  region: Karnataka
                  capabilities:
                    voice: true
                    sms: false
                    mms: false
                    fax: false
                  status: active
                  provider: ""
                  setup_fee: 100
                  monthly_fee: 1.0
                  currency: INR
                  voice_enabled: true
                  tags: []
                  purchased_at: "2026-03-25T10:00:00Z"
                  is_blocked: false
                  created_at: "2026-03-25T10:00:00Z"
                  updated_at: "2026-03-25T10:00:00Z"
                  is_trial_number: false
                  minimum_commitment_months: 0
                  aadhaar_verification_required: false
                  aadhaar_verified: false
                  source: inventory
                items:
                  - id: aabbccdd-1234-5678-90ab-cdef12345678
                    account_id: MA_XXXXXXXX
                    e164: "+919876543210"
                    country: IN
                    region: Karnataka
                    capabilities:
                      voice: true
                      sms: false
                      mms: false
                      fax: false
                    status: active
                    monthly_fee: 1.0
                    currency: INR
        "404":
          description: Number not found in inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to purchase number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/Account/{auth_id}/numbers/{phone_number}/assign:
    post:
      operationId: assign-number-to-trunk
      summary: Assign Number to Trunk
      description: |
        Assign a phone number to a specific SIP trunk. Once assigned, all
        inbound calls to that phone number will be routed through the
        designated trunk. The phone number must be URL-encoded; use `%2B`
        instead of `+` (e.g., `%2B912271264217`).
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: phone_number
          in: path
          required: true
          description: The phone number to assign, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B912271264217"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ trunk_group_id ]
              properties:
                trunk_group_id:
                  type: string
                  format: uuid
                  description: The UUID of the trunk to assign this number to.
                  example: e3e55a78-1234-5678-90ab-cdef12345678
            example:
              trunk_group_id: e3e55a78-1234-5678-90ab-cdef12345678
      responses:
        "204":
          description: Number assigned to trunk
        "400":
          description: Invalid request (e.g., already assigned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: unassign-number-from-trunk
      summary: Unassign Number from Trunk
      description: |
        Remove the assignment between a phone number and a SIP trunk. After
        unassignment, the number remains in your account inventory but will
        no longer route inbound calls through the previously assigned trunk.
        URL-encode the phone number (use `%2B` instead of `+`).
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: phone_number
          in: path
          required: true
          description: The phone number to unassign, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B912271264217"
      responses:
        "204":
          description: Number unassigned
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/Account/{auth_id}/numbers/{e164}/application:
    post:
      operationId: link-number-to-application
      summary: Link Number to Application
      description: |
        Link a phone number to a voice application. Once linked, inbound
        calls to that number fetch VobizXML from the application's
        `answer_url`. A number routes through either an application or a
        SIP trunk, not both: unassign the number from its trunk first
        (`DELETE /api/v1/Account/{auth_id}/numbers/{phone_number}/assign`).
        URL-encode the phone number (use `%2B` instead of `+`).
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: e164
          in: path
          required: true
          description: The phone number, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B912271264217"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ application_id ]
              properties:
                application_id:
                  type: string
                  description: The `app_id` of the application to link this number to.
                  example: "12345678901234567"
            example:
              application_id: "12345678901234567"
      responses:
        "200":
          description: Number linked to application
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Number or application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The number is assigned to a SIP trunk; unassign it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: unlink-number-from-application
      summary: Unlink Number from Application
      description: |
        Remove the link between a phone number and its voice application.
        The number stays in your account inventory but inbound calls no
        longer fetch VobizXML from that application.
        URL-encode the phone number (use `%2B` instead of `+`).
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: e164
          in: path
          required: true
          description: The phone number, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B912271264217"
      responses:
        "200":
          description: Number unlinked from application
        "404":
          description: Number not found or not linked to an application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── DID sub-account assignment & 15-day cool-off ──────────
  # NOTE: this endpoint uses lowercase `account` in the path
  # (/api/v1/account/...), unlike the capital-A `Account` used by the other
  # number endpoints above.
  /api/v1/account/{auth_id}/numbers/{e164}/health:
    get:
      operationId: get-number-health
      summary: Get number health dashboard
      description: |
        Returns the health & analytics dashboard for one of your numbers: current
        status, spam flag, and call metrics over the selected window (total and
        answered calls, answer rate, minutes, average duration) plus a per-period
        time series of snapshots.
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: e164
          in: path
          required: true
          description: The number in E.164, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B919876543210"
        - name: granularity
          in: query
          required: false
          description: Snapshot granularity.
          schema:
            type: string
            enum: [ daily, hourly ]
            default: daily
        - name: days
          in: query
          required: false
          description: Size of the window (in days) for the summary and snapshots.
          schema:
            type: integer
            default: 30
            example: 30
      responses:
        "200":
          description: Number health dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  e164:
                    type: string
                    example: "+919876543210"
                  status:
                    type: string
                    example: active
                  usage_status:
                    type: string
                    description: Reputation/usage rating for the number.
                    example: unrated
                  is_spam:
                    type: boolean
                    example: false
                  granularity:
                    type: string
                    example: daily
                  summary:
                    type: object
                    properties:
                      period_days: { type: integer, example: 30 }
                      total_calls: { type: integer, example: 0 }
                      answered_calls: { type: integer, example: 0 }
                      answer_rate: { type: number, example: 0 }
                      total_minutes: { type: number, example: 0 }
                      avg_duration: { type: number, example: 0 }
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "bd41d44b-7217-4a78-9261-588fb1b41c25" }
                        ts: { type: string, format: date-time, example: "2026-06-04T00:00:00Z" }
                        total_calls: { type: integer, example: 0 }
                        answered_calls: { type: integer, example: 0 }
                        failed_calls: { type: integer, example: 0 }
                        answer_rate: { type: number, example: 0 }
                        total_duration: { type: number, example: 0 }
                        avg_duration: { type: number, example: 0 }
                        total_minutes: { type: number, example: 0 }
        "404":
          description: Number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/account/{auth_id}/numbers/{e164}/assign-subaccount:
    post:
      operationId: assign-did-to-subaccount
      summary: Assign DID to a sub-account
      description: Assign a parent-pool DID to a sub-account.
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: e164
          in: path
          required: true
          description: The number in E.164, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B919876543210"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ sub_account_id ]
              properties:
                sub_account_id:
                  type: string
                  example: SA_XXXXXX
      responses:
        "200":
          description: DID assigned to the sub-account
        "204":
          description: DID assigned to the sub-account
        "404":
          description: Number or sub-account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unassign-did-from-subaccount
      summary: Unassign DID (15-day cool-off enforced)
      description: |
        Move the DID back to the parent pool.

        A **15-day cool-off** is enforced: if the DID had a call within the last
        15 days, the request is rejected with `409` and a
        `did_cool_off_in_effect` error that includes `cool_off_until` and
        `cool_off_remaining_seconds`. Never-used DIDs (`last_call_at` is `NULL`)
        move back immediately.

        Admins can bypass the cool-off with `?force=true` (see below); the
        bypass writes a `did_assignment_audit` row and requires an
        admin-role account.
      tags: [ Phone Numbers ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: e164
          in: path
          required: true
          description: The number in E.164, URL-encoded (use %2B instead of +).
          schema:
            type: string
            example: "%2B919876543210"
        - name: force
          in: query
          required: false
          description: |
            Admin-only cool-off bypass. Requires an admin-role account
            (enforced at the gateway) and writes a `did_assignment_audit` row.
          schema:
            type: boolean
            example: true
      responses:
        "200":
          description: DID moved back to the parent pool
        "204":
          description: DID moved back to the parent pool
        "403":
          description: '`force=true` requested without an admin-role account'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cool-off in effect - the DID had a call within the last 15 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: did_cool_off_in_effect
                cool_off_until: "2026-06-09T10:00:00Z"
                cool_off_remaining_seconds: 1209600

