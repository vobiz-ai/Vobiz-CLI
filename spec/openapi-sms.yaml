      description: 'Asks the US 10DLC registry to update the set of numbers covered by a registered campaign, without deregistering
        it. Provide `numbers`, `numberKeys`, or both; if both are empty the call returns `400` with `invalid request: numbers
        or numberKeys is required`. The response is the campaign; the `numbers` list stored on your account is left as it
        was. Use `POST` and `DELETE /10dlc/campaigns/{id}/numbers` for incremental changes.'
