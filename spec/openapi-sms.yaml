    get:
      tags:
      - Messages
      summary: List messages
      description: Returns the messages on your account, sent and received, newest first. Combine the filters to find a message
        you did not keep the `id` for, such as the other recipients of a multi-recipient send (filter by `tag` or `to`). Every
        filter is an exact match, and filters you omit are not applied. Page through results with `limit` and `offset`, and
        use `total` to know when to stop.
      operationId: list-messages
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - sent
          - delivered
          - failed
          - received
          - unknown
        description: 'Only messages with this status: `scheduled`, `sent`, `delivered`, `failed`, `received` (inbound) or
          `unknown`.'
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - sms
          - mms
          - rcs
        description: 'Only messages sent or received on this channel: `sms`, `mms` or `rcs`. This is the channel actually
          used, so an SMS that was upgraded to MMS appears under `mms`.'
      - name: direction
        in: query
        description: '`out` for messages you sent, `in` for messages your numbers received.'
        schema:
          type: string
          enum:
          - out
          - in
      - name: to
        in: query
        schema:
          type: string
        description: Recipient number to filter on, in E.164 format, exact match. For inbound messages this is your number.
      - name: from
        in: query
        schema:
          type: string
        description: 'Sender to filter on, exact match: one of your numbers in E.164 format (for example `+14155550100`),
          or the `senderName` of your RCS sender for RCS messages. For inbound messages this is the contact''s number.'
      - name: tag
        in: query
        schema:
          type: string
        description: Only messages whose `tag` equals this value, exact match. Set the same `tag` on related sends to retrieve
          them together.
      - name: startDate
        in: query
        description: Only messages created at or after this time, as an RFC 3339 / ISO 8601 timestamp such as `2026-10-01T00:00:00Z`.
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Only messages created before this time, as an RFC 3339 / ISO 8601 timestamp such as `2026-11-01T00:00:00Z`.
          Combine with `startDate` for a date range.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Maximum number of messages to return, from `1` to `100`. Defaults to `20`; a value outside that range
          also returns `20`.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        description: Number of records to skip before the page starts, `0` or greater. Defaults to `0`. Add the page size
          to it to fetch the next page.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      x-codeSamples:
      - lang: typescript
        label: Node SDK
        source: |
          import { VobizClient } from "@vobiz/sdk";

          const client = new VobizClient({ apiKey: "MA_XXXXXXXX", authToken: "YOUR_AUTH_TOKEN" });

          await client.sms.messages.listMessages()
