    delete:
      tags:
      - 10DLC Campaigns
      summary: Delete a campaign
      description: Deletes the campaign from your account and from the US 10DLC registry and returns `204` with no body. The
        registry accepts deletion while the campaign is `DRAFT`, `DEREGISTERED` or `REJECTED`; deregister a registered campaign
        with `POST /10dlc/campaigns/{id}/deregister` first. Delete all of a brand's campaigns before you delete the brand.
      operationId: delete-campaign
      parameters:
      - name: id
        in: path
        required: true
        description: Campaign ID (UUID) returned by `POST /10dlc/campaigns` or `POST /10dlc/campaigns/toll-free`. An unknown
          ID, an ID from another account, or a value that is not a UUID returns `404` with `{"error":"campaign not found"}`.
        schema:
          type: string
          format: uuid
        example: 4c2a0e8d-6b4f-4d2c-b0a8-9e7c5a3f1d24
      responses:
        '204':
          description: The campaign was deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The campaign does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: campaign not found
        '422':
          description: The US 10DLC registry declined the deletion. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: campaign must be deregistered before deletion'
                providerError: 'registration error 403 (HTTP 403): campaign must be deregistered first'
        '502':
          description: The US 10DLC registry did not answer. Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '500':
          $ref: '#/components/responses/ServerError'
