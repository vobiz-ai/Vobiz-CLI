  /numbers/{e164}/release:
    post:
      tags:
      - Numbers
      summary: Release a number
      description: 'Cancels a number you bought through Vobiz and removes it from your account. The number stops sending and
        receiving messages immediately, and monthly rental stops. The setup fee and the current month are not refunded, and
        a released number cannot be restored. The call has no request body and returns the purchase with `status: released`.
        Run it only with your own credentials once you are sure you no longer need the number.'
      operationId: release-number
      parameters:
      - name: e164
        in: path
        required: true
        description: The number to release, in E.164 format, for example `+14155550100`. In raw HTTP requests, URL-encode
          the `+` as `%2B`; the SDKs encode it for you. A value that is not an E.164 number returns `400`, and a number that
          is not on your account returns `404`.
        schema:
          type: string
        example: '+14155550100'
      responses:
        '200':
          description: The number is released. `status` is `released`, `releasedAt` is set and `nextBillingAt` is `null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseNumberResponse'
              example:
                purchase:
                  id: 5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
                  accountId: MA_XXXXXXXX
                  provider: internal
                  e164: '+14155550100'
                  countryCode: US
                  type: VIRTUAL_LONG_NUMBER
                  capabilities:
                  - VOICE
                  - SMS
                  - MMS
                  setupAmount: 1
                  monthlyAmount: 1
                  currency: USD
                  status: released
                  purchasedAt: '2026-10-12T09:06:44Z'
                  nextBillingAt: null
                  releasedAt: '2026-10-20T14:02:10Z'
                  createdAt: '2026-10-12T09:06:42Z'
                  updatedAt: '2026-10-20T14:02:10Z'
                  charges:
                  - purchaseId: 5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
                    kind: purchase
                    periodStart: '2026-10-12T09:06:42Z'
                    amount: 2
                    currency: USD
                    status: paid
                    reference: sms_number_purchase:5c2d9e7a-1b4f-4a8c-9e3d-6f7a0b1c2d3e
                    attempts: 1
                    attemptedAt: '2026-10-12T09:06:42Z'
        '400':
          description: The path value is not an E.164 number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: e164 must be a number in E.164 format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The number is not on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: number not found
        '409':
          description: The number cannot be released through the API right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not-self-serve:
                  value:
                    error: this number was not bought through the console; contact support to release it
                in-progress:
                  value:
                    error: the purchase of this number is still in progress
        '502':
          description: The upstream inventory could not release the number. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: number provider could not release the number; try again later
        '503':
          description: Purchasing is paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: number purchasing is not available
        '500':
          $ref: '#/components/responses/ServerError'
