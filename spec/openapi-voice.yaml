    post:
      operationId: create-subaccount
      summary: Create a sub-account
      description: |
        Create a new sub-account under the master account.

        Set `kyc_mode` to control how the sub-account is verified:

        - `personal_use` *(default)* - the sub-account inherits the parent's
          KYC; no separate verification is required.
        - `customer_use` - the sub-account must complete its own KYC before it
          can place calls. A fresh `customer_use` sub-account is returned with
          `kyc_calls_blocked: true`. `customer_use` **requires** `email`.
      tags: [ Sub-Accounts ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable name for the sub-account.
                email:
                  type: string
                  format: email
                  description: Required when `kyc_mode` is `customer_use`.
                password:
                  type: string
                  description: Login password for the sub-account.
                kyc_mode:
                  type: string
                  enum: [ personal_use, customer_use ]
                  default: personal_use
                  description: |
                    `personal_use` inherits parent KYC. `customer_use` requires
                    the sub-account to complete its own KYC and requires `email`.
                business_type:
                  type: string
                  enum:
                    - individual
                    - proprietorship
                    - private_limited
                    - llp
                    - partnership
                    - public_limited
                    - trust
                    - society
                    - huf
                    - government
                  description: Legal constitution of the customer. Drives which
                    KYC documents are required.
                enabled:
                  type: boolean
              required:
                - name
            example:
              name: Customer Co
              email: customer@example.com
              password: Customer@12345
              kyc_mode: customer_use
              business_type: private_limited
      responses:
        "201":
          description: Sub-account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccount"
              example:
                message: Sub-account created successfully
                sub_account:
                  name: Acme Sub-Account
                  email: null
                  phone: null
                  description: null
                  permissions: null
                  rate_limit: 1000
                  id: "500001"
                  parent_account_id: "510762"
                  parent_auth_id: MA_XXXXXXXX
                  auth_id: SA_XXXXXXXX
                  auth_token: <redacted>
                  api_id: aabbccdd-1234-5678-90ab-cdef12345678
                  email_verified: false
                  enabled: true
                  created: "2026-03-25"
                  modified: "2026-03-25"
                  is_active: true
                  created_at: "2026-03-25T10:00:00Z"
                  updated_at: "2026-03-25T10:00:00Z"
                  last_used: null
                  account: /v1/Account/MA_XXXXXXXX/
                  resource_uri: /v1/Account/MA_XXXXXXXX/Subaccount/SA_XXXXXXXX/
                auth_credentials:
                  auth_id: SA_XXXXXXXX
                  auth_token: <redacted>
                tokens:
                  access_token: <redacted>
                  refresh_token: <redacted>
                  token_type: bearer
                  expires_in: 1800
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  sub_account:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        nullable: true
                      phone:
                        nullable: true
                      description:
                        nullable: true
                      permissions:
                        nullable: true
                      rate_limit:
                        type: integer
                      id:
                        type: string
                      parent_account_id:
                        type: string
                      parent_auth_id:
                        type: string
                      auth_id:
                        type: string
                      auth_token:
                        type: string
                      api_id:
                        type: string
                      email_verified:
                        type: boolean
                      enabled:
                        type: boolean
                      created:
                        type: string
                      modified:
                        type: string
                      is_active:
                        type: boolean
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      last_used:
                        nullable: true
                      account:
                        type: string
                      resource_uri:
                        type: string
                    required:
                      - name
