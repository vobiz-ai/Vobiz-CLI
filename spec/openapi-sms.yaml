  /coverage:
    get:
      tags:
      - Coverage
      summary: List coverage
      description: 'Returns one summary row per destination country, sorted by country name: the sender types it accepts,
        whether sender registration is required, two-way support, opt-out rules and whether a sending window applies. Use
        it to plan where to send and which sender to use before you buy numbers or register. Filters combine, so `region`
        plus `twoWay=true` returns only two-way countries in that region. For the full record of one country, call `GET /coverage/{country}`.'
      operationId: list-coverage
      parameters:
      - name: q
        in: query
        description: Search text, case-insensitive. Matches a substring of the country name (`united`), an exact ISO 3166-1
          alpha-2 code (`GB`) or the start of the dial code (`44` or `+44`); spaces and a leading `+` are ignored.
        schema:
          type: string
        example: united
      - name: region
        in: query
        description: Exact region name, case-insensitive, for example `Northern America`, `Western Europe` or `South-central
          Asia`. Partial names match nothing; read the `region` values from an unfiltered list to see the full set.
        schema:
          type: string
        example: Northern America
      - name: twoWay
        in: query
        description: '`true` returns only countries where recipients can reply; `false` returns the rest, including countries
          where two-way support is unknown. Also accepts `1`/`0` and `t`/`f`; any other value returns `400` with `twoWay must
          be true or false`.'
        schema:
          type: boolean
      - name: registrationRequired
        in: query
        description: '`true` returns countries that require sender registration for local or international traffic; `false`
          returns countries that require neither. Accepts the same values as `twoWay`; anything else returns `400` with `registrationRequired
          must be true or false`.'
        schema:
          type: boolean
      responses:
        '200':
          description: Coverage rows and the dataset timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageList'
              example:
                countries:
                - country: GB
                  name: United Kingdom
                  region: Northern Europe
                  dialCode: '44'
                  senders:
                    alphanumeric:
                      local: true
                      international: true
                    shortCode:
                      local: true
                      international: true
                    longNumber:
                      local: true
                      international: true
                  registrationRequired:
                    local: true
                    international: true
                  twoWay: true
                  optOutMandatory: false
                  hasSendWindow: false
                - country: US
                  name: United States
                  region: Northern America
                  dialCode: '1'
                  senders:
                    alphanumeric:
                      local: false
                      international: false
                    shortCode:
                      local: true
                      international: true
                    longNumber:
                      local: true
                      international: true
                  registrationRequired:
                    local: true
                    international: true
                  twoWay: true
                  optOutMandatory: true
                  hasSendWindow: false
                total: 2
                updatedAt: '2026-10-09T09:49:01Z'
        '400':
          description: A boolean filter has a value other than `true` or `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: twoWay must be true or false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
      x-codeSamples:
      - lang: typescript
        label: Node SDK
        source: |
          import { VobizClient } from "@vobiz/sdk";

          const client = new VobizClient({ apiKey: "MA_XXXXXXXX", authToken: "YOUR_AUTH_TOKEN" });

          await client.sms.coverage.listCoverage({
              q: "united",
              region: "Northern America"
          })
      - lang: python
        label: Python SDK
