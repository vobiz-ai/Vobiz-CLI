    get:
      tags:
      - Broadcasts
      summary: Retrieve a broadcast
      description: Returns one broadcast with its configuration, current `status` and freshly counted `stats`. Poll it while
        a broadcast runs to follow progress, or subscribe to the `broadcast.updated` WebSocket event. For per-recipient results,
        use `GET /broadcasts/{id}/recipients` or `GET /broadcasts/{id}/export`.
