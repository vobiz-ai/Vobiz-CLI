    get:
      tags:
      - RCS Senders
      summary: List RCS senders
      description: Returns the RCS senders on your account as a bare JSON array, without a total count. Page through them
        with `limit` and `offset`; an empty array means you have reached the end. `status` here is the last stored value,
        so call `GET /senders/{id}/status` for the latest state.
      operationId: list-senders
      parameters:
      - name: limit
        in: query
        description: Maximum number of items to return, from 1 to 100. Defaults to 20; a value outside that range or a non-integer
          is replaced by the default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        description: Number of items to skip before the page starts. Defaults to `0`. Pass a whole number of 0 or more.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: An array of senders. Empty when you have none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sender'
              example:
              - id: 7a1c3e5f-9b2d-4c6e-8f0a-1b3d5e7f9a21
                accountId: MA_XXXXXXXX
                provider: YOUR_ROUTING_IDENTIFIER
                senderName: example-brand
                displayName: Example Brand
                description: Order updates and support for Example Brand customers.
                billingCategory: CONVERSATIONAL
                useCase: TRANSACTIONAL
                hostingRegion: NORTH_AMERICA
                status: pending
                brand:
                  brandName: Example Brand
                color: '#1A73E8'
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
