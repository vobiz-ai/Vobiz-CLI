  # ─── Endpoints ─────────────────────────────────────────────
  /api/v1/Account/{auth_id}/Endpoint/:
    post:
      operationId: create-endpoint
      summary: Create an Endpoint
      description: |
        Create a new SIP endpoint that can be used to make and receive calls
        through IP phones, softphones, or SIP clients. Each endpoint is
        assigned a unique SIP URI and endpoint ID.

        The API appends digits to the `username` you request (for example,
        `acme01` can become `acme0125672327435497`). Configure your SIP client
        with the `username` returned in the response.
      tags: [ Endpoints ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                alias:
                  type: string
                app_id:
                  type: string
                  pattern: "^[0-9]+$"
                  description: ID of the application that handles calls from this endpoint. Application IDs are 17-digit strings; send them as JSON strings.
                application:
                  type: integer
                  deprecated: true
                  description: Not read by the API. Application IDs exceed the range of a JSON integer, and the endpoint is created without an application. Send `app_id` instead.
              required:
                - username
                - password
                - alias
            example:
              username: john_doe
              password: SecurePassword123!
              alias: John's Desktop Phone
              app_id: "12345678901234567"
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              example:
                alias: Acme Desktop Phone
                endpoint_id: "193962768711692"
                username: acme_sip_user_01
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    type: string
                  endpoint_id:
                    type: string
                  username:
                    type: string
                required:
                  - alias
                  - endpoint_id
                  - username
              example:
                alias: Acme Desktop Phone
                endpoint_id: "193962768711692"
                username: acme_sip_user_01

    get:
      operationId: list-endpoints
      summary: List All Endpoints
      description: Retrieve a paginated list of all SIP endpoints in your account.
      tags: [ Endpoints ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: username__contains
          in: query
          schema:
            type: string
        - name: username__exact
          in: query
          schema:
            type: string
        - name: username__startswith
          in: query
          schema:
            type: string
        - name: alias__contains
          in: query
          schema:
            type: string
        - name: alias__exact
          in: query
          schema:
            type: string
        - name: application_id__exact
          in: query
          schema:
            type: integer
        - name: application_id__isnull
          in: query
          schema:
            type: boolean
        - name: sub_account
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of endpoints
          content:
            application/json:
              example:
                api_id: aabbccdd-1234-5678-90ab-cdef12345678
                meta:
                  limit: 20
                  offset: 0
                  total_count: 4
                  next: null
                  previous: null
                objects:
                  - alias: Acme Desktop Phone
                    application: /v1/Account/MA_XXXXXXXX/Application/12345678901234567/
                    endpoint_id: "147322537258167"
                    resource_uri: /v1/Account/MA_XXXXXXXX/Endpoint/147322537258167/
                    sip_registered: "false"
                    sip_uri: sip:acme_sip_user_01@registrar.vobiz.ai
                    sub_account: null
                    username: acme_sip_user_01
                  - alias: SIP Demo Phone
                    application: null
                    endpoint_id: "125649946800674"
                    resource_uri: /v1/Account/MA_XXXXXXXX/Endpoint/125649946800674/
                    sip_registered: "false"
                    sip_uri: sip:sipuser_demo@registrar.vobiz.ai
                    sub_account: null
                    username: sipuser_demo
              schema:
                type: object
                properties:
                  api_id:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        alias:
                          type: string
                        application:
                          type: string
                          nullable: true
                        endpoint_id:
                          type: string
                        resource_uri:
                          type: string
                        sip_registered:
                          type: string
                        sip_uri:
                          type: string
                        sub_account:
                          nullable: true
                        username:
                          type: string
                      required:
                        - alias
                        - application
                        - endpoint_id
                        - resource_uri
                        - sip_registered
                        - sip_uri
                        - sub_account
                        - username
                required:
                  - api_id
                  - meta
                  - objects

  /api/v1/Account/{auth_id}/Endpoint/{endpoint_id}/:
    get:
      operationId: retrieve-endpoint
      summary: Retrieve an Endpoint
      description: |
        Retrieve the details of an existing endpoint. The response includes
        all endpoint attributes and, if the endpoint is currently registered
        on a SIP client, additional registration details.
      tags: [ Endpoints ]
      parameters:
