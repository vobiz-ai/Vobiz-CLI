    post:
      tags:
      - Webhooks
      summary: Create a webhook
      description: Registers an HTTPS endpoint that receives the events you subscribe to as signed `POST` requests. Only `url`
        is required; omit `events` to subscribe to `message.received`, `message.delivered` and `message.failed`. Every delivery
        carries `X-Webhook-ID`, `X-Webhook-Event` and `X-Webhook-Signature`, a lower-case hex HMAC-SHA256 of the raw body
        keyed with your `secret`. The subscription is active as soon as it is created; see the Webhooks guide for the payload
        envelope and a verification example.
      operationId: create-webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
            example:
              url: https://example.com/vobiz/webhooks
              secret: YOUR_WEBHOOK_SECRET
              events:
              - message.received
              - message.delivered
              - message.failed
      responses:
        '201':
          description: The subscription, active immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
              example:
                id: 8d4f2a6b-3e1c-4b9a-a7d2-5c8e1f0b6a93
                accountId: MA_XXXXXXXX
                url: https://example.com/vobiz/webhooks
                secret: YOUR_WEBHOOK_SECRET
                events:
                - message.received
                - message.delivered
                - message.failed
                active: true
                createdAt: '2026-10-18T07:22:11Z'
        '400':
          description: '`url` is missing or the body is not valid JSON.'
          content:
