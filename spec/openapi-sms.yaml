  /senders/{id}/status:
    get:
      tags:
      - RCS Senders
      summary: Refresh sender status
      description: Asks the RCS platform for the sender's current launch status, stores it on the sender and returns the full
        sender. Poll it after `POST /senders` or a profile update until `status` shows the sender is live, then start sending.
        Every failure, including an unknown id, returns `400`.
      operationId: get-sender-status
      parameters:
      - name: id
        in: path
        required: true
        description: The sender's `id` (UUID), as returned by `POST /senders` or `GET /senders`. An unknown id returns `sender
          not found`.
        schema:
          type: string
          format: uuid
        example: 5d7f9b1c-3e5a-4c7e-9f1b-3d5f7a9c1e3b
      responses:
        '200':
          description: The sender with its refreshed `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
              example:
                id: 7a1c3e5f-9b2d-4c6e-8f0a-1b3d5e7f9a21
                accountId: MA_XXXXXXXX
                provider: YOUR_ROUTING_IDENTIFIER
                senderName: example-brand
                displayName: Example Brand
                description: Order updates and support for Example Brand customers.
                billingCategory: CONVERSATIONAL
                useCase: TRANSACTIONAL
                hostingRegion: NORTH_AMERICA
                status: pending
                brand:
                  brandName: Example Brand
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T12:30:00Z'
        '400':
          description: The sender does not exist on your account, or the RCS platform did not return a status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: sender not found
                platform:
                  value:
                    error: 'provider get sender status failed: <description>'
        '401':
          $ref: '#/components/responses/Unauthorized'
