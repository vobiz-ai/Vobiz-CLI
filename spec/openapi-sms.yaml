      summary: Retrieve a campaign
      description: Returns one campaign after refreshing its `stage` and review feedback (`rejectionReasons`) from the US
        10DLC registry. If the registry is slow to answer, you get the stored record and `lastSyncedAt` tells you how fresh
        it is. Poll this endpoint (or listen for the `10dlc.campaign.updated` WebSocket event) after registering until `stage`
        settles at `REGISTERED` or `REJECTED`.
