  /10dlc/brands/{id}/register:
    post:
      tags:
      - 10DLC Brands
      summary: Register a brand
      description: Submits the brand to the US 10DLC registry for identity verification. The brand moves from `DRAFT` to `SUBMITTED`
        and `registrationStatus` starts tracking the registrar's decision (`PENDING`, then `ACTIVE` or `REJECTED`). The request
        has no body and returns the refreshed brand. Submit only when the brand details are final and you intend to register
        this business. Follow progress with `GET /10dlc/brands/{id}` or `GET /10dlc/brands/{id}/registrar-statuses`.
      operationId: register-brand
      parameters:
      - name: id
        in: path
        required: true
        description: Brand ID (UUID) returned by `POST /10dlc/brands`. An unknown ID, an ID from another account, or a value
          that is not a UUID returns `404` with `{"error":"brand not found"}`.
        schema:
          type: string
          format: uuid
        example: 8e6c4a2f-0d9b-4b7a-a5c3-1e9f7d5b3a10
      responses:
        '200':
          description: The brand after submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
              example:
                id: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
                accountId: MA_XXXXXXXX
                name: Example Corp
                legalName: Example Corporation Inc.
                brandType: TENDLC_PRIVATE_COMPANY
                stage: SUBMITTED
                registrationStatus: PENDING
                brandIdentityStatus: UNVERIFIED
                website: https://example.com
                supportEmail: support@example.com
                supportPhone: '+14155550100'
                vertical: TECHNOLOGY
                taxId: 12-3456789
                taxIdIssuingCountry: US
                countryCode: US
                businessContactFirstName: Alex
                businessContactLastName: Doe
                legalEntityType: PRIVATE_COMPANY
                lastSyncedAt: '2026-10-12T11:05:00Z'
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T11:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The brand does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: brand not found
        '422':
          description: The US 10DLC registry rejected the submission. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: taxId is required for TENDLC_PRIVATE_COMPANY'
                providerError: 'registration error 400 (HTTP 400): taxId is required'
        '502':
          description: The US 10DLC registry did not answer. Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '503':
          description: The registry did not accept Vobiz's service credentials. Retry later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider rejected the service credentials
                providerError: 'registration error 401 (HTTP 401): unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
