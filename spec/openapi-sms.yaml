  /10dlc/brands:
    post:
      tags:
      - 10DLC Brands
      summary: Create a brand
      description: Creates a brand, the business identity that US carriers associate with your 10DLC traffic, and mirrors
        it to the US 10DLC registry in `DRAFT` stage. `name` and `brandType` are required; send every other field your business
        has, because the registry reviews them when you register. Nothing is submitted for review until you call `POST /10dlc/brands/{id}/register`.
        Pass a `referenceId` so that a retried request (for example after a `502`) reconciles to the same brand instead of
        creating a second one. Next, register the brand, then create a campaign under it with `POST /10dlc/campaigns`.
      operationId: create-brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
            examples:
              privateCompany:
                summary: US private company
                value:
                  referenceId: brand-example-corp-01
                  name: Example Corp
                  legalName: Example Corporation Inc.
                  brandType: TENDLC_PRIVATE_COMPANY
                  legalEntityType: PRIVATE_COMPANY
                  vertical: TECHNOLOGY
                  website: https://example.com
                  supportEmail: support@example.com
                  supportPhone: '+14155550100'
                  taxId: 12-3456789
                  taxIdIssuingCountry: US
                  countryCode: US
                  address:
                    street: 100 Example Street
                    city: San Francisco
                    state: CA
                    zipCode: '94105'
                  businessContactFirstName: Alex
                  businessContactLastName: Doe
                  businessContactEmail: alex.doe@example.com
      responses:
        '201':
          description: The brand was created in `DRAFT` stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
              example:
                id: 5f1c3a2e-7b4d-4e8f-9a0b-1c2d3e4f5a60
                accountId: MA_XXXXXXXX
                name: Example Corp
                legalName: Example Corporation Inc.
                brandType: TENDLC_PRIVATE_COMPANY
                stage: DRAFT
                website: https://example.com
                supportEmail: support@example.com
                supportPhone: '+14155550100'
                vertical: TECHNOLOGY
                taxId: 12-3456789
                taxIdIssuingCountry: US
                countryCode: US
                address:
                  street: 100 Example Street
                  city: San Francisco
                  state: CA
                  zipCode: '94105'
                businessContactFirstName: Alex
                businessContactLastName: Doe
                businessContactEmail: alex.doe@example.com
                legalEntityType: PRIVATE_COMPANY
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:30:00Z'
        '400':
          description: Invalid body or a missing required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                name:
                  value:
                    error: 'invalid request: name is required'
                brandType:
                  value:
                    error: 'invalid request: brandType is required'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The registry brand this request resolves to is already linked to a brand on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'conflict: provider brand 7e6d5c4b-3a2f-4e1d-9c8b-7a6f5e4d3c2b already linked'
        '422':
          description: The US 10DLC registry rejected the request. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: legalName is required for TENDLC_PRIVATE_COMPANY'
                providerError: 'registration error 400 (HTTP 400): legalName is required'
        '502':
          description: The US 10DLC registry did not answer. Retry with the same `referenceId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '503':
          description: The registry did not accept Vobiz's service credentials. Retry later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider rejected the service credentials
                providerError: 'registration error 401 (HTTP 401): unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
