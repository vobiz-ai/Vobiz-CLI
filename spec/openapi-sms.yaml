                brand:
                  brandName: Example Brand
                color: '#1A73E8'
                phones:
                - phoneNumber: '+14155550100'
                  label: Support
                emails:
                - address: support@example.com
                  label: Support
                websites:
                - url: https://example.com
                  label: Website
                bannerUrl: https://example.com/rcs/banner.jpg
                logoUrl: https://example.com/rcs/logo.png
                privacy:
                  url: https://example.com/privacy
                  label: Privacy policy
                termsOfService:
                  url: https://example.com/terms
                  label: Terms of service
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:30:00Z'
        '400':
          description: The body is invalid, `provider` is missing or unknown, or the RCS platform rejected the sender. The
            `error` carries the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                body:
                  value:
                    error: invalid request body
                provider:
                  value:
                    error: 'provider not found: provider "" not found'
                platform:
                  value:
                    error: 'provider create sender failed: <description>'
