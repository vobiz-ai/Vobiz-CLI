  /numbers/available:
    get:
      tags:
      - Numbers
      summary: Search available numbers
      description: Searches the inventory for numbers you can buy in one country, with their setup and monthly prices in your
        wallet currency. Each search returns up to 10 numbers. Pass the chosen `e164`, the `country` and any non-empty `numberKey`
        to `POST /numbers/purchase`. For `country=IN` the list is empty and `hint` explains that Indian traffic uses DLT-registered
        sender IDs. A country outside the set Vobiz sells numbers in returns `422`.
      operationId: search-available-numbers
      parameters:
      - name: country
        in: query
        required: true
        description: Country to search, as an ISO 3166-1 alpha-2 code such as `US`, `CA` or `GB`. Case-insensitive. A value
          that is not two letters returns `400` with `country must be an ISO 3166-1 alpha-2 code`.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
        example: US
      - name: capabilities
        in: query
        description: 'Comma-separated capabilities the number must have: `SMS`, `MMS`, or `SMS,MMS`. Case-insensitive, defaults
          to `SMS`. Any other value returns `400` with `capabilities must be SMS and/or MMS`.'
        schema:
          type: string
          default: SMS
        example: SMS,MMS
      - name: areaCode
        in: query
        description: Three-digit area code to search in, for example `415`. Accepted only when `country` is `US` or `CA`;
          other countries return `400` with `areaCode is only supported for US and CA`.
        schema:
          type: string
          pattern: ^[0-9]{3}$
        example: '415'
      - name: limit
        in: query
        description: Maximum number of results, from `1` to `100`. Defaults to `10`, and each search returns at most 10 numbers
          whatever you pass. A value outside the range returns `400` with `limit must be between 1 and 100`.
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      responses:
        '200':
          description: Numbers you can buy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableNumbersResponse'
              examples:
                us:
                  summary: US search
                  value:
                    numbers:
                    - e164: '+14155550100'
                      numberKey: ''
                      countryCode: US
                      type: VIRTUAL_LONG_NUMBER
                      capabilities:
                      - MMS
                      - SMS
                      - VOICE
                      network: ''
                      setupPrice: 1
                      monthlyPrice: 1
                      currency: USD
                      providerRequiresDocuments: false
                    page: 0
                    limit: 10
                    hasMore: false
                india:
                  summary: India
                  value:
                    numbers: []
                    page: 0
                    limit: 10
                    hasMore: false
                    hint: India uses DLT sender IDs, not long codes
        '400':
          description: A query parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                country-missing:
                  value:
                    error: country is required
                country-format:
                  value:
                    error: country must be an ISO 3166-1 alpha-2 code
                capabilities:
                  value:
                    error: capabilities must be SMS and/or MMS
                areaCode:
                  value:
                    error: areaCode is only supported for US and CA
                limit:
                  value:
                    error: limit must be between 1 and 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The country or your wallet currency is outside the current sales set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                country:
                  value:
                    error: SMS numbers are not sold for country FR
                pricing:
                  value:
                    error: SMS numbers in GB cannot be priced in EUR yet; contact support
        '502':
          description: The upstream inventory rejected the search or could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rejected:
                  value:
                    error: 'number provider: invalid area code'
                unavailable:
                  value:
                    error: number provider unavailable; try again later
        '503':
          description: Number search is paused or busy. Retry after a short wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  value:
                    error: number search is busy; try again in a few seconds
                billing:
                  value:
                    error: billing is unavailable; try again later
                purchasing:
                  value:
                    error: number purchasing is not available
        '500':
          $ref: '#/components/responses/ServerError'
      x-codeSamples:
      - lang: typescript
        label: Node SDK
        source: |
          import { VobizClient } from "@vobiz/sdk";

          const client = new VobizClient({ apiKey: "MA_XXXXXXXX", authToken: "YOUR_AUTH_TOKEN" });

          await client.sms.numbers.searchAvailableNumbers({
              country: "US",
              capabilities: "SMS,MMS",
              areaCode: "415"
          })
      - lang: python
        label: Python SDK
        source: |
