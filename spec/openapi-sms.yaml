  /broadcasts/{id}/launch:
    post:
      tags:
      - Broadcasts
      summary: Launch a broadcast
      description: Starts sending. This sends real SMS to every `pending` recipient and charges your account per segment,
        so call it only with your own credentials on a list you have consent to message. Only a `draft` can be launched; it
        moves to `running`, or to `scheduled` when `scheduledAt` is in the future. Launch returns `422` when the template
        is empty, when no recipient is pending, or when a phone-number `from` is not an SMS number on your account. Each recipient
        is sent like `POST /messages` with the broadcast's `tag` and DLT IDs and the idempotency key `broadcast:<broadcastId>:<recipientId>`,
        so no recipient is messaged twice.
      operationId: launch-broadcast
      parameters:
      - name: id
        in: path
        required: true
        description: The broadcast's `id` (UUID), as returned by `POST /broadcasts` or `GET /broadcasts`. An id that is not
          a UUID, or that belongs to another account, returns `404` with `broadcast not found`.
        schema:
          type: string
          format: uuid
        example: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
      responses:
        '200':
          description: The broadcast, now `running` or `scheduled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
              example:
                id: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
                accountId: MA_XXXXXXXX
                name: October pricing update
                from: '+14155550100'
                channel: sms
                template: Hi {{name}}, your refund of {{amount}} is on its way.
                status: running
                scheduledAt: null
                ratePerSecond: 5
                tag: pricing-oct
                dltEntityId: ''
                dltHeaderId: ''
                dltTemplateId: ''
                columns:
                - phone
                - name
                - amount
                stats:
                  total: 3
                  pending: 3
                  sent: 0
                  delivered: 0
                  failed: 0
                  optedOut: 0
                  skipped: 0
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T11:05:10Z'
                startedAt: '2026-10-12T11:05:10Z'
                completedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The broadcast does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: broadcast not found
        '409':
          description: The broadcast is not a draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: cannot launch a broadcast that is completed
        '422':
          description: The draft is not ready to send. Fix the template, recipients or sender and launch again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                template:
                  value:
                    error: template is empty
                recipients:
                  value:
                    error: the broadcast has no valid recipients to send to
                sender:
                  value:
                    error: +14155550100 is not an SMS number on this account
                route:
                  value:
                    error: no SMS route for sender EXAMPLE
