  /broadcasts/{id}/cancel:
    post:
      tags:
      - Broadcasts
      summary: Cancel a broadcast
      description: Stops a broadcast for good and sets `completedAt`. You can cancel from `draft`, `scheduled`, `running`
        or `paused`; a `completed`, `failed` or already `cancelled` broadcast returns `409`. Pending recipients become `skipped`,
        and messages already sent are unaffected. A cancelled broadcast cannot be resumed or edited, but it can be deleted.
      operationId: cancel-broadcast
      parameters:
      - name: id
        in: path
        required: true
        description: The broadcast's `id` (UUID), as returned by `POST /broadcasts` or `GET /broadcasts`. An id that is not
          a UUID, or that belongs to another account, returns `404` with `broadcast not found`.
