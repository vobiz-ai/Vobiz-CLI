    put:
      tags:
      - Webhooks
      summary: Update a webhook
      description: Changes any subset of `url`, `secret`, `events` and `active`. Fields you omit keep their current value;
        a field you send, including an empty string, replaces it. Set `active` to `false` to pause deliveries without losing
        the subscription, and back to `true` to resume. The response is `{"status":"ok"}`, so call `GET /webhooks/{id}` to
        read the updated subscription.
      operationId: update-webhook
      parameters:
      - name: id
        in: path
        required: true
        description: The subscription `id` (UUID) to change.
        schema:
          type: string
          format: uuid
        example: 2a4c6e8f-1b3d-4f5a-8c7e-9d0b2f4a6c8e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
            examples:
              events:
                summary: Change the events
                value:
                  events:
                  - message.delivered
                  - message.failed
              pause:
                summary: Pause deliveries
                value:
                  active: false
              rotate:
                summary: Rotate the secret and move the endpoint
                value:
                  url: https://example.com/vobiz/webhooks-v2
                  secret: YOUR_NEW_WEBHOOK_SECRET
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
              example:
                status: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The subscription does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: subscription not found
        '500':
          $ref: '#/components/responses/ServerError'
