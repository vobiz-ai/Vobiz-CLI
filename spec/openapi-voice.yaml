  /api/v1/partner/kyc-sessions/{session_id}:
    get:
      operationId: get-kyc-session
      summary: Get KYC session
      description: |
        Returns the current status and available details for one KYC session
        owned by the authenticated partner.
      tags: [ Partner API ]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
    delete:
      operationId: revoke-kyc-session
      summary: Revoke KYC session
      description: Cancels an outstanding KYC session. Customer can no longer use the link.
      tags: [ Partner API ]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Wrong email - creating new session"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              example:
                message: "Session revoked"
                session_id: "1a0f7da5-2abb-47bf-a6c3-eb5cff7feda5"
        "409":
          description: Session already in a terminal status (`revoked` or `kyc_completed`)

  /api/v1/partner/kyc-sessions/{session_id}/resend:
    post:
      operationId: resend-kyc-session
      summary: Resend KYC email
      description: Re-dispatches the KYC link to the customer. Rate-limited to once
        per 30 minutes.
      tags: [ Partner API ]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email resent (only available 30 minutes after the previous send)
        "400":
          description: Session is a redirect-flow session - resend does not apply
        "409":
          description: Session is in a terminal status (`revoked` or `kyc_completed`)
        "429":
          description: |
            Rate limit hit. The initial `POST /kyc-sessions` itself starts the 30-minute
            cooldown clock - calling `/resend` immediately after creation returns 429.
            The message includes the precise remaining seconds.
          content:
            application/json:
              example:
                error: "HTTPError"
                message: "Email was sent recently. Please wait 1799 seconds before resending."
                status_code: 429
