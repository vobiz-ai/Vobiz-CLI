    get:
      tags:
      - Broadcasts
      summary: List recipients
      description: Returns the broadcast's recipients in upload order, each with its template `variables` and per-recipient
        send state. Filter by `status` to find failures, opted-out numbers or rows still waiting to send. The response gives
        the page in `recipients` and the count matching your filter in `total`. For a downloadable file of the same data,
        use `GET /broadcasts/{id}/export`.
      operationId: list-recipients
      parameters:
      - name: status
        in: query
        description: Return only recipients in this state, matched case-insensitively. `pending` waits to send, `sending`
          is in progress, `sent` and `delivered` track the message, `failed` has an `errorCode`, `opted_out` was excluded
          because the number opted out, and `skipped` was still pending when the broadcast was cancelled. Omit it to return
          every recipient; any other value returns `400`.
        schema:
          type: string
          enum:
          - pending
          - sending
          - sent
          - delivered
          - failed
          - opted_out
          - skipped
      - name: limit
        in: query
        description: Maximum number of recipients to return, from 1 to 500. Defaults to 50 when you omit it or pass `0`. A
          value above 500 returns `400` with `limit must be between 1 and 500`, and a non-integer returns `400` with `limit
          must be an integer`.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        description: Number of recipients to skip before the page starts, for paging through results with `limit`. Defaults
          to `0`. A negative value returns `400` with `offset must be >= 0`, and a non-integer returns `400` with `offset
          must be an integer`.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: A page of recipients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastRecipientList'
              example:
                recipients:
                - id: 1042
                  row: 2
                  to: '+14155550123'
                  variables:
                    name: Priya
                    amount: $42.00
                  status: sent
                  messageId: 9b2e1c40-8a3d-4f5e-9c1a-7d6b2e8f4a01
                  errorCode: ''
                  errorMessage: ''
                  sentAt: '2026-10-12T11:05:10Z'
                - id: 1043
                  row: 3
                  to: '+14155550124'
                  variables:
                    name: Sam
                    amount: $18.50
                  status: pending
                  messageId: ''
                  errorCode: ''
                  errorMessage: ''
                  sentAt: null
                total: 2
        '400':
          description: '`status`, `limit` or `offset` is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                status:
                  value:
                    error: status must be one of pending, sending, sent, delivered, failed, opted_out, skipped
                limit:
                  value:
                    error: limit must be between 1 and 500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The broadcast does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: broadcast not found
