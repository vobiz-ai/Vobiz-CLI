  /conversations/{id}/messages:
    get:
      tags:
      - Conversations
      summary: List conversation messages
      description: 'Returns the messages in one conversation, in both directions, newest first. Use it to render a chat thread:
        reverse the page to show it oldest to newest. The response is a bare JSON array of message objects without `statusHistory`;
        call `GET /messages/{id}` for one message''s history. Page with `limit` and `offset`.'
      operationId: list-conversation-messages
      parameters:
      - name: id
        in: path
        required: true
        description: The conversation `id` (UUID), from `GET /conversations` or the `conversationId` on any message.
        schema:
          type: string
          format: uuid
        example: c7d1e9a3-2b4f-4a6c-8d5e-1f3a9b7c2e04
      - name: limit
        in: query
        description: Maximum number of messages to return, from `1` to `100`. Defaults to `50`; a value outside that range
          also returns `50`.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        description: Number of messages to skip before the page starts, `0` or greater. Defaults to `0`. Add the page size
          to it to load older messages.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
              - id: 9b2e1c40-8a3d-4f5e-9c1a-7d6b2e8f4a01
