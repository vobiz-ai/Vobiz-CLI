    get:
      tags:
      - 10DLC Campaigns
      summary: List campaign network statuses
      description: Returns the campaign's status at each US carrier network, read live from the US 10DLC registry. Each entry
        names the network and its `state`, plus the message class, throughput and brand tier when the network reports them.
        Use it after the campaign reaches `REGISTERED` to see which networks have provisioned it and what throughput they
        grant.
      operationId: campaign-network-statuses
      parameters:
      - name: id
        in: path
        required: true
        description: Campaign ID (UUID) returned by `POST /10dlc/campaigns` or `POST /10dlc/campaigns/toll-free`. An unknown
          ID, an ID from another account, or a value that is not a UUID returns `404` with `{"error":"campaign not found"}`.
        schema:
          type: string
          format: uuid
        example: 4c2a0e8d-6b4f-4d2c-b0a8-9e7c5a3f1d24
      responses:
        '200':
          description: One entry per US carrier network.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignNetworkStatus'
              example:
              - network: T_MOBILE
                state: ACTIVE
                messageClass: '24'
                throughput: 2000
                brandTier: LOW
              - network: ATT
                state: ACTIVE
                messageClass: T
                throughput: 75
              - network: VERIZON
