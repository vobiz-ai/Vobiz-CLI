    get:
      tags:
      - Conversations
      summary: List conversations
      description: Returns your conversations, most recently active first (ordered by `lastMessageAt`). A conversation is
        the thread between one of your numbers and one contact on one channel, and Vobiz creates it with the first message
        in either direction. The response is a bare JSON array, `[]` when you have none. Page with `limit` and `offset`; when
        a page returns fewer items than `limit`, you have reached the end.
      operationId: list-conversations
      parameters:
      - name: limit
        in: query
        description: Maximum number of conversations to return, from `1` to `100`. Defaults to `20`; a value outside that
          range also returns `20`.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        description: Number of conversations to skip before the page starts, `0` or greater. Defaults to `0`. Add the page
          size to it to fetch the next page.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: A page of conversations. Empty array when none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
              example:
              - id: c7d1e9a3-2b4f-4a6c-8d5e-1f3a9b7c2e04
                accountId: MA_XXXXXXXX
                participantA: '+14155550100'
