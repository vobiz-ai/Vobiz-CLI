    put:
      operationId: update-subaccount
      summary: Update a sub-account
      description: |
        Update the name or status of a sub-account, or change its `kyc_mode`.

        Set `is_active` to `false` to deactivate a sub-account. A deactivated
        sub-account no longer appears in the list, and retrieve, update and
        delete requests for it return `404`. The `enabled` field is accepted
        but has no effect.

        Promoting an existing sub-account to `customer_use` requires the
        sub-account to already have an `email` (otherwise `400`). On any
        `kyc_mode` change, `kyc_calls_blocked` is re-derived from the
        sub-account's current KYC state.
      tags: [ Sub-Accounts ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: sub_auth_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
                  description: Set to `false` to deactivate the sub-account. A deactivated sub-account no longer appears in list, retrieve, update or delete requests (`404`).
                enabled:
                  type: boolean
                  deprecated: true
                  description: Accepted but has no effect. Use `is_active` instead.
                kyc_mode:
                  type: string
                  enum: [ personal_use, customer_use ]
                  description: Change the verification mode. Promoting to
                    `customer_use` requires the sub-account to have an `email`.
            example:
              kyc_mode: customer_use
      responses:
        "200":
          description: Sub-account updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    nullable: true
                  phone:
                    nullable: true
                  description:
                    nullable: true
                  permissions:
                    nullable: true
                  rate_limit:
                    type: integer
                  id:
                    type: string
                  parent_account_id:
                    type: string
                  parent_auth_id:
                    type: string
                  auth_id:
                    type: string
                  auth_token:
                    type: string
                  api_id:
                    type: string
                  email_verified:
                    type: boolean
                  enabled:
                    type: boolean
                  created:
                    type: string
                  modified:
                    type: string
                  is_active:
                    type: boolean
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  last_used:
                    nullable: true
                  account:
                    type: string
                  resource_uri:
                    type: string
                required:
                  - name
                  - email
                  - phone
                  - description
                  - permissions
                  - rate_limit
                  - id
                  - parent_account_id
                  - parent_auth_id
                  - auth_id
                  - auth_token
                  - api_id
                  - email_verified
                  - enabled
                  - created
                  - modified
                  - is_active
                  - created_at
                  - updated_at
                  - last_used
                  - account
                  - resource_uri
              example:
                name: Acme Sub-Account Updated
                email: null
                phone: null
                description: null
                permissions: null
                rate_limit: 1000
                id: "500001"
                parent_account_id: "510762"
                parent_auth_id: MA_XXXXXXXX
                auth_id: SA_XXXXXXXX
                auth_token: <redacted>
                api_id: aabbccdd-1234-5678-90ab-cdef12345678
                email_verified: false
                enabled: false
                created: "2026-03-25"
                modified: "2026-03-25"
                is_active: true
                created_at: "2026-03-25T10:00:00Z"
                updated_at: "2026-03-25T10:30:00Z"
                last_used: null
                account: /v1/Account/MA_XXXXXXXX/
                resource_uri: /v1/Account/MA_XXXXXXXX/Subaccount/SA_XXXXXXXX/

    delete:
      operationId: delete-subaccount
      summary: Delete a sub-account
      description: Permanently delete a sub-account and revoke its credentials.
      tags: [ Sub-Accounts ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: sub_auth_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Sub-account deleted
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  # ─── Sub-Account KYC (real – Perfios) ──────────────────────
  # Auth: parent main-account X-Auth-ID / X-Auth-Token (same as the rest of the API).
  /api/v1/sub-accounts/{sub_auth_id}/kyc/status:
    get:
      operationId: get-subaccount-kyc-status
      summary: Get sub-account KYC status
      description: |
        Returns the aggregated KYC state for a `customer_use` sub-account —
        which verifications have passed, whether calls are still blocked, and
        the business type. The caller must be the parent main account that owns
        the sub-account (or an admin).
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      responses:
        "200":
          description: Aggregated KYC state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubAccountKycStatus"
              example:
                sub_account_id: SA_XXXXXX
                kyc_mode: customer_use
                business_type: private_limited
                overall_status: pending
                kyc_calls_blocked: true
                verifications:
                  pan: verified
                  gst: pending
                  aadhaar: not_started
                  cin: not_started
        "403":
          description: Caller is not the parent of this sub-account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sub-account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sub-accounts/{sub_auth_id}/kyc/verify-pan:
    post:
      operationId: verify-subaccount-pan
      summary: Verify PAN
      description: |
        Runs a real PAN verification (Perfios) for the sub-account. `pan` must
        be exactly 10 characters. Persists a `kyc_verifications` row and
        recomputes the sub-account's aggregated `kyc_status`.
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ pan ]
              properties:
                pan:
                  type: string
                  minLength: 10
                  maxLength: 10
                  example: ABCDE1234F
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: pan
                status: verified
                pan: ABCDE1234F
                registered_name: ACME PRIVATE LIMITED
                name_match: true
                kyc_calls_blocked: true
        "400":
          description: Invalid PAN format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sub-accounts/{sub_auth_id}/kyc/verify-gst:
    post:
      operationId: verify-subaccount-gst
      summary: Verify GST
      description: Runs a real GSTIN verification. `gstin` must be a 15-character GSTIN.
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ gstin ]
              properties:
                gstin:
                  type: string
                  minLength: 15
                  maxLength: 15
                  example: 29AAJCN5983D1Z0
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: gst
                status: verified
                gstin: 29AAJCN5983D1Z0
                legal_name: ACME PRIVATE LIMITED
        "400":
          description: Invalid GSTIN format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sub-accounts/{sub_auth_id}/kyc/cin/search:
    post:
      operationId: search-subaccount-cin
      summary: CIN search
      description: |
        Name-based CIN lookup. Returns candidate company matches; pick one and
        pass it to [CIN confirm](#operation/confirm-subaccount-cin).
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ company_name ]
              properties:
                company_name:
                  type: string
                  example: ACME PRIVATE LIMITED
      responses:
        "200":
          description: Candidate matches
          content:
            application/json:
              example:
                matches:
                  - cin: U72900KA2024PTC123456
                    company_name: ACME PRIVATE LIMITED
                    status: Active

  /api/v1/sub-accounts/{sub_auth_id}/kyc/cin/confirm:
    post:
      operationId: confirm-subaccount-cin
      summary: CIN confirm
      description: Confirm the CIN selected from the search results.
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ company_name, selected_cin ]
              properties:
                company_name:
                  type: string
                  example: ACME PRIVATE LIMITED
                selected_cin:
                  type: string
                  example: U72900KA2024PTC123456
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: cin
                status: verified
                cin: U72900KA2024PTC123456

  /api/v1/sub-accounts/{sub_auth_id}/kyc/digilocker/initiate:
    post:
      operationId: subaccount-digilocker-initiate
      summary: DigiLocker initiate
      description: |
        Returns the DigiLocker authorization link and an `access_request_id`.
        The customer completes the OAuth flow on the DigiLocker portal, after
        which you finalize with
        [DigiLocker verify](#operation/subaccount-digilocker-verify).
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ redirect_url ]
              properties:
                redirect_url:
                  type: string
                  format: uri
                  example: https://partner.example.com/kyc/callback
                oauth_state:
                  type: string
                  description: Opaque value echoed back on the redirect for CSRF protection.
                  example: opaque-state-xyz
      responses:
        "200":
          description: DigiLocker authorization link
          content:
            application/json:
              example:
                auth_url: https://api.digitallocker.gov.in/public/oauth2/1/authorize?...
                access_request_id: AR_xxxxxxxx

  /api/v1/sub-accounts/{sub_auth_id}/kyc/digilocker/verify:
    post:
      operationId: subaccount-digilocker-verify
      summary: DigiLocker verify
      description: Finalize Aadhaar via DigiLocker after the customer completes OAuth.
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ access_request_id ]
              properties:
                access_request_id:
                  type: string
                  example: AR_xxxxxxxx
                linked_number:
                  type: string
                  description: Optional. Binds the Aadhaar to a specific number (92-series).
                  example: "+91XXXXXXXXXX"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: aadhaar
                status: verified
                source: digilocker

  /api/v1/sub-accounts/{sub_auth_id}/kyc-sessions:
    post:
      operationId: create-subaccount-kyc-session
      summary: Create a hosted KYC session
      description: |
        Creates a Vobiz-hosted KYC session for the sub-account. With
        `flow_type=email` (default) Vobiz emails the customer a signed link
        (from `kyc@vobiz.ai`, hosted at `kyc.vobiz.ai`) and `customer_email` is
        required. With `flow_type=redirect`, omit `customer_email`, pass a
        `redirect_url`, and the `widget_url` is returned directly for an inline
        redirect.

        This is the sub-account–scoped equivalent of the partner-level
        [KYC Sessions](/partner/api/kyc-sessions) endpoint.
      tags: [ Sub-Account KYC ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ account_auth_id, flow_type ]
              properties:
                account_auth_id:
                  type: string
                  description: The sub-account's auth_id (typically equal to the path `sub_auth_id`).
                  example: SA_XXXXXX
                flow_type:
                  type: string
                  enum: [ email, redirect ]
                  default: email
                customer_email:
                  type: string
                  format: email
                  description: Required when `flow_type` is `email`.
                  example: customer@example.com
                redirect_url:
                  type: string
                  format: uri
                  description: |
                    Required when `flow_type` is `redirect`. After verification the customer's
                    browser is sent to this URL.
                  example: "https://your-app.example.com/kyc/done"
                webhook_url:
                  type: string
                  format: uri
                  description: HTTPS endpoint Vobiz POSTs the KYC result to. Omit it and no callbacks are sent.
                  example: "https://your-app.example.com/kyc/webhook"
                expires_in_days:
                  type: integer
                  default: 7
                  example: 30
            examples:
              email-flow:
                summary: Email flow (Vobiz emails the link)
                value:
                  account_auth_id: SA_XXXXXX
                  flow_type: email
                  customer_email: customer@example.com
                  webhook_url: "https://your-app.example.com/kyc/webhook"
                  expires_in_days: 30
              redirect-flow:
                summary: Redirect flow (you redirect to widget_url)
                value:
                  account_auth_id: SA_XXXXXX
                  flow_type: redirect
                  redirect_url: "https://your-app.example.com/kyc/done"
                  webhook_url: "https://your-app.example.com/kyc/webhook"
                  expires_in_days: 30
      responses:
        "201":
          description: KYC session created
          content:
            application/json:
              examples:
                email-flow:
                  summary: Email-flow response
                  value:
                    session_id: a5f8da3c-b47f-40c3-a3e6-d2c9a0f27065
                    account_auth_id: SA_XXXXXX
                    customer_email: customer@example.com
                    status: email_sent
                    expires_at: "2026-06-24T19:37:01.316686Z"
                    widget_url: null
                    message: KYC email dispatched successfully
                redirect-flow:
                  summary: Redirect-flow response
                  value:
                    session_id: 1a0f7da5-2abb-47bf-a6c3-eb5cff7feda5
                    account_auth_id: SA_XXXXXX
                    customer_email: null
                    status: link_ready
                    expires_at: "2026-06-24T19:37:01.841263Z"
                    widget_url: https://kyc.vobiz.ai/verify?token=kst_cb1b3fda...
                    message: Redirect your customer to widget_url to begin.
        "422":
          description: Validation error (email flow missing `customer_email`, or redirect flow missing `redirect_url`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Sub-Account KYC (MOCK / test mode) ────────────────────
  # Never calls the upstream provider. Magic inputs drive deterministic
  # outcomes. Persists a real kyc_verifications row + recomputes kyc_status.
  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/verify-pan:
    post:
      operationId: mock-verify-subaccount-pan
      summary: Mock verify PAN
      description: |
        Mock PAN verification - never hits the provider. Magic `pan` inputs:

        | Input | Outcome |
        |---|---|
        | `TESTSUCCESS0001` | verified |
        | `TESTFAIL0001` | failed |
        | `TESTERROR0001` | HTTP 500 |
        | `TESTPENDING001` | pending (finalize as verified) |
        | `TESTPENDING_FAIL` | pending (finalize as failed) |

        Persists a real `kyc_verifications` row and recomputes `kyc_status`.
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ pan ]
              properties:
                pan:
                  type: string
                  example: TESTSUCCESS0001
      responses:
        "200":
          description: Mock verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: pan
                status: verified
                mock: true

  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/verify-gst:
    post:
      operationId: mock-verify-subaccount-gst
      summary: Mock verify GST
      description: Mock GST verification. Same magic-input matrix as
        [Mock verify PAN](#operation/mock-verify-subaccount-pan).
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ gstin ]
              properties:
                gstin:
                  type: string
                  example: TESTSUCCESS0001GST
      responses:
        "200":
          description: Mock verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: gst
                status: verified
                mock: true

  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/cin/search:
    post:
      operationId: mock-search-subaccount-cin
      summary: Mock CIN search
      description: Returns deterministic fake company matches.
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ company_name ]
              properties:
                company_name:
                  type: string
                  example: ACME
      responses:
        "200":
          description: Deterministic fake matches
          content:
            application/json:
              example:
                matches:
                  - cin: U72900KA2024PTC123456
                    company_name: ACME PRIVATE LIMITED
                    status: Active

  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/cin/confirm:
    post:
      operationId: mock-confirm-subaccount-cin
      summary: Mock CIN confirm
      description: Succeeds when `selected_cin` starts with `U72900KA2024PTC123456`.
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ company_name, selected_cin ]
              properties:
                company_name:
                  type: string
                  example: ACME
                selected_cin:
                  type: string
                  example: U72900KA2024PTC123456
      responses:
        "200":
          description: Mock verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: cin
                status: verified
                mock: true

  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/digilocker/initiate:
    post:
      operationId: mock-subaccount-digilocker-initiate
      summary: Mock DigiLocker initiate
      description: Returns a deterministic `access_request_id`.
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ redirect_url ]
              properties:
                redirect_url:
                  type: string
                  format: uri
                  example: https://partner.example.com/kyc/callback
      responses:
        "200":
          description: Mock DigiLocker link
          content:
            application/json:
              example:
                auth_url: https://kyc.vobiz.ai/mock/digilocker
                access_request_id: MOCK_AR_SUCCESS

  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/digilocker/verify:
    post:
      operationId: mock-subaccount-digilocker-verify
      summary: Mock DigiLocker verify
      description: |
        `access_request_id` `MOCK_AR_SUCCESS` → verified; `MOCK_AR_FAIL` → failed.
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ access_request_id ]
              properties:
                access_request_id:
                  type: string
                  enum: [ MOCK_AR_SUCCESS, MOCK_AR_FAIL ]
                  example: MOCK_AR_SUCCESS
      responses:
        "200":
          description: Mock verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: aadhaar
                status: verified
                source: digilocker
                mock: true

  /api/v1/sub-accounts/test/{sub_auth_id}/kyc/finalize-pending:
    post:
      operationId: mock-finalize-pending-kyc
      summary: Mock finalize pending
      description: |
        Promotes the most recent **pending** mock verification of the given
        type to a terminal outcome - this drives the async (`TESTPENDING…`)
        path without webhooks. `verification_type` ∈ `pan | aadhaar | gst | cin`;
        `outcome` ∈ `verified | failed`.
      tags: [ Sub-Account KYC (Test Mode) ]
      parameters:
        - $ref: "#/components/parameters/SubAuthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ verification_type, outcome ]
              properties:
                verification_type:
                  type: string
                  enum: [ pan, aadhaar, gst, cin ]
                  example: pan
                outcome:
                  type: string
                  enum: [ verified, failed ]
                  example: verified
      responses:
        "200":
          description: Pending verification finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResult"
              example:
                verification_type: pan
                status: verified
                mock: true

