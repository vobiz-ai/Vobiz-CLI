      tags:
      - 10DLC Campaigns
      summary: List campaigns
      description: Returns every 10DLC and toll-free campaign on your account as a bare JSON array, newest first. The list
        is not paginated and reads the records stored on your account without contacting the registry. Toll-free campaigns
        have `campaignType` `TOLL_FREE_UNIFIED_NUMBER` and no `brandId`. Call `GET /10dlc/campaigns/{id}` for the latest registry
        state of one campaign.
