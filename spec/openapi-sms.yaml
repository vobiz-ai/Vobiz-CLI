    delete:
      tags:
      - 10DLC Brands
      summary: Delete a brand
      description: 'Deletes the brand from your account and from the US 10DLC registry and returns `204` with no body. A brand
        that still owns campaigns returns `409` with `conflict: brand still has N campaign(s); delete them first`, so delete
        or deregister its campaigns first. Deletion cannot be undone; a new brand needs a new registration.'
      operationId: delete-brand
      parameters:
      - name: id
        in: path
        required: true
        description: Brand ID (UUID) returned by `POST /10dlc/brands`. An unknown ID, an ID from another account, or a value
          that is not a UUID returns `404` with `{"error":"brand not found"}`.
        schema:
          type: string
          format: uuid
        example: 8e6c4a2f-0d9b-4b7a-a5c3-1e9f7d5b3a10
      responses:
        '204':
          description: The brand was deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The brand does not exist on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: brand not found
        '409':
          description: The brand still has campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'conflict: brand still has 2 campaign(s); delete them first'
        '422':
          description: The US 10DLC registry declined the deletion. `error` carries the registry's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: 'registration provider rejected the request: brand has active campaigns'
                providerError: 'registration error 403 (HTTP 403): brand has active campaigns'
        '502':
          description: The US 10DLC registry did not answer. Retry the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenDLCError'
              example:
                error: registration provider unavailable
                providerError: 'registration error 500 (HTTP 500): upstream timeout'
        '500':
          $ref: '#/components/responses/ServerError'
