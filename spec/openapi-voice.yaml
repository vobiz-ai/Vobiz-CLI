  /api/v1/partner/kyc-sessions:
    post:
      operationId: create-kyc-session
      summary: Initiate KYC session
      description: |
        Triggers Vobiz to email a KYC link to the customer. KYC is OTP-based
        (PAN + Aadhaar via DigiLocker for individuals, PAN + GSTIN for
        companies). No document uploads required.
      tags: [ Partner API ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ account_auth_id ]
              properties:
                account_auth_id:
                  type: string
                  description: Customer's auth_id (from create-customer-account).
                  example: "MA_XXXXXXXX"
                flow_type:
                  type: string
                  enum: [ email, redirect ]
                  default: email
                  description: |
                    Delivery mode. `email` (default) emails the customer the KYC link.
                    `redirect` returns a `widget_url` in the response for immediate redirect.
                customer_email:
                  type: string
                  format: email
                  description: Required when `flow_type` is `email`. Ignored otherwise.
                  example: "customer@example.com"
                redirect_url:
                  type: string
                  format: uri
                  description: |
                    Required when `flow_type` is `redirect`. After verification the customer's
                    browser is sent to this URL with query params `session_id`, `status`, `auth_id`.
                  example: "https://yourapp.com/kyc-complete"
                webhook_url:
                  type: string
                  format: uri
                  description: Vobiz POSTs the KYC result here.
                  example: "https://yourapp.com/kyc-webhook"
                expires_in_days:
                  type: integer
                  default: 7
                  description: Days before the KYC link expires.
                  example: 14
                reminder_schedule:
                  type: array
                  description: Auto reminder emails before expiry. Email flow only.
                  items:
                    type: object
                    properties:
                      trigger:
                        type: string
                        enum: [ days_before_expiry ]
                      value:
                        type: integer
                metadata:
                  type: object
                  description: Free-form key/value object echoed back on GET and webhooks.
                  additionalProperties: true
                  example:
                    customer_ref: "TEST_001"
                    plan: "starter"
      responses:
        "201":
          description: KYC session created
          content:
            application/json:
              examples:
                email-flow:
                  summary: Email-flow response
                  value:
                    session_id: "a5f8da3c-b47f-40c3-a3e6-d2c9a0f27065"
                    account_auth_id: "MA_XXXXXXXX"
                    customer_email: "customer@example.com"
                    email_dispatched_to: "c***@example.com"
                    kyc_type: null
                    status: "email_sent"
                    expires_at: "2026-05-15T19:37:01.316686Z"
                    widget_url: null
                    kyc_link: null
                    message: "KYC email dispatched successfully"
                redirect-flow:
                  summary: Redirect-flow response
                  value:
                    session_id: "1a0f7da5-2abb-47bf-a6c3-eb5cff7feda5"
                    account_auth_id: "MA_XXXXXXXX"
                    customer_email: null
                    email_dispatched_to: null
                    kyc_type: null
                    status: "link_ready"
                    expires_at: "2026-05-15T19:37:01.841263Z"
                    widget_url: "https://kyc.vobiz.ai/verify?token=kst_cb1b3fda15c0df5cf58a283e47e9eee148ce0b2b87d7c6693f77296612f58f07"
                    kyc_link: null
                    message: "KYC session created - redirect your customer to widget_url to begin."
        "422":
          description: Validation error (e.g. email flow missing `customer_email`, redirect flow missing `redirect_url`)
        "404":
          description: '`account_auth_id` not found, or belongs to a different partner'
    get:
      operationId: list-kyc-sessions
      summary: List KYC sessions
      description: |
        Returns the authenticated partner's KYC sessions. Filter the list by
        session status or customer account, and use `page` and `size` to
        paginate the results.
      tags: [ Partner API ]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ email_sent, link_ready, opened, in_progress, kyc_completed, revoked ]
        - name: account_auth_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        account_auth_id:
                          type: string
                        customer_email:
                          type: string
                          nullable: true
                        kyc_type:
                          type: string
                          nullable: true
                        status:
                          type: string
                        expires_at:
                          type: string
                        first_opened_at:
                          type: string
                          nullable: true
                        completed_at:
                          type: string
                          nullable: true
                        webhook_url:
                          type: string
                          nullable: true
                        redirect_url:
                          type: string
                          nullable: true
                        reminder_schedule:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: integer
                              trigger:
                                type: string
                            required:
                              - value
                              - trigger
                        metadata:
                          anyOf:
                            - nullable: true
                            - type: object
                              properties:
                                plan:
                                  type: string
                                customer_ref:
                                  type: string
                              required:
                                - plan
                                - customer_ref
                        verified_data:
                          anyOf:
                            - nullable: true
                            - type: object
                              properties:
                                pan_type:
                                  type: string
                                pan_number:
                                  type: string
                                pan_name_match:
                                  type: boolean
                                completed_steps:
                                  type: array
                                  items:
                                    type: string
                                pan_registered_name:
                                  type: string
                                gender:
                                  type: string
                                address:
                                  type: string
                                aadhaar_dob:
                                  type: string
                                aadhaar_name:
                                  type: string
                                masked_aadhaar:
                                  type: string
                                pan_name:
                                  type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                        - id
                        - account_auth_id
                        - customer_email
                        - kyc_type
                        - status
                        - expires_at
                        - first_opened_at
                        - completed_at
                        - webhook_url
                        - redirect_url
                        - reminder_schedule
                        - metadata
                        - verified_data
                        - created_at
                        - updated_at
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
                required:
                  - sessions
                  - total
                  - page
                  - size
              example:
                sessions:
                  - id: "kycs_aabbccdd1234"
                    account_auth_id: "MA_XXXXXXXX"
                    customer_email: null
                    kyc_type: null
                    status: "opened"
                    expires_at: "2026-04-08T08:32:48Z"
