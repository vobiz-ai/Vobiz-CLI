      responses:
        "200":
          description: Endpoint details
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    type: string
                  application:
                    type: string
                  endpoint_id:
                    type: string
                  resource_uri:
                    type: string
                  sip_registered:
                    type: string
                  sip_uri:
                    type: string
                  sub_account:
                    nullable: true
                  username:
                    type: string
                required:
                  - alias
                  - application
                  - endpoint_id
                  - resource_uri
                  - sip_registered
                  - sip_uri
                  - sub_account
                  - username
              example:
                alias: Acme Desktop Phone
                application: /v1/Account/MA_XXXXXXXX/Application/12345678901234567/
                endpoint_id: "147322537258167"
                resource_uri: /v1/Account/MA_XXXXXXXX/Endpoint/147322537258167/
                sip_registered: "false"
                sip_uri: sip:acme_sip_user_01@registrar.vobiz.ai
                sub_account: null
                username: acme_sip_user_01
        "404":
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: update-endpoint
      summary: Update an Endpoint
      description: |
        Update an existing endpoint's configuration. You can change the
        password, alias, or attached application. The fields `username`,
        `endpoint_id`, `domain`, `allow_same_domain`, `allow_other_domains`,
        `allow_phones`, and `allow_apps` are locked after creation.
      tags: [ Endpoints ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
            example: "87654321"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                password:
                  type: string
                app_id:
                  type: string
                  pattern: "^[0-9]+$"
                  description: ID of the application to attach to this endpoint, as a string.
              required:
                - alias
                - password
            example:
              alias: John's Updated Desktop Phone
              password: NewSecurePassword456!
              app_id: "12345678901234567"
      responses:
        "202":
          description: Endpoint updated
          content:
            text/plain:
              schema:
                type: string
              example: ""
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Endpoint not found
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: string
              example: ""

    delete:
      operationId: delete-endpoint
      summary: Delete an Endpoint
      description: |
        Permanently delete an endpoint from your Vobiz account. Once deleted,
        the SIP URI will no longer be accessible, and any devices registered
        with this endpoint will be disconnected.
      tags: [ Endpoints ]
      parameters:
        - $ref: "#/components/parameters/AuthId"
        - name: endpoint_id
          in: path
