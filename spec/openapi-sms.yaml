  /broadcasts:
    post:
      tags:
      - Broadcasts
      summary: Create a broadcast
      description: Creates a broadcast in `draft` status with zero `stats` and no recipients. Only `name` and `from` are required;
        `channel` defaults to `sms` and `ratePerSecond` to 5. Nothing is sent when you create a broadcast. Next, upload recipients
        with `POST /broadcasts/{id}/recipients`, check the rendered text with `GET /broadcasts/{id}/preview`, then start sending
        with `POST /broadcasts/{id}/launch`.
      operationId: create-broadcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
            examples:
              basic:
                summary: Template with variables
                value:
                  name: October pricing update
                  from: '+14155550100'
                  template: Hi {{name}}, your refund of {{amount}} is on its way.
                  ratePerSecond: 5
                  tag: pricing-oct
              scheduled:
                summary: Scheduled start
                value:
                  name: Weekend reminder
                  from: '+14155550100'
                  template: Hi {{name}}, your appointment is tomorrow at {{time}}.
                  scheduledAt: '2026-10-15T09:00:00Z'
              india:
                summary: India with DLT IDs
                value:
                  name: OTP reminder
                  from: '+919876543210'
                  template: Your OTP is {{otp}}.
                  dltEntityId: '1001234567890123456'
                  dltHeaderId: '1001234567'
                  dltTemplateId: '10012345678901234567'
      responses:
        '201':
          description: The new draft broadcast with zero stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
              example:
                id: 3f8d2a6e-5b1c-4e7f-a9d0-2c4b6e8f1a35
                accountId: MA_XXXXXXXX
                name: October pricing update
                from: '+14155550100'
                channel: sms
                template: Hi {{name}}, your refund of {{amount}} is on its way.
                status: draft
                scheduledAt: null
                ratePerSecond: 5
                tag: pricing-oct
                dltEntityId: ''
                dltHeaderId: ''
                dltTemplateId: ''
                columns: null
                stats:
                  total: 0
                  pending: 0
                  sent: 0
                  delivered: 0
                  failed: 0
                  optedOut: 0
                  skipped: 0
                createdAt: '2026-10-12T10:30:00Z'
                updatedAt: '2026-10-12T10:30:00Z'
                startedAt: null
                completedAt: null
        '400':
          description: A field is missing or invalid. The `error` names the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                body:
                  value:
                    error: invalid request body
                name:
                  value:
                    error: name is required
                nameLength:
                  value:
                    error: name is too long (255 characters max)
                from:
                  value:
                    error: from is required
                fromFormat:
                  value:
                    error: from must be a phone number or a sender ID (up to 11 letters and digits)
                channel:
                  value:
                    error: channel must be sms
                scheduledAt:
                  value:
                    error: scheduledAt must be an RFC 3339 timestamp
                rate:
                  value:
                    error: ratePerSecond must be between 1 and 50
                rateType:
                  value:
                    error: ratePerSecond must be an integer
                type:
                  value:
                    error: template must be a string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
